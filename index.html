<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#176b5b">
<title>KriDari - كراء العقارات في الجزائر</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7f6;
  color:#172033
}

button,input,select,textarea{
  font:inherit
}

button{
  border:0;
  cursor:pointer;
  border-radius:10px;
  padding:13px 18px;
  background:#176b5b;
  color:white;
  transition:.2s
}

button:hover{
  filter:brightness(.95)
}

button.secondary{
  background:#edf3f1;
  color:#176b5b
}

button.danger{
  background:#fff0f0;
  color:#b42318
}

header{
  background:white;
  padding:18px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 10px #0000000b
}

.logo{
  font-size:31px;
  font-weight:800;
  color:#176b5b
}

.logo span{
  color:#f29f05
}

.nav{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}

.user{
  font-size:16px;
  color:#172033
}

.hero{
  background:#176b5b;
  color:white;
  text-align:center;
  padding:75px 20px 65px
}

.hero h1{
  font-size:43px;
  margin:0 0 20px
}

.hero p{
  font-size:21px;
  margin:0 0 35px
}

.search-box{
  max-width:950px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:18px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1.4fr auto;
  gap:10px
}

input,select,textarea{
  width:100%;
  border:1px solid #d9dfdd;
  border-radius:10px;
  padding:13px;
  background:white;
  color:#172033;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:#176b5b;
  box-shadow:0 0 0 3px #176b5b18
}

textarea{
  min-height:110px;
  resize:vertical
}

main{
  max-width:1150px;
  margin:auto;
  padding:45px 6%
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px
}

.section-title h2{
  font-size:32px;
  margin:0
}

.count{
  color:#68717e
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #e0e5e3;
  box-shadow:0 4px 15px #00000008
}

.photo{
  height:190px;
  background:linear-gradient(135deg,#dce9e5,#f1d9aa);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#176b5b;
  font-weight:bold;
  position:relative;
  overflow:hidden
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover
}

.badge{
  position:absolute;
  top:12px;
  right:12px;
  background:white;
  color:#176b5b;
  padding:7px 10px;
  border-radius:20px;
  font-size:13px
}

.card-body{
  padding:18px
}

.price{
  font-size:21px;
  font-weight:bold;
  color:#176b5b;
  margin-bottom:8px
}

.card h3{
  margin:7px 0;
  font-size:19px
}

.muted{
  color:#68717e;
  font-size:14px;
  line-height:1.7
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:15px
}

.card-actions button{
  flex:1
}

.empty{
  text-align:center;
  padding:50px;
  background:white;
  border-radius:15px;
  color:#68717e
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#00000099;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal.show{
  display:flex
}

.modal-box{
  background:white;
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:18px;
  padding:25px;
  position:relative
}

.close{
  position:absolute;
  left:18px;
  top:15px;
  width:40px;
  height:40px;
  border-radius:50%;
  padding:0;
  background:#f1f3f3;
  color:#333;
  font-size:25px;
  line-height:40px
}

.modal-title{
  margin:0 45px 25px 0;
  color:#176b5b
}

.form-group{
  margin-bottom:15px
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-weight:bold
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px
}

.modal-actions button{
  flex:1
}

.preview{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px
}

.preview img{
  width:90px;
  height:70px;
  object-fit:cover;
  border-radius:8px
}

footer{
  background:#172033;
  color:white;
  text-align:center;
  padding:30px 20px;
  margin-top:30px
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#172033;
  color:white;
  padding:13px 20px;
  border-radius:10px;
  z-index:300;
  display:none
}

.toast.show{
  display:block
}

@media(max-width:850px){
  header{
    flex-direction:column
  }

  .nav{
    justify-content:center
  }

  .search-box{
    grid-template-columns:1fr
  }

  .cards{
    grid-template-columns:1fr
  }

  .hero h1{
    font-size:31px
  }

  .hero p{
    font-size:18px
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .section-title h2{
    font-size:26px
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    Kri<span>Dari</span>
  </div>

  <div class="nav" id="nav">
    <button onclick="openAdd()">+ أضف عقارك</button>
    <button class="secondary" onclick="openLogin()">تسجيل الدخول</button>
  </div>

</header>


<section class="hero">

  <h1>🏠 لقّي دارك بسهولة</h1>

  <p>منصة كراء الشقق والعقارات في الجزائر</p>

  <div class="search-box">

    <select id="wilaya">
      <option value="">كل الولايات</option>
      <option>الجزائر</option>
      <option>وهران</option>
      <option>قسنطينة</option>
      <option>غليزان</option>
      <option>عنابة</option>
      <option>سطيف</option>
      <option>البليدة</option>
      <option>تيزي وزو</option>
      <option>مستغانم</option>
      <option>الشلف</option>
      <option>تلمسان</option>
      <option>باتنة</option>
      <option>بجاية</option>
      <option>سيدي بلعباس</option>
      <option>الجلفة</option>
      <option>بسكرة</option>
      <option>ورقلة</option>
    </select>

    <select id="type">
      <option value="">كل الأنواع</option>
      <option>F1</option>
      <option>F2</option>
      <option>F3</option>
      <option>F4</option>
      <option>F5</option>
      <option>Villa</option>
      <option>Studio</option>
      <option>Duplex</option>
    </select>

    <input
      id="maxPrice"
      type="number"
      placeholder="أقصى سعر DA"
    >

    <input
      id="searchText"
      type="text"
      placeholder="ابحث عن مدينة أو عنوان"
    >

    <button onclick="searchProperties()">🔎 بحث</button>

  </div>

</section>


<main>

  <div class="section-title">
    <h2>العقارات المتاحة</h2>
    <span class="count" id="count"></span>
  </div>

  <div id="cards" class="cards"></div>

</main>


<footer>
  <strong>KriDari</strong>
  <br>
  منصة كراء العقارات في الجزائر
  <br><br>
  © 2026 KriDari
</footer>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <div id="modalContent"></div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================
   DATA
========================= */

const defaultProperties = [

  {
    id:1,
    title:"شقة F3 عصرية",
    wilaya:"وهران",
    city:"السانية",
    type:"F3",
    price:45000,
    rooms:3,
    furnished:"مفروشة",
    phone:"0550000000",
    description:"شقة جميلة ومجهزة في موقع هادئ."
  },

  {
    id:2,
    title:"شقة F2 وسط المدينة",
    wilaya:"الجزائر",
    city:"باب الزوار",
    type:"F2",
    price:38000,
    rooms:2,
    furnished:"غير مفروشة",
    phone:"0551111111",
    description:"شقة قريبة من جميع الخدمات."
  },

  {
    id:3,
    title:"F4 واسعة للعائلات",
    wilaya:"قسنطينة",
    city:"الخروب",
    type:"F4",
    price:55000,
    rooms:4,
    furnished:"غير مفروشة",
    phone:"0552222222",
    description:"مساحة مناسبة للعائلات."
  },

  {
    id:4,
    title:"F1 مفروشة",
    wilaya:"وهران",
    city:"وهران",
    type:"F1",
    price:30000,
    rooms:1,
    furnished:"مفروشة",
    phone:"0553333333",
    description:"شقة صغيرة ومفروشة."
  },

  {
    id:5,
    title:"Villa عائلية",
    wilaya:"غليزان",
    city:"غليزان",
    type:"Villa",
    price:85000,
    rooms:5,
    furnished:"غير مفروشة",
    phone:"0554444444",
    description:"فيلا عائلية واسعة."
  }

];


/* =========================
   STORAGE
========================= */

let properties =
  JSON.parse(localStorage.getItem("kridari_properties")) ||
  defaultProperties;

let loggedUser =
  JSON.parse(localStorage.getItem("kridari_user")) ||
  null;


function saveProperties(){

  localStorage.setItem(
    "kridari_properties",
    JSON.stringify(properties)
  );

}


/* =========================
   RENDER
========================= */

function render(list = properties){

  const cards = document.getElementById("cards");

  document.getElementById("count").textContent =
    list.length + " عقار";

  if(!list.length){

    cards.innerHTML = `
      <div class="empty">
        <h3>لا توجد عقارات</h3>
        <p>جرّب تغيير خيارات البحث.</p>
      </div>
    `;

    return;
  }


  cards.innerHTML = list.map(p => `

    <article class="card">

      <div class="photo">

        <span class="badge">✓ إعلان</span>

        ${
          p.image
          ? `<img src="${p.image}" alt="${p.title}">`
          : `🏠`
        }

      </div>


      <div class="card-body">

        <div class="price">
          ${Number(p.price).toLocaleString("fr-DZ")} DA / شهر
        </div>

        <h3>${escapeHtml(p.title)}</h3>

        <p class="muted">
          📍 ${escapeHtml(p.city)}، ${escapeHtml(p.wilaya)}
        </p>

        <p class="muted">
          ${escapeHtml(p.type)}
          · ${p.rooms} غرف
          · ${escapeHtml(p.furnished)}
        </p>

        <div class="card-actions">

          <button onclick="showDetails(${p.id})">
            التفاصيل
          </button>

          <button
            class="secondary"
            onclick="addFavorite(${p.id})">
            ❤️
          </button>

        </div>

      </div>

    </article>

  `).join("");

}


/* =========================
   SEARCH
========================= */

function searchProperties(){

  const w =
    document.getElementById("wilaya").value;

  const t =
    document.getElementById("type").value;

  const max =
    Number(document.getElementById("maxPrice").value);

  const text =
    document.getElementById("searchText").value
    .trim()
    .toLowerCase();


  const result = properties.filter(p => {

    const matchWilaya =
      !w || p.wilaya === w;

    const matchType =
      !t || p.type === t;

    const matchPrice =
      !max || Number(p.price) <= max;

    const matchText =
      !text ||
      p.city.toLowerCase().includes(text) ||
      p.title.toLowerCase().includes(text) ||
      p.wilaya.toLowerCase().includes(text);


    return (
      matchWilaya &&
      matchType &&
      matchPrice &&
      matchText
    );

  });


  render(result);

}


/* =========================
   MODAL
========================= */

function openModal(content){

  document.getElementById("modalContent").innerHTML =
    content;

  document.getElementById("modal").classList.add("show");

}


function closeModal(){

  document.getElementById("modal").classList.remove("show");

}


document.getElementById("modal").addEventListener(
  "click",
  function(e){

    if(e.target === this){

      closeModal();

    }

  }
);


/* =========================
   LOGIN
========================= */

function openLogin(){

  openModal(`

    <h2 class="modal-title">
      🔐 تسجيل الدخول
    </h2>

    <div class="form-group">

      <label>البريد الإلكتروني</label>

      <input
        id="loginEmail"
        type="email"
        placeholder="example@email.com"
      >

    </div>


    <div class="form-group">

      <label>كلمة المرور</label>

      <input
        id="loginPassword"
        type="password"
        placeholder="كلمة المرور"
      >

    </div>


    <div class="modal-actions">

      <button onclick="login()">
        دخول
      </button>

      <button
        class="secondary"
        onclick="openRegister()">
        إنشاء حساب
      </button>

    </div>

  `);

}


function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value.trim();


  if(!email || !password){

    showToast("يرجى إدخال البريد وكلمة المرور");

    return;

  }


  loggedUser = {
    name: email.split("@")[0],
    email: email
  };


  localStorage.setItem(
    "kridari_user",
    JSON.stringify(loggedUser)
  );


  closeModal();

  updateHeader();

  showToast("تم تسجيل الدخول بنجاح ✅");

}


/* =========================
   REGISTER
========================= */

function openRegister(){

  openModal(`

    <h2 class="modal-title">
      📝 إنشاء حساب جديد
    </h2>


    <div class="form-group">

      <label>الاسم</label>

      <input
        id="regName"
        type="text"
        placeholder="اسمك"
      >

    </div>


    <div class="form-group">

      <label>البريد الإلكتروني</label>

      <input
        id="regEmail"
        type="email"
        placeholder="example@email.com"
      >

    </div>


    <div class="form-group">

      <label>رقم الهاتف</label>

      <input
        id="regPhone"
        type="tel"
        placeholder="05xxxxxxxx"
      >

    </div>


    <div class="form-group">

      <label>كلمة المرور</label>

      <input
        id="regPassword"
        type="password"
        placeholder="كلمة المرور"
      >

    </div>


    <div class="modal-actions">

      <button onclick="register()">
        إنشاء الحساب
      </button>

      <button
        class="secondary"
        onclick="openLogin()">
        لدي حساب
      </button>

    </div>

  `);

}


function register(){

  const name =
    document.getElementById("regName").value.trim();

  const email =
    document.getElementById("regEmail").value.trim();

  const phone =
    document.getElementById("regPhone").value.trim();

  const password =
    document.getElementById("regPassword").value.trim();


  if(!name || !email || !phone || !password){

    showToast("يرجى ملء جميع المعلومات");

    return;

  }


  loggedUser = {
    name,
    email,
    phone
  };


  localStorage.setItem(
    "kridari_user",
    JSON.stringify(loggedUser)
  );


  closeModal();

  updateHeader();

  showToast("تم إنشاء الحساب بنجاح 🎉");

}


/* =========================
   HEADER
========================= */

function updateHeader(){

  const nav =
    document.getElementById("nav");


  if(loggedUser){

    nav.innerHTML = `

      <span class="user">
        مرحبًا <strong>${escapeHtml(loggedUser.name)}</strong>
      </span>

      <button onclick="openAdd()">
        + أضف عقارك
      </button>

      <button
        class="secondary"
        onclick="logout()">
        خروج
      </button>

    `;

  }else{

    nav.innerHTML = `

      <button onclick="openAdd()">
        + أضف عقارك
      </button>

      <button
        class="secondary"
        onclick="openLogin()">
        تسجيل الدخول
      </button>

    `;

  }

}


function logout(){

  loggedUser = null;

  localStorage.removeItem("kridari_user");

  updateHeader();

  showToast("تم تسجيل الخروج");

}


/* =========================
   ADD PROPERTY
========================= */

function openAdd(){

  if(!loggedUser){

    openModal(`

      <h2 class="modal-title">
        🔐 يجب تسجيل الدخول أولًا
      </h2>

      <p>
        لإنشاء إعلان وإضافة عقارك،
        يرجى تسجيل الدخول أو إنشاء حساب جديد.
      </p>

      <div class="modal-actions">

        <button onclick="openLogin()">
          تسجيل الدخول
        </button>

        <button
          class="secondary"
          onclick="openRegister()">
          إنشاء حساب
        </button>

      </div>

    `);

    return;

  }


  openModal(`

    <h2 class="modal-title">
      🏠 أضف عقارك
    </h2>


    <div class="form-group">

      <label>عنوان الإعلان *</label>

      <input
        id="pTitle"
        placeholder="مثال: شقة F3 جميلة"
      >

    </div>


    <div class="form-grid">

      <div class="form-group">

        <label>الولاية *</label>

        <select id="pWilaya">

          <option value="">اختر الولاية</option>
          <option>الجزائر</option>
          <option>وهران</option>
          <option>قسنطينة</option>
          <option>غليزان</option>
          <option>عنابة</option>
          <option>سطيف</option>
          <option>البليدة</option>
          <option>تيزي وزو</option>
          <option>مستغانم</option>
          <option>الشلف</option>
          <option>تلمسان</option>
          <option>باتنة</option>
          <option>بجاية</option>
          <option>سيدي بلعباس</option>
          <option>الجلفة</option>
          <option>بسكرة</option>
          <option>ورقلة</option>

        </select>

      </div>


      <div class="form-group">

        <label>المدينة / البلدية *</label>

        <input
          id="pCity"
          placeholder="مثال: السانية"
        >

      </div>


      <div class="form-group">

        <label>نوع العقار *</label>

        <select id="pType">

          <option value="">اختر النوع</option>
          <option>F1</option>
          <option>F2</option>
          <option>F3</option>
          <option>F4</option>
          <option>F5</option>
          <option>Villa</option>
          <option>Studio</option>
          <option>Duplex</option>

        </select>

      </div>


      <div class="form-group">

        <label>عدد الغرف</label>

        <input
          id="pRooms"
          type="number"
          min="1"
          placeholder="3"
        >

      </div>


      <div class="form-group">

        <label>السعر الشهري DA *</label>

        <input
          id="pPrice"
          type="number"
          min="0"
          placeholder="45000"
        >

      </div>


      <div class="form-group">

        <label>الحالة</label>

        <select id="pFurnished">

          <option>غير مفروشة</option>
          <option>مفروشة</option>

        </select>

      </div>

    </div>


    <div class="form-group">

      <label>رقم الهاتف *</label>

      <input
        id="pPhone"
        type="tel"
        placeholder="05xxxxxxxx"
        value="${loggedUser.phone || ""}"
      >

    </div>


    <div class="form-group">

      <label>الوصف</label>

      <textarea
        id="pDescription"
        placeholder="اكتب معلومات إضافية عن العقار..."
      ></textarea>

    </div>


    <div class="form-group">

      <label>صور العقار</label>

      <input
        id="pImages"
        type="file"
        accept="image/*"
        multiple
        onchange="previewImages()"
      >

      <div
        id="preview"
        class="preview">
      </div>

    </div>


    <div class="modal-actions">

      <button onclick="publishProperty()">
        نشر العقار 🚀
      </button>

      <button
        class="secondary"
        onclick="closeModal()">
        إلغاء
      </button>

    </div>

  `);

}


/* =========================
   IMAGE PREVIEW
========================= */

let selectedImage = "";


function previewImages(){

  const files =
    document.getElementById("pImages").files;

  const preview =
    document.getElementById("preview");

  preview.innerHTML = "";

  if(!files.length){

    selectedImage = "";

    return;

  }


  /*
   نستعمل أول صورة كصورة رئيسية
  */

  const reader = new FileReader();

  reader.onload = function(e){

    selectedImage = e.target.result;

  };

  reader.readAsDataURL(files[0]);


  Array.from(files).slice(0,6).forEach(file => {

    const reader2 = new FileReader();

    reader2.onload = function(e){

      preview.innerHTML +=
        `<img src="${e.target.result}">`;

    };

    reader2.readAsDataURL(file);

  });

}


/* =========================
   PUBLISH PROPERTY
========================= */

function publishProperty(){

  const title =
    document.getElementById("pTitle").value.trim();

  const wilaya =
    document.getElementById("pWilaya").value;

  const city =
    document.getElementById("pCity").value.trim();

  const type =
    document.getElementById("pType").value;

  const rooms =
    Number(document.getElementById("pRooms").value);

  const price =
    Number(document.getElementById("pPrice").value);

  const furnished =
    document.getElementById("pFurnished").value;

  const phone =
    document.getElementById("pPhone").value.trim();

  const description =
    document.getElementById("pDescription").value.trim();


  if(
    !title ||
    !wilaya ||
    !city ||
    !type ||
    !price ||
    !phone
  ){

    showToast(
      "يرجى ملء المعلومات الأساسية للعقار"
    );

    return;

  }


  const property = {

    id:Date.now(),

    title,

    wilaya,

    city,

    type,

    rooms:rooms || 1,

    price,

    furnished,

    phone,

    description,

    image:selectedImage || "",

    owner:loggedUser.name,

    createdAt:new Date().toISOString()

  };


  properties.unshift(property);

  saveProperties();

  closeModal();

  render();

  showToast(
    "تم نشر العقار بنجاح ✅"
  );

}

      p.image
      ? `<img

      🏠 النوع:

    </p>

    </p>

    </p>

/* =========================
   VISIT
========================= */

function requestVisit(id){

  const p =
    properties.find(x => x.id === id);

  if(!loggedUser){

    openLogin();

    return;

  }


  openModal(`

    <h2 class="modal-title">
      📅 طلب زيارة
    </h2>

    <p>
      العقار:
      <strong>${escapeHtml(p.title)}</strong>
    </p>


    <div class="form-group">

      <label>التاريخ المقترح</label>

      <input
        id="visitDate"
        type="date"
      >

    </div>


    <div class="form-group">

      <label>ملاحظات</label>

      <textarea
        id="visitNote"
        placeholder="مثال: أفضل الفترة المسائية"
      ></textarea>

    </div>


    <button onclick="sendVisit()">
      إرسال طلب الزيارة
    </button>

  `);

}


function sendVisit(){

  const date =
    document.getElementById("visitDate").value;

  if(!date){

    showToast("اختر تاريخ الزيارة");

    return;

  }

  closeModal();

  showToast(
    "تم إرسال طلب الزيارة بنجاح ✅"
  );

}


/* =========================
   FAVORITES
========================= */

function addFavorite(id){

  let favorites =
    JSON.parse(
      localStorage.getItem("kridari_favorites")
    ) || [];


  if(!favorites.includes(id)){

    favorites.push(id);

    localStorage.setItem(
      "kridari_favorites",
      JSON.stringify(favorites)
    );

    showToast("تمت إضافة العقار إلى المفضلة ❤️");

  }else{

    showToast("العقار موجود بالفعل في المفضلة");

  }

}


/* =========================
   CONTACT
========================= */

function contactOwner(phone){

  window.location.href =
    "tel:" + phone;

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  },3000);

}


/* =========================
   SECURITY / HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

updateHeader();

render();

</script>
