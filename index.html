<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b5b">
<title>KriDari - كراء العقارات في الجزائر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--green:#176b5b;--green2:#237f6d;--gold:#f29f05;--ink:#172033;--muted:#68717e;--bg:#f6f8f7;--white:#fff}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--green);color:#fff;cursor:pointer}
button:hover{filter:brightness(.96)}
button.secondary{background:#edf4f2;color:var(--green)}
button.danger{background:#fff0f0;color:#b42318}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e7ecea;padding:13px 5%;display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{font-size:30px;font-weight:800;color:var(--green);white-space:nowrap}.logo span{color:var(--gold)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.user{font-weight:700;margin-inline:4px}.small{font-size:13px;color:var(--muted)}
.hero{background:linear-gradient(145deg,var(--green),#126050);color:#fff;text-align:center;padding:58px 20px 50px}
.hero h1{font-size:42px;margin:0 0 12px}.hero p{font-size:18px;opacity:.94}
.searchbox{max-width:1050px;margin:28px auto 0;background:#fff;padding:12px;border-radius:16px;box-shadow:0 12px 35px #0002}
.searchgrid{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr auto;gap:9px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d9e0de;border-radius:9px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #176b5b18}
.advanced{display:none;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:9px}.advanced.open{display:grid}
.checks{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 3px}.checks label{display:flex;align-items:center;gap:6px;font-size:14px}.checks input{width:auto}
.wrap{max-width:1180px;margin:auto;padding:35px 5% 70px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.section-head h2{margin:0;font-size:30px}.count{color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select{width:auto;min-width:160px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid #e0e5e3;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #00000008;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 25px #00000012}
.photo{height:190px;background:linear-gradient(135deg,#d9e6e2,#efd5a7);position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding:12px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.badge{position:relative;background:#fffdf2;color:#725300;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700;z-index:1}.heart{position:relative;z-index:2;width:38px;height:38px;padding:0;border-radius:50%;background:#fff;color:#9b9b9b;font-size:20px;box-shadow:0 2px 8px #0002}.heart.on{color:#d33;background:#fff}
.body{padding:16px}.price{font-size:20px;font-weight:800;color:var(--green)}.title{margin:8px 0;font-size:19px}.muted{color:var(--muted);font-size:14px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{background:#f1f6f4;color:#315d53;border-radius:20px;padding:5px 9px;font-size:12px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}
.empty{background:#fff;border:1px dashed #ccd6d3;border-radius:15px;padding:35px;text-align:center;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}
.box{background:#fff;border-radius:18px;width:min(680px,100%);max-height:92vh;overflow:auto;position:relative;padding:24px}.close{position:absolute;top:10px;left:10px;width:38px;height:38px;padding:0;border-radius:50%;background:#f0f3f2;color:#344;font-size:24px;line-height:1}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgroup{margin-bottom:8px}.formgroup label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}.preview img{width:100%;height:75px;object-fit:cover;border-radius:8px}
.detail-gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px;margin:-24px -24px 18px}.detail-gallery img{width:100%;height:150px;object-fit:cover}.detail-gallery img:first-child{height:307px;grid-row:span 2}.noimg{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d9e6e2,#efd5a7);color:#397265}
.footer{background:#123f37;color:#dce9e6;text-align:center;padding:28px 20px}.footer b{color:#fff}
.toast{position:fixed;bottom:20px;right:20px;background:#172033;color:#fff;padding:13px 17px;border-radius:10px;z-index:100;display:none;box-shadow:0 8px 25px #0003}.toast.show{display:block}
@media(max-width:900px){.searchgrid{grid-template-columns:1fr 1fr}.advanced.open{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){header{align-items:flex-start}.nav{gap:5px}.nav button{padding:9px 11px}.hero{padding:42px 15px}.hero h1{font-size:31px}.searchgrid,.advanced.open,.formgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.toolbar{width:100%}.toolbar select{width:100%}.box{padding:20px}.detail-gallery{margin:-20px -20px 16px}.detail-gallery img:first-child{height:220px}.detail-gallery img{height:105px}}
</style>
</head>
<body>
<header>
  <div class="logo">Kri<span>Dari</span></div>
  <div id="nav" class="nav"></div>
</header>

<section class="hero">
  <h1>لقّي دارك بسهولة 🏠</h1>
  <p>منصة كراء الشقق والعقارات في الجزائر</p>
  <div class="searchbox">
    <div class="searchgrid">
      <select id="w"><option value="">كل الولايات</option><option>وهران</option><option>الجزائر</option><option>قسنطينة</option><option>غليزان</option><option>عنابة</option><option>سطيف</option><option>تلمسان</option></select>
      <select id="t"><option value="">كل الأنواع</option><option>F1</option><option>F2</option><option>F3</option><option>F4</option><option>Villa</option><option>Studio</option></select>
      <input id="m" type="number" min="0" placeholder="أقصى سعر DA">
      <input id="q" type="search" placeholder="ابحث عن مدينة أو عنوان">
      <button onclick="applyFilters()">بحث 🔎</button>
    </div>
    <div id="advanced" class="advanced">
      <select id="beds"><option value="">عدد الغرف</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5+</option></select>
      <select id="rent"><option value="">نوع الكراء</option><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select>
      <input id="min" type="number" min="0" placeholder="أقل سعر DA">
      <select id="sort"><option value="new">الأحدث</option><option value="low">الأرخص أولاً</option><option value="high">الأغلى أولاً</option></select>
      <div class="checks">
        <label><input id="furn" type="checkbox"> مفروشة</label>
        <label><input id="park" type="checkbox"> Parking</label>
      </div>
    </div>
    <div style="text-align:center;margin-top:7px"><button class="secondary" onclick="toggleAdvanced()">⚙️ بحث متقدم</button></div>
  </div>
</section>

<main class="wrap">
  <div class="section-head">
    <div><h2>العقارات المتاحة</h2><div id="status" class="count">جاري الاتصال...</div></div>
    <div class="toolbar"><select id="quickSort" onchange="quickSort()"><option value="new">الأحدث</option><option value="low">السعر: من الأقل</option><option value="high">السعر: من الأعلى</option></select><button class="secondary" onclick="showFavorites()">❤️ المفضلة</button></div>
  </div>
  <div id="cards" class="cards"></div>
</main>

<footer class="footer"><b>KriDari</b> — منصة جزائرية للعثور على السكن المناسب بسهولة.</footer>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="box"><button class="close" aria-label="إغلاق" onclick="closeModal()">×</button><div id="content"></div></div>
</div>
<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script>
const sb=supabase.createClient(KRIDARI_CONFIG.SUPABASE_URL,KRIDARI_CONFIG.SUPABASE_PUBLISHABLE_KEY);
const nav=document.querySelector('#nav'),cards=document.querySelector('#cards'),status=document.querySelector('#status');
const modal=document.querySelector('#modal'),content=document.querySelector('#content');
let allProperties=[], filteredProperties=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    async function login(){

  show(`
    <h2>تسجيل الدخول</h2>

    <div class="formgroup">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail" type="email"
        placeholder="example@email.com">
    </div>

    <div class="formgroup">
      <label>كلمة المرور</label>
      <input id="loginPassword" type="password"
        placeholder="••••••••">
    </div>

    <button onclick="doLogin()">
      دخول
    </button>

    <p class="small">
      ليس لديك حساب؟
      <button class="secondary"
        onclick="signup()">
        إنشاء حساب
      </button>
    </p>
  `);
}

async function doLogin(){

  const email=
    document.querySelector('#loginEmail').value.trim();

  const password=
    document.querySelector('#loginPassword').value;

  if(!email || !password){

    toast('يرجى إدخال البريد وكلمة المرور');

    return;
  }

  const {error}=
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    toast(error.message);

    return;
  }

  closeModal();

  toast('تم تسجيل الدخول بنجاح');

  render();
}

async function signup(){

  show(`
    <h2>إنشاء حساب</h2>

    <div class="formgrid">

      <div class="formgroup">
        <label>الاسم</label>
        <input id="signupName"
          placeholder="الاسم الكامل">
      </div>

      <div class="formgroup">
        <label>رقم الهاتف</label>
        <input id="signupPhone"
          type="tel"
          placeholder="05xxxxxxxx">
      </div>

    </div>

    <div class="formgroup">
      <label>البريد الإلكتروني</label>
      <input id="signupEmail"
        type="email"
        placeholder="example@email.com">
    </div>

    <div class="formgroup">
      <label>كلمة المرور</label>
      <input id="signupPassword"
        type="password"
        placeholder="6 أحرف على الأقل">
    </div>

    <button onclick="doSignup()">
      إنشاء الحساب
    </button>
  `);
}

async function doSignup(){

  const name=
    document.querySelector('#signupName').value.trim();

  const phone=
    document.querySelector('#signupPhone').value.trim();

  const email=
    document.querySelector('#signupEmail').value.trim();

  const password=
    document.querySelector('#signupPassword').value;

  if(!name || !email || !password){

    toast('يرجى ملء المعلومات الأساسية');

    return;
  }

  if(password.length<6){

    toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');

    return;
  }

  const {data,error}=
    await sb.auth.signUp({

      email,
      password,

      options:{
        data:{
          full_name:name,
          phone:phone
        }
      }

    });

  if(error){

    toast(error.message);

    return;
  }

  if(data.user){

    toast(
      'تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا طُلب ذلك.'
    );

    closeModal();

  }
}

async function out(){

  await sb.auth.signOut();

  toast('تم تسجيل الخروج');

  render();
}

async function add(){

  const {data:{session}}=
    await sb.auth.getSession();

  if(!session){

    login();

    toast('سجل الدخول أولاً');

    return;
  }

  show(`

    <h2>أضف عقارك 🏠</h2>

    <div class="formgrid">

      <div class="formgroup">
        <label>عنوان العقار *</label>
        <input id="pTitle"
          placeholder="مثال: شقة F3 عصرية">
      </div>

      <div class="formgroup">
        <label>الولاية *</label>
        <select id="pWilaya">

          <option value="">اختر الولاية</option>
          <option>وهران</option>
          <option>الجزائر</option>
          <option>قسنطينة</option>
          <option>غليزان</option>
          <option>عنابة</option>
          <option>سطيف</option>
          <option>تلمسان</option>

        </select>
      </div>

      <div class="formgroup">
        <label>البلدية *</label>
        <input id="pMunicipality"
          placeholder="البلدية">
      </div>

      <div class="formgroup">
        <label>نوع العقار *</label>
        <select id="pType">

          <option value="">اختر النوع</option>
          <option>F1</option>
          <option>F2</option>
          <option>F3</option>
          <option>F4</option>
          <option>Villa</option>
          <option>Studio</option>

        </select>
      </div>

      <div class="formgroup">
        <label>السعر *</label>
        <input id="pPrice"
          type="number"
          min="0"
          placeholder="45000">
      </div>

      <div class="formgroup">
        <label>نوع الكراء</label>
        <select id="pRent">

          <option value="monthly">
            شهري
          </option>

          <option value="daily">
            يومي
          </option>

          <option value="yearly">
            سنوي
          </option>

        </select>
      </div>

      <div class="formgroup">
        <label>عدد الغرف</label>
        <input id="pBeds"
          type="number"
          min="1"
          value="1">
      </div>

      <div class="formgroup">
        <label>عدد الحمامات</label>
        <input id="pBaths"
          type="number"
          min="0"
          value="1">
      </div>

    </div>

    <div class="checks">

      <label>
        <input id="pFurn"
          type="checkbox">
        مفروشة
      </label>

      <label>
        <input id="pPark"
          type="checkbox">
        Parking
      </label>

    </div>

    <div class="formgroup">

      <label>وصف العقار</label>

      <textarea id="pDesc"
        rows="4"
        placeholder="اكتب وصفاً مختصراً للعقار..."></textarea>

    </div>

    <div class="formgroup">

      <label>صور العقار</label>

      <input id="pImages"
        type="file"
        multiple
        accept="image/*"
        onchange="previewImages()">

      <div id="preview"
        class="preview"></div>

    </div>

    <button onclick="publishProperty()">
      نشر العقار
    </button>

  `);
}

function previewImages(){

  const files=
    document.querySelector('#pImages').files;

  const box=
    document.querySelector('#preview');

  box.innerHTML='';

  [...files].slice(0,8).forEach(file=>{

    const img=
      document.createElement('img');

    img.src=
      URL.createObjectURL(file);

    box.appendChild(img);

  });
}

async function publishProperty(){

  const {data:{session}}=
    await sb.auth.getSession();

  if(!session){

    toast('انتهت الجلسة. سجل الدخول مرة أخرى');

    return;
  }

  const title=
    document.querySelector('#pTitle').value.trim();

  const wilaya=
    document.querySelector('#pWilaya').value;

  const municipality=
    document.querySelector('#pMunicipality').value.trim();

  const type=
    document.querySelector('#pType').value;

  const price=
    Number(document.querySelector('#pPrice').value);

  const rent=
    document.querySelector('#pRent').value;

  const beds=
    Number(document.querySelector('#pBeds').value)||1;

  const baths=
    Number(document.querySelector('#pBaths').value)||0;

  const furnished=
    document.querySelector('#pFurn').checked;

  const parking=
    document.querySelector('#pPark').checked;

  const description=
    document.querySelector('#pDesc').value.trim();

  if(
    !title ||
    !wilaya ||
    !municipality ||
    !type ||
    !price
  ){

    toast('يرجى إكمال المعلومات المطلوبة');

    return;
  }

  const {data:property,error}=
    await sb
      .from('properties')
      .insert({

        owner_id:session.user.id,

        title,
        wilaya,
        municipality,

        property_type:type,

        price,
        rent_type:rent,

        bedrooms:beds,
        bathrooms:baths,

        furnished,
        parking,

        description,

        status:'pending'

      })
      .select()
      .single();

  if(error){

    toast(error.message);

    return;
  }

  const files=
    [...(
      document.querySelector('#pImages')
      .files||[]
    )];

  let firstImage='';

  for(
    let i=0;
    i<files.length && i<8;
    i++
  ){

    const file=files[i];

    const ext=
      file.name.split('.').pop();

    const path=
      session.user.id+
      '/' +
      property.id+
      '/' +
      Date.now()+
      '-' +
      i+
      '.'+
      ext;

    const {error:uploadError}=
      await sb
        .storage
        .from('property-images')
        .upload(
          path,
          file,
          {
            upsert:false,
            contentType:file.type
          }
        );

    if(uploadError){

      console.log(uploadError);

      continue;
    }

    const url=
      imageUrl(path);

    if(!firstImage)
      firstImage=url;

    await sb
      .from('property_images')
      .insert({

        property_id:property.id,
        storage_path:path

      });

  }

  if(firstImage){

    await sb
      .from('properties')
      .update({
        cover_image_url:firstImage
      })
      .eq('id',property.id);

  }

  closeModal();

  toast(
    'تم إرسال العقار للمراجعة بنجاح ✅'
  );

  await load();
}

async function requestVisit(id){

  const {data:{session}}=
    await sb.auth.getSession();

  if(!session){

    login();

    toast('سجل الدخول أولاً');

    return;
  }

  show(`

    <h2>طلب زيارة 📅</h2>

    <p class="muted">
      اختر التاريخ والوقت المناسبين.
    </p>

    <div class="formgroup">

      <label>التاريخ</label>

      <input
        id="visitDate"
        type="date">

    </div>

    <div class="formgroup">

      <label>الوقت</label>

      <input
        id="visitTime"
        type="time">

    </div>

    <div class="formgroup">

      <label>ملاحظة</label>

      <textarea
        id="visitNote"
        rows="3"
        placeholder="أي ملاحظة للمالك..."></textarea>

    </div>

    <button
      onclick="sendVisit('${esc(id)}')">

      إرسال طلب الزيارة

    </button>

  `);
}

async function sendVisit(id){

  const {data:{session}}=
    await sb.auth.getSession();

  if(!session){

    toast('يرجى تسجيل الدخول');

    return;
  }

  const date=
    document.querySelector('#visitDate').value;

  const time=
    document.querySelector('#visitTime').value;

  const note=
    document.querySelector('#visitNote').value.trim();

  if(!date || !time){

    toast('اختر التاريخ والوقت');

    return;
  }

  const {error}=
    await sb
      .from('visit_requests')
      .insert({

        property_id:id,

        requester_id:
          session.user.id,

        visit_date:date,

        visit_time:time,

        note,

        status:'pending'

      });

  if(error){

    toast(error.message);

    return;
  }

  closeModal();

  toast(
    'تم إرسال طلب الزيارة بنجاح ✅'
  );
}

function showFavorites(){

  const ids=
    favs();

  const a=
    allProperties.filter(
      p=>ids.includes(String(p.id))
    );

  if(!a.length){

    show(`
      <h2>❤️ المفضلة</h2>
      <div class="empty">
        لا توجد عقارات في المفضلة بعد.
      </div>
    `);

    return;
  }

  show(`
    <h2>❤️ العقارات المفضلة</h2>
    <div class="cards">
      ${
        a.map(p=>`

          <article class="card">

            <div class="body">

              <div class="price">
                ${money(p.price)}
                DA
              </div>

              <h3>
                ${esc(p.title)}
              </h3>

              <p class="muted">
                📍
                ${esc(p.municipality)}،
                ${esc(p.wilaya)}
              </p>

              <button
                onclick="closeModal();detail('${esc(p.id)}')">

                التفاصيل

              </button>

            </div>

          </article>

        `).join('')
      }
    </div>
  `);
}

sb.auth.onAuthStateChange(
  (_event,_session)=>{
    setTimeout(
      ()=>render(),
      0
    );
  }
);

render();
</script>
</body>
</html>
</body>
</html>
