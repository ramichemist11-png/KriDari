<style>
:root{--g:#123f38;--g2:#176b5b;--gold:#c99a3d;--bg:#f5f6f4;--text:#18211f;--muted:#69736f;--line:#dfe6e2;--danger:#b42318;--ok:#147a57;--shadow:0 10px 35px rgba(18,63,56,.1)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 16px;background:var(--g2);color:#fff;font-weight:700;cursor:pointer}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#edf3f0!important;color:var(--g)!important}.gold{background:var(--gold)!important}.danger{background:#fff0ee!important;color:var(--danger)!important}.ok{background:#e8f7f0!important;color:var(--ok)!important}header{position:sticky;top:0;z-index:50;background:#fffffff5;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{text-decoration:none;font-size:30px;font-weight:900;color:var(--g)}.logo span{color:var(--gold)}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.user{font-size:13px;color:#46524f}.hero{min-height:500px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:60px 5%;background:linear-gradient(115deg,#092e28f0,#176b5bd1),url("https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Martyrs_Memorial_Algiers.jpg/1280px-Martyrs_Memorial_Algiers.jpg") center/cover no-repeat}.hero-content{width:min(1100px,100%)}.hero h1{font-size:44px;margin:0 0 12px}.hero p{font-size:18px;margin:0 0 28px}.search{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.4fr auto;gap:8px;background:#fffffff7;padding:14px;border-radius:18px;box-shadow:0 20px 55px #0004;color:var(--text)}input,select,textarea{width:100%;padding:12px;border:1px solid #d5ded9;border-radius:10px;outline:0;background:#fff}textarea{min-height:105px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px #176b5b1a}main{max-width:1180px;margin:auto;padding:38px 5%}.title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.title-row h2{margin:0;font-size:29px}.muted{color:var(--muted);font-size:14px;line-height:1.75}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}.card:hover{transform:translateY(-2px)}.card-image{height:210px;position:relative;background:linear-gradient(135deg,#dce9e5,#efd7a8)}.card-image img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:11px;right:11px;background:#fffffff5;color:var(--g);padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}.card-body{padding:17px}.price{font-size:21px;font-weight:900;color:var(--g)}.period{font-size:12px;color:var(--gold);font-weight:bold}.card h3{margin:8px 0;font-size:19px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#f0f4f2;color:#38534c;padding:5px 9px;border-radius:20px;font-size:12px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.empty{background:#fff;border:1px solid var(--line);padding:45px;text-align:center;border-radius:15px}.modal{display:none;position:fixed;inset:0;background:#0000008c;z-index:100;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;width:min(760px,100%);max-height:93vh;overflow:auto;border-radius:20px;padding:25px;position:relative}.close{position:absolute;left:14px;top:13px;width:40px;height:40px;padding:0;border-radius:50%;background:#f0f2f1;color:#333;font-size:24px}.box h2{color:var(--g);margin:0 45px 20px 0}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:800;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.check{display:flex;gap:8px;align-items:flex-start;background:#f5f8f6;border:1px solid var(--line);padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.check input{width:auto;margin-top:4px}.check a{color:var(--g2);text-decoration:underline}.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:16px}.gallery-main{width:100%;height:320px;object-fit:cover;border-radius:12px}.gallery-side{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gallery-side img{width:100%;height:156px;object-fit:cover;border-radius:9px}.info{background:#f8faf9;border:1px solid var(--line);padding:15px;border-radius:13px;margin-top:15px}.warning{background:#fff8e8;border:1px solid #ecd49b;color:#6c5015;padding:12px;border-radius:10px;font-size:13px;line-height:1.7;margin-top:12px}.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.pending{background:#fff5d8;color:#8a6200}.approved{background:#e6f6ef;color:#176b5b}.rejected{background:#fff0ef;color:#b42318}.rented{background:#eee;color:#555}.admin-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}.report{border-right:4px solid #c0392b}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:300;background:#172033;color:#fff;padding:13px 20px;border-radius:10px;max-width:92%;text-align:center}.toast.show{display:block}.success-box{text-align:center;padding:15px 5px}.success-icon{font-size:54px}.success-box h2{margin-right:0}.footer{background:#14211f;color:#dfe8e5;text-align:center;padding:32px 20px;margin-top:30px}.footer-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:15px}.footer-links a{color:#dfe8e5;text-decoration:none}@media(max-width:1050px){.search{grid-template-columns:1fr 1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{flex-direction:column;align-items:flex-start}.hero{min-height:550px}.hero h1{font-size:31px}.search{grid-template-columns:1fr}.cards,.grid2{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.gallery-main{height:240px}.gallery-side img{height:105px}.modal-actions{flex-direction:column}}

<body>
<header><a class="logo" href="#" onclick="home();return false">Kri<span>Dari</span></a><div id="nav" class="nav"></div></header>
<section class="hero"><div class="hero-content"><h1>🏠 لقّي دارك بسهولة</h1><p>منصة منظمة لكراء الشقق والعقارات في الجزائر</p><div class="search"><select id="sw"><option value="">كل الولايات</option></select><select id="st"><option value="">كل الأنواع</option></select><select id="sp"><option value="">كل أنواع الكراء</option><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select><input id="sprice" type="number" placeholder="أقصى سعر DA"><input id="stext" placeholder="المدينة أو العنوان"><button onclick="searchProperties()">🔎 بحث</button></div></div></section>
<main><div class="title-row"><h2>العقارات المتاحة</h2><span id="count" class="muted"></span></div><div id="cards" class="cards"></div></main>
<footer class="footer"><strong>KriDari</strong><br>منصة كراء العقارات في الجزائر<div class="footer-links"><a href="#" onclick="showPrivacy();return false">الخصوصية والشروط</a><a href="#" onclick="showSafety();return false">السلامة والتبليغ</a></div>© 2026 KriDari</footer>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://rvhqwpynhlgcscscybse.supabase.co';const SUPABASE_KEY='sb_publishable_HTJaBpq4c4JSyk5ybSOyNg_QS8tx3WE';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const ADMIN='rami.chemist11@gmail.com';
let user=null,admin=false,current=[];const W=['الجزائر','وهران','قسنطينة','غليزان','عنابة','سطيف','مستغانم','تلمسان','الشلف','البليدة','بجاية','تيزي وزو','سيدي بلعباس'];const T=['F1','F2','F3','F4','F5','Villa','Studio','Duplex','Local commercial','Terrain'];const P={daily:'يومي',monthly:'شهري',yearly:'سنوي'};
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function toast(m){const x=document.getElementById('toast');x.textContent=m;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),3500)}function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function home(){scrollTo({top:0,behavior:'smooth'})}
document.getElementById('modal').addEventListener('click',x=>{if(x.target.id==='modal')closeModal()});
async function refreshUser(){const{data:{session}}=await sb.auth.getSession();user=session?.user||null;admin=false;if(user){try{const{data,error}=await sb.rpc('get_my_role');if(!error)admin=data==='admin'}catch(e){}if(!admin)admin=(user.email||'').toLowerCase()===ADMIN}renderNav()}
sb.auth.onAuthStateChange(async(event,session)=>{user=session?.user||null;admin=false;if(user){try{const{data,error}=await sb.rpc('get_my_role');if(!error)admin=data==='admin'}catch(e){}if(!admin)admin=(user.email||'').toLowerCase()===ADMIN}renderNav();if(event==='SIGNED_IN')loadProperties()});
function renderNav(){const n=document.getElementById('nav');if(user){const name=user.user_metadata?.full_name||user.email?.split('@')[0]||'مستخدم';n.innerHTML=`<span class="user">مرحبًا <strong>${esc(name)}</strong></span><button onclick="openAddProperty()">+ أضف عقارك</button><button class="secondary" onclick="showMyProperties()">عقاراتي</button>${admin?'<button class="gold" onclick="openAdmin()">🛡️ لوحة التحكم</button>':''}<button class="secondary" onclick="logout()">خروج</button>`}else n.innerHTML='<button onclick="openAddProperty()">+ أضف عقارك</button><button class="secondary" onclick="openLogin()">تسجيل الدخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button>'}
function openLogin(message=''){openModal(`<h2>🔐 تسجيل الدخول</h2>${message?`<div class="warning">${esc(message)}</div>`:''}<div class="form-group"><label>البريد الإلكتروني</label><input id="le" type="email" autocomplete="email"></div><div class="form-group"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"></div><div class="modal-actions"><button onclick="login()">دخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button></div><hr><button class="secondary" onclick="openResend()">📩 إعادة إرسال رسالة تأكيد البريد</button>`)}
async function login(){const email=document.getElementById('le').value.trim(),password=document.getElementById('lp').value;if(!email||!password)return toast('أدخل البريد وكلمة المرور');const{error}=await sb.auth.signInWithPassword({email,password});if(error){if(/confirm|verified|email/i.test(error.message))return openLogin('البريد الإلكتروني غير مؤكد. استخدم زر إعادة إرسال رسالة التأكيد أدناه.');return toast(error.message)}closeModal();toast('تم تسجيل الدخول بنجاح ✅')}
function openRegister(){openModal(`<h2>📝 إنشاء حساب</h2><div class="form-group"><label>الاسم الكامل *</label><input id="rn" autocomplete="name"></div><div class="form-group"><label>رقم الهاتف *</label><input id="rp" type="tel" autocomplete="tel"></div><div class="form-group"><label>البريد الإلكتروني *</label><input id="re" type="email" autocomplete="email"></div><div class="form-group"><label>كلمة المرور *</label><input id="rpass" type="password" minlength="6" autocomplete="new-password"></div><div class="check"><input id="privacy" type="checkbox"><label for="privacy">أوافق على <a href="#" onclick="showPrivacy();return false">شروط الاستخدام وسياسة الخصوصية</a>، وأقر بأن KriDari منصة للعرض والربط وليست طرفًا في عقد الكراء، وأنني مسؤول عن صحة ما أنشره، وسأبلغ عن أي نشاط أو محتوى مشبوه.</label></div><div class="modal-actions"><button onclick="register()">إنشاء الحساب</button><button class="secondary" onclick="openLogin()">لدي حساب</button></div>`)}
async function register(){const name=document.getElementById('rn').value.trim(),phone=document.getElementById('rp').value.trim(),email=document.getElementById('re').value.trim(),password=document.getElementById('rpass').value;if(!name||!phone||!email||!password)return toast('يرجى ملء جميع المعلومات');if(password.length<6)return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');if(!document.getElementById('privacy').checked)return toast('يجب قبول شروط الاستخدام والخصوصية');const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin, data:{full_name:name,phone,privacy_accepted:true,privacy_accepted_at:new Date().toISOString(),terms_version:'1.0'}}});if(error)return toast(error.message);if(data.user){try{await sb.from('profiles').update({privacy_accepted:true,privacy_accepted_at:new Date().toISOString(),terms_version:'1.0'}).eq('id',data.user.id)}catch(e){}}if(data.session){closeModal();toast('تم إنشاء الحساب بنجاح 🎉')}else{openConfirmation(email)}}
function openConfirmation(email){openModal(`<div class="success-box"><div class="success-icon">📩</div><h2>تحقق من بريدك الإلكتروني</h2><p>أرسلنا رسالة تأكيد إلى:</p><strong>${esc(email)}</strong><p class="muted">افتح الرسالة واضغط على رابط التأكيد. إذا لم تجدها، تحقق من مجلد Spam.</p><div class="modal-actions"><button onclick="openResend('${esc(email)}')">إعادة إرسال الرسالة</button><button class="secondary" onclick="closeModal()">حسنًا</button></div></div>`)}
function openResend(email=''){openModal(`<h2>📩 إعادة تأكيد البريد</h2><p class="muted">أدخل بريدك الإلكتروني وسنرسل رابط تأكيد جديدًا.</p><div class="form-group"><label>البريد الإلكتروني</label><input id="resendEmail" type="email" value="${esc(email)}"></div><button onclick="resendConfirmation()">إرسال رابط جديد</button>`)}
async function resendConfirmation(){const email=document.getElementById('resendEmail').value.trim();if(!email)return toast('أدخل البريد الإلكتروني');const{error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:window.location.origin}});if(error)return toast(error.message);openModal(`<div class="success-box"><div class="success-icon">✅</div><h2>تم إرسال رسالة جديدة</h2><p class="muted">تحقق من بريدك الإلكتروني ومجلد Spam.</p><button onclick="closeModal()">إغلاق</button></div>`)}
async function logout(){await sb.auth.signOut();toast('تم تسجيل الخروج')}
function fillFilters(){sw.innerHTML='<option value="">كل الولايات</option>'+W.map(x=>`<option>${x}</option>`).join('');st.innerHTML='<option value="">كل الأنواع</option>'+T.map(x=>`<option>${x}</option>`).join('')}
function imageURL(p){return p?sb.storage.from('property-images').getPublicUrl(p).data.publicUrl:''}
async function loadProperties(){const{data,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').eq('status','approved').order('created_at',{ascending:false});if(error){console.error(error);cards.innerHTML='<div class="empty"><h3>تعذر تحميل العقارات</h3><p>حاول تحديث الصفحة.</p></div>';return}current=data||[];render(current)}
function render(list){count.textContent=`${list.length} عقار`;if(!list.length){cards.innerHTML='<div class="empty"><h3>لا توجد عقارات متاحة حاليًا</h3><p>كن أول من يضيف عقارًا إلى KriDari.</p></div>';return}cards.innerHTML=list.map(p=>{const ims=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=ims.find(x=>x.is_main)||ims[0],img=m?imageURL(m.image_path):'';return `<article class="card"><div class="card-image">${img?`<img src="${img}" alt="${esc(p.title)}">`:'<div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:60px">🏠</div>'}<span class="badge">${P[p.rental_period]||'كراء'}${ims.length?' · 📷 '+ims.length:''}</span></div><div class="card-body"><div class="price">${Number(p.price||0).toLocaleString('fr-DZ')} DA</div><div class="period">${P[p.rental_period]||'شهري'}</div><h3>${esc(p.title)}</h3><p class="muted">📍 ${esc(p.city||'')}، ${esc(p.wilaya||'')}</p><div class="chips"><span class="chip">${esc(p.property_type)}</span><span class="chip">${p.rooms||1} غرف</span><span class="chip">${p.furnished?'مفروشة':'غير مفروشة'}</span></div><div class="actions"><button onclick="details('${p.id}')">التفاصيل</button><button class="secondary" onclick="favorite('${p.id}')">❤️</button></div></div></article>`}).join('')}
function searchProperties(){const w=sw.value,t=st.value,period=sp.value,pr=Number(sprice.value),q=stext.value.trim().toLowerCase();render(current.filter(p=>(!w||p.wilaya===w)&&(!t||p.property_type===t)&&(!period||p.rental_period===period)&&(!pr||Number(p.price)<=pr)&&(!q||`${p.title} ${p.city||''} ${p.wilaya||''} ${p.address||''}`.toLowerCase().includes(q))))}
function openAddProperty(){if(!user)return openModal(`<h2>🔐 تسجيل الدخول مطلوب</h2><p>يجب إنشاء حساب أو تسجيل الدخول قبل إضافة عقارك.</p><div class="modal-actions"><button onclick="openLogin()">تسجيل الدخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button></div>`);window.files=[];openModal(`<h2>🏠 أضف عقارك</h2><div class="form-group"><label>عنوان الإعلان *</label><input id="pt"></div><div class="grid2"><div class="form-group"><label>الولاية *</label><select id="pw"><option value="">اختر</option>${W.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>المدينة / البلدية *</label><input id="pc"></div><div class="form-group"><label>نوع العقار *</label><select id="pty"><option value="">اختر</option>${T.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>عدد الغرف</label><input id="pro" type="number" min="1" value="1"></div><div class="form-group"><label>طبيعة الكراء *</label><select id="pper"><option value="">اختر</option><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select></div><div class="form-group"><label>السعر DA *</label><input id="ppr" type="number" min="1"></div></div><div class="form-group"><label>العنوان</label><input id="pa"></div><div class="form-group"><label>رقم الهاتف *</label><input id="pp" type="tel" value="${esc(user.user_metadata?.phone||'')}"></div><div class="form-group"><label>وصف العقار</label><textarea id="pd"></textarea></div><div class="form-group"><label>صور العقار *</label><input id="pi" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="window.files=Array.from(this.files)"><p class="muted">حتى 10 صور، 5 MB للصورة.</p></div><div class="warning">سيخضع الإعلان للمراجعة قبل ظهوره. يمنع نشر أي محتوى احتيالي أو مضلل أو غير قانوني.</div><div class="modal-actions"><button onclick="publish()">🚀 إرسال للمراجعة</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
async function publish(){const fs=(window.files||[]).slice(0,10);const title=pt.value.trim(),wilaya=pw.value,city=pc.value.trim(),type=pty.value,rooms=Number(pro.value)||1,period=pper.value,price=Number(ppr.value),address=pa.value.trim(),phone=pp.value.trim(),description=pd.value.trim();if(!title||!wilaya||!city||!type||!period||!price||!phone)return toast('يرجى ملء المعلومات الأساسية');if(!fs.length)return toast('أضف صورة واحدة على الأقل');if(fs.some(f=>!f.type.startsWith('image/')||f.size>5*1024*1024))return toast('كل صورة يجب أن تكون صورة وأقل من 5MB');const{data:p,error}=await sb.from('properties').insert({owner_id:user.id,title,description,wilaya,city,address,property_type:type,rooms,price,rental_period:period,phone,status:'pending'}).select().single();if(error)return toast(error.message);for(let i=0;i<fs.length;i++){const f=fs[i],safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${user.id}/${p.id}/${crypto.randomUUID()}-${safe}`,u=await sb.storage.from('property-images').upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type});if(u.error)continue;await sb.from('property_images').insert({property_id:p.id,image_path:path,is_main:i===0,sort_order:i})}openModal(`<div class="success-box"><div class="success-icon">✅</div><h2>تم إرسال الإعلان بنجاح</h2><p class="muted">إعلانك الآن قيد المراجعة وسيظهر بعد موافقة الإدارة.</p><button onclick="closeModal()">حسنًا</button></div>`);loadProperties()}
function details(id){const p=current.find(x=>x.id===id);if(!p)return;const ims=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=ims.find(x=>x.is_main)||ims[0],others=ims.filter(x=>x.id!==m?.id).slice(0,4),gallery=m?`<div class="gallery"><img class="gallery-main" src="${imageURL(m.image_path)}"><div class="gallery-side">${others.map(x=>`<img src="${imageURL(x.image_path)}">`).join('')}</div></div>`:'<div class="empty">🏠</div>';openModal(`<h2>${esc(p.title)}</h2>${gallery}<div class="info"><p>📍 <strong>${esc(p.city||'')}</strong>، ${esc(p.wilaya||'')}</p><p>🏠 النوع: <strong>${esc(p.property_type)}</strong></p><p>🚪 الغرف: <strong>${p.rooms||1}</strong></p><p>💰 <strong style="color:var(--g)">${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${P[p.rental_period]||'شهري'}</strong></p><p>📝 ${esc(p.description||'لا يوجد وصف')}</p></div><div class="warning">KriDari منصة للعرض والربط وليست طرفًا في عقد الكراء. تحقق بنفسك قبل الدفع أو التعاقد. استخدم التبليغ عند الاشتباه.</div><div class="modal-actions"><button onclick="requestVisit('${p.id}')">📅 طلب زيارة</button><button class="secondary" onclick="callOwner('${esc(p.phone||'')}')">📞 الاتصال</button><button class="danger" onclick="report('${p.id}')">🚨 تبليغ</button></div>`)}
function callOwner(p){if(p)location.href='tel:'+p;else toast('رقم الهاتف غير متوفر')}
async function favorite(id){if(!user)return openLogin();const{data}=await sb.from('favorites').select('id').eq('user_id',user.id).eq('property_id',id).maybeSingle();if(data){const{error}=await sb.from('favorites').delete().eq('id',data.id);return toast(error?'تعذر حذف المفضلة': 'تم حذف العقار من المفضلة')}const{error}=await sb.from('favorites').insert({user_id:user.id,property_id:id});toast(error?error.message:'تمت إضافة العقار إلى المفضلة ❤️')}
function requestVisit(id){if(!user)return openLogin();openModal(`<h2>📅 طلب زيارة</h2><div class="form-group"><label>التاريخ المقترح</label><input id="vd" type="date"></div><div class="form-group"><label>رسالة</label><textarea id="vm"></textarea></div><button onclick="sendVisit('${id}')">إرسال الطلب</button>`)}
async function sendVisit(id){const d=vd.value;if(!d)return toast('اختر تاريخ الزيارة');const{error}=await sb.from('visit_requests').insert({property_id:id,user_id:user.id,requested_date:d,message:vm.value.trim(),status:'pending'});if(error)return toast(error.message);openModal(`<div class="success-box"><div class="success-icon">✅</div><h2>تم إرسال طلب الزيارة</h2><p class="muted">سيتم التعامل مع طلبك من خلال المنصة.</p><button onclick="closeModal()">حسنًا</button></div>`)}
function report(id){if(!user)return openLogin('يجب تسجيل الدخول لإرسال بلاغ');openModal(`<h2>🚨 التبليغ عن إعلان</h2><p class="muted">أبلغ عن احتيال أو محتوى غير قانوني أو معلومات مضللة.</p><div class="form-group"><label>السبب *</label><select id="rr"><option value="fraud">اشتباه في احتيال</option><option value="illegal">محتوى غير قانوني</option><option value="misleading">معلومات مضللة</option><option value="harassment">إساءة أو مضايقة</option><option value="other">أخرى</option></select></div><div class="form-group"><label>التفاصيل</label><textarea id="rd" placeholder="اكتب تفاصيل تساعد الإدارة على المراجعة"></textarea></div><button id="reportBtn" onclick="sendReport('${id}')">🚨 إرسال التبليغ</button>`)}
async function sendReport(id){const btn=document.getElementById('reportBtn');btn.disabled=true;btn.textContent='جارٍ الإرسال...';const reason=document.getElementById('rr').value,message=document.getElementById('rd').value.trim();const{data,error}=await sb.from('reports').insert({property_id:id,reporter_id:user.id,reason,message,status:'pending'}).select('id').single();if(error){btn.disabled=false;btn.textContent='🚨 إرسال التبليغ';return toast('تعذر إرسال البلاغ: '+error.message)}if(!data?.id){btn.disabled=false;return toast('تعذر تأكيد حفظ البلاغ')}openModal(`<div class="success-box"><div class="success-icon">🚨</div><h2>تم استلام البلاغ</h2><p>شكرًا لك. تم تسجيل الشكوى بنجاح وإرسالها إلى الإدارة للمراجعة.</p><p class="muted">رقم البلاغ: ${esc(data.id)}</p><button onclick="closeModal()">حسنًا</button></div>`)}
async function showMyProperties(){if(!user)return openLogin();const{data,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return toast(error.message);openModal(`<h2>🏠 عقاراتي</h2>${data?.length?data.map(p=>`<div class="admin-row"><strong>${esc(p.title)}</strong><p class="muted">${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${P[p.rental_period]||'شهري'}</p><span class="status ${eStatus(p.status)}">${statusLabel(p.status)}</span></div>`).join(''):'<div class="empty">لم تقم بإضافة أي عقار بعد.</div>'}`)}
function eStatus(s){return ['pending','approved','rejected','rented'].includes(s)?s:''}function statusLabel(s){return s==='pending'?'⏳ قيد المراجعة':s==='approved'?'✅ منشور':s==='rejected'?'❌ مرفوض':s==='rented'?'🏠 مؤجر':esc(s||'غير معروف')}
async function openAdmin(){if(!admin)return toast('غير مصرح');const{data:props,error:pe}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').order('created_at',{ascending:false});if(pe)return toast(pe.message);const{data:reports,error:re}=await sb.from('reports').select('*').order('created_at',{ascending:false});if(re)return toast(re.message);openModal(`<h2>🛡️ لوحة التحكم</h2><h3>📋 الإعلانات</h3>${props?.length?props.map(p=>`<div class="admin-row"><strong>${esc(p.title)}</strong><p class="muted">${esc(p.city||'')}، ${esc(p.wilaya||'')} · ${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${P[p.rental_period]||'شهري'}</p><span class="status ${eStatus(p.status)}">${statusLabel(p.status)}</span><div class="actions">${p.status!=='approved'?`<button onclick="moderate('${p.id}','approved')">✅ قبول</button>`:''}${p.status!=='rejected'?`<button class="danger" onclick="moderate('${p.id}','rejected')">❌ رفض</button>`:''}</div></div>`).join(''):'<p class="muted">لا توجد إعلانات.</p>'}<hr><h3>🚨 البلاغات</h3>${reports?.length?reports.map(r=>`<div class="admin-row report"><strong>${esc(r.reason)}</strong><p class="muted">${esc(r.message||'لا تفاصيل')}</p><p class="muted">الحالة: ${esc(r.status||'pending')}</p>${r.status==='pending'?`<button onclick="reviewReport('${r.id}')">تمت المراجعة</button>`:''}</div>`).join(''):'<p class="muted">لا توجد بلاغات.</p>'}`)}
async function moderate(id,status){if(!admin)return toast('غير مصرح');const{error}=await sb.from('properties').update({status}).eq('id',id);if(error)return toast(error.message);toast(status==='approved'?'تم قبول الإعلان ✅':'تم رفض الإعلان ❌');openAdmin();loadProperties()}
async function reviewReport(id){if(!admin)return toast('غير مصرح');const{error}=await sb.from('reports').update({status:'reviewed',reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id);if(error)return toast(error.message);toast('تم تسجيل مراجعة البلاغ');openAdmin()}
function showPrivacy(){openModal(`<h2>🔐 الخصوصية وشروط الاستخدام</h2><p class="muted">يستخدم KriDari بيانات الحساب والإعلانات وطلبات الزيارة لتشغيل المنصة. يلتزم المستخدم بتقديم معلومات صحيحة وعدم نشر محتوى احتيالي أو غير قانوني أو مسيء.</p><p class="muted">KriDari منصة تقنية للعرض والربط بين المستخدمين وليست طرفًا في عقد الكراء ولا تضمن هوية أي مستخدم أو صحة كل إعلان. يجب التحقق قبل الدفع أو التعاقد.</p><p class="muted">يمكن التبليغ عن أي محتوى أو سلوك مشبوه، وتقوم الإدارة بمراجعته واتخاذ الإجراء المناسب وفق القوانين والسياسات المعمول بها.</p><p class="muted">الموافقة على هذه الشروط مطلوبة لإنشاء حساب.</p>`)}function showSafety(){openModal(`<h2>🛡️ السلامة والتبليغ</h2><p class="muted">لا ترسل أموالًا قبل التحقق من العقار والمالك. لا تشارك كلمات المرور أو رموز التحقق. إذا بدا الإعلان مشبوهًا استخدم زر 🚨 تبليغ.</p>`)}
fillFilters();refreshUser();loadProperties();
</script>
