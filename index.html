<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123f38">
  <title>KriDari | كراء العقارات في الجزائر</title>
  <style>html,body{margin:0;height:100%;background:#f5f6f4;font-family:Tahoma,Arial,sans-serif}body{display:grid;place-items:center;color:#123f38;font-weight:700}#e{display:none;color:#b42318;text-align:center;padding:20px}</style>
</head>
<body>
  <div id="l">جاري فتح KriDari…</div>
  <div id="e">تعذر تشغيل التطبيق. يرجى إعادة تحميل الصفحة.</div>
  <script>
  (async()=>{
    try{
      const r=await fetch('/app.html?boot='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error('app '+r.status);
      let html=await r.text();
      html=html.replace(/https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2/g,'https://unpkg.com/@supabase/supabase-js@2');
      const patch=`<script>(function(){const s=document.createElement('style');s.textContent='.hero{background-image:linear-gradient(115deg,#092e28e8,#176b5bc7),url("https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1600&q=85") !important;background-position:center !important;background-size:cover !important}.moderation-result{margin-top:12px;padding:12px 14px;border-radius:12px;background:#e8f7f0;color:#176b5b;font-weight:800;border:1px solid #c5e9db}.contact-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}@media(max-width:650px){.contact-actions{grid-template-columns:1fr}}';document.head.appendChild(s);const E=v=>String(v??'').replace(/[&<>\"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#039;'}[x]));const P={daily:'يومي',monthly:'شهري',yearly:'سنوي'},ST={approved:'تم قبول ونشر المنشور تلقائيًا.',rejected:'تم رفض المنشور من طرف الإدارة.',hidden:'تم إخفاء المنشور من طرف الإدارة.',deleted:'تم حذف المنشور من طرف الإدارة.',suspended:'تم إيقاف المنشور من طرف الإدارة.',pending:'المنشور في انتظار المراجعة.'},RT={evidence_requested:'تم طلب الإثبات. الحالة الآن: في انتظار التأكيد.',reviewed:'تمت مراجعة الشكوى.',dismissed:'تم رفض الشكوى وإغلاقها.',action_taken:'تم اتخاذ الإجراء اللازم بشأن الشكوى.',warning:'تم توجيه تنبيه بخصوص الشكوى.',accepted:'تم قبول الشكوى.',rejected:'تم رفض الشكوى.',resolved:'تم حل الشكوى وإغلاقها.'};window.showDetails=function(id){const p=(window.current||[]).find(x=>x.id===id);if(!p)return;const imgs=(p.property_images||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=imgs.find(x=>x.is_main)||imgs[0],image=path=>path?sb.storage.from('property-images').getPublicUrl(path).data.publicUrl:'',phone=String(p.phone||'').replace(/\D/g,'');openModal('<h2>'+E(p.title)+'</h2>'+(m?'<div class="gallery"><img class="gallery-main" src="'+image(m.image_path)+'" alt="'+E(p.title)+'"><div class="gallery-side">'+imgs.filter(x=>x.id!==m.id).slice(0,4).map(x=>'<img src="'+image(x.image_path)+'" alt="">').join('')+'</div></div>':'')+'<div class="info"><p>📍 '+E(p.city||'')+'، '+E(p.wilaya||'')+'</p><p>🏠 '+E(p.property_type||'')+' · '+(p.rooms||1)+' غرف</p><p>💰 <strong>'+Number(p.price||0).toLocaleString('fr-DZ')+' DA / '+E(P[p.rental_period]||'شهري')+'</strong></p><p>📝 '+E(p.description||'لا يوجد وصف')+'</p></div><div class="contact-actions"><button type="button" class="ok" data-action="call" data-phone="'+E(phone)+'">📞 اتصال بصاحب العقار</button><button type="button" class="ok" data-action="whatsapp" data-phone="'+E(phone)+'">WhatsApp 💬</button></div><div class="modal-actions"><button type="button" data-action="visit" data-id="'+p.id+'">📅 طلب زيارة</button><button type="button" class="danger" data-action="report" data-id="'+p.id+'">🚨 تبليغ</button></div>')};window.renderAdminProps=function(props){const b=$('adminBody');if(!b)return;b.innerHTML=(props||[]).map(p=>{const st=String(p.status||''),result=ST[st]||'';let a='';if(st==='pending')a='<button type="button" data-action="adminApprove" data-id="'+p.id+'">✅ قبول ونشر</button><button type="button" class="secondary" data-action="adminHide" data-id="'+p.id+'">👁️ إخفاء</button><button type="button" class="danger" data-action="adminDelete" data-id="'+p.id+'">🗑️ حذف</button>';else if(st==='approved')a='<button type="button" class="secondary" data-action="adminHide" data-id="'+p.id+'">👁️ إخفاء</button><button type="button" class="danger" data-action="adminDelete" data-id="'+p.id+'">🗑️ حذف</button>';else if(['hidden','suspended'].includes(st))a='<button type="button" class="ok" data-action="adminRestore" data-id="'+p.id+'">♻️ استرجاع</button><button type="button" class="danger" data-action="adminDelete" data-id="'+p.id+'">🗑️ حذف</button>';else if(st!=='deleted')a='<button type="button" class="danger" data-action="adminDelete" data-id="'+p.id+'">🗑️ حذف</button>';return '<div class="admin-row"><div style="display:flex;justify-content:space-between;gap:10px"><strong>'+E(p.title)+'</strong><span class="status '+E(st)+'">'+E(window.statusLabel?window.statusLabel(st):st)+'</span></div><p class="muted">'+E(p.city||'')+'، '+E(p.wilaya||'')+' · '+Number(p.price||0).toLocaleString('fr-DZ')+' DA</p>'+(result?'<div class="moderation-result">'+E(result)+'</div>':'')+(p.moderation_note&&p.moderation_note!==result?'<div class="muted" style="margin-top:8px">'+E(p.moderation_note)+'</div>':'')+'<div class="modal-actions">'+a+'</div></div>'}).join('')||'<div class="empty">لا توجد عقارات</div>'};window.renderAdminReports=function(reports){const b=$('adminBody');if(!b)return;b.innerHTML=(reports||[]).map(r=>{const st=String(r.status||'pending'),msg=RT[st]||'';return '<div class="admin-row report"><strong>🚨 '+E(r.property_title||'إعلان')+'</strong><p class="muted">الحالة: '+E(st)+' · '+new Date(r.created_at).toLocaleString('fr-DZ')+'</p><p><strong>المدعي:</strong> '+E(r.reporter_name||'غير معروف')+' · '+E(r.reporter_email||'')+' · '+E(r.reporter_phone||'')+'</p><p><strong>المدعى عليه:</strong> '+E(r.owner_name||'غير معروف')+' · '+E(r.owner_email||'')+' · '+E(r.owner_phone||'')+'</p><p class="muted">'+E(r.reason||'')+' — '+E(r.details||r.message||'')+'</p>'+(msg?'<div class="moderation-result">'+E(msg)+'</div>':'')+'<div class="modal-actions"><button type="button" data-action="setContact" data-id="'+r.report_id+'" data-side="complainant">📞 تواصل مع المدعي</button><button type="button" data-action="setContact" data-id="'+r.report_id+'" data-side="defendant">📞 تواصل مع المدعى عليه</button>'+((st==='pending'||st==='reviewed')?'<button type="button" class="gold" data-action="resolveReport" data-id="'+r.report_id+'" data-decision="evidence">📄 طلب إثبات</button><button type="button" class="secondary" data-action="resolveReport" data-id="'+r.report_id+'" data-decision="dismiss">❌ رفض الشكوى</button><button type="button" class="danger" data-action="resolveReport" data-id="'+r.report_id+'" data-decision="hide">⛔ إيقاف الإعلان</button><button type="button" class="danger" data-action="resolveReport" data-id="'+r.report_id+'" data-decision="delete">🗑️ حذف الإعلان</button>':'')+'</div></div>'}).join('')||'<div class="empty">لا توجد بلاغات</div>'};async function R(id,d){const labels={evidence:'طلب الإثبات',dismiss:'رفض الشكوى',hide:'إيقاف الإعلان',delete:'حذف الإعلان'},note=prompt(labels[d]||'إجراء الإدارة','');if(note===null)return;const q=await sb.rpc('admin_resolve_report',{p_report_id:id,p_decision:d,p_note:note||null});if(q.error)return toast(q.error.message);toast(d==='evidence'?'تم طلب الإثبات — في انتظار التأكيد.':'تم تنفيذ الإجراء بنجاح ✅');await openAdmin()}document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='whatsapp'){e.preventDefault();e.stopImmediatePropagation();const p=String(el.dataset.phone||'').replace(/\D/g,'');if(!p)return toast('رقم الهاتف غير متوفر');location.href='https://wa.me/213'+p.replace(/^0/,'');return}if(a==='resolveReport'){e.preventDefault();e.stopImmediatePropagation();await R(el.dataset.id,el.dataset.decision)}},true)})();<\/script>`;html=html.replace('</body>',patch+'</body>');
      document.open();document.write(html);document.close();
    }catch(err){console.error(err);document.getElementById('l').style.display='none';document.getElementById('e').style.display='block'}
  })();
  </script>
</body>
</html>
