-shadow:0 0 0 3px #176b5b1a}main{max-width:1180px;margin:auto;padding:38px 5%}.title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.title-row h2{margin:0;font-size:29px}.muted{color:var(--muted);font-size:14px;line-height:1.75}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}.card:hover{transform:translateY(-2px)}.card-image{height:210px;position:relative;background:linear-gradient(135deg,#dce9e5,#efd7a8)}.card-image img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:11px;right:11px;background:#fffffff5;color:var(--g);padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}.views{position:absolute;bottom:9px;left:9px;background:#0000008c;color:#fff;padding:4px 8px;border-radius:7px;font-size:11px}.card-body{padding:17px}.price{font-size:21px;font-weight:900;color:var(--g)}.period{font-size:12px;color:var(--gold);font-weight:bold}.card h3{margin:8px 0;font-size:19px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#f0f4f2;color:#38534c;padding:5px 9px;border-radius:20px;font-size:12px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.empty{background:#fff;border:1px solid var(--line);padding:45px;text-align:center;border-radius:15px}.modal{display:none;position:fixed;inset:0;background:#0000008c;z-index:100;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;width:min(740px,100%);max-height:93vh;overflow:auto;border-radius:20px;padding:25px;position:relative}.close{position:absolute;left:14px;top:13px;width:40px;height:40px;padding:0;border-radius:50%;background:#f0f2f1;color:#333;font-size:24px}.box h2{color:var(--g);margin:0 45px 20px 0}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:800;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.check{display:flex;gap:8px;align-items:flex-start;background:#f5f8f6;border:1px solid var(--line);padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.check input{width:auto;margin-top:4px}.check a{color:var(--g2);text-decoration:underline}.previews{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:9px}.preview{height:85px;border-radius:8px;overflow:hidden;position:relative;background:#eee}.preview img{width:100%;height:100%;object-fit:cover}.preview span{position:absolute;bottom:0;right:0;left:0;background:#123f38e0;color:#fff;text-align:center;font-size:10px;padding:4px}.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:16px}.gallery-main{width:100%;height:320px;object-fit:cover;border-radius:12px;display:block}.gallery-side{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gallery-side img{width:100%;height:156px;object-fit:cover;border-radius:9px;display:block}.info{background:#f8faf9;border:1px solid var(--line);padding:15px;border-radius:13px;margin-top:15px}.warning{background:#fff8e8;border:1px solid #ecd49b;color:#6c5015;padding:12px;border-radius:10px;font-size:13px;line-height:1.7;margin-top:12px}.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.pending{background:#fff5d8;color:#8a6200}.approved{background:#e6f6ef;color:#176b5b}.rejected{background:#fff0ef;color:#b42318}.rented{background:#eee;color:#555}.admin-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}.report{border-right:4px solid #c0392b}hr{border:0;border-top:1px solid var(--line);margin:22px 0}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:300;background:#172033;color:#fff;padding:13px 20px;border-radius:10px;max-width:90%;text-align:center}.toast.show{display:block}footer{background:#14211f;color:#dfe8e5;text-align:center;padding:32px 20px;margin-top:30px}.footer-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:15px}.footer-links a{color:#dfe8e5;text-decoration:none}.footer-links a:hover{color:#d9a441}@media(max-width:1050px){.search{grid-template-columns:1fr 1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{flex-direction:column;align-items:flex-start}.hero{min-height:550px}.hero h1{font-size:31px}.search{grid-template-columns:1fr}.cards,.grid2{grid-template-columns:1fr}.previews{grid-template-columns:repeat(3,1fr)}.gallery{grid-template-columns:1fr}.gallery-main{height:240px}.gallery-side img{height:105px}.modal-actions{flex-direction:column}}

<body>
<header><a class="logo" href="#" onclick="home();return false">Kri<span>Dari</span></a><div id="nav" class="nav"></div></header>

<main><div class="title-row"><h2>العقارات المتاحة</h2><span id="count" class="muted"></span></div><div id="cards" class="cards"></div></main>
<footer><strong>KriDari</strong><br>منصة كراء العقارات في الجزائر<div class="footer-links"><a href="#" onclick="showPrivacy();return false">الخصوصية والشروط</a><a href="#" onclick="showSafety();return false">السلامة والتبليغ</a></div>© 2026 KriDari</footer>

<script>
const SUPABASE_URL="https://rvhqwpynhlgcscscybse.supabase.co",SUPABASE_KEY="sb_publishable_HTJaBpq4c4JSyk5ybSOyNg_QS8tx3WE",sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),ADMIN="rami.chemist11@gmail.com";
let user=null,admin=false,current=[],selectedFiles=[],mainIndex=0;
const W=["الجزائر","وهران","قسنطينة","غليزان","عنابة","سطيف","مستغانم","تلمسان","الشلف","البليدة","بجاية","تيزي وزو","سيدي بلعباس"],T=["F1","F2","F3","F4","F5","Villa","Studio","Duplex","Local commercial","Terrain"],P={daily:"يومي",monthly:"شهري",yearly:"سنوي",يومي:"يومي",شهري:"شهري",سنوي:"سنوي"};
function e(v){return String(v??"").replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function toast(m){let x=document.getElementById('toast');x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3200)}function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('modal').onclick=x=>{if(x.target===x.currentTarget)closeModal()};
async function loadUser(){let{data:{session}}=await sb.auth.getSession();user=session?.user||null;admin=false;if(user){try{let{data:r,error:x}=await sb.rpc('get_my_role');if(!x)admin=r==='admin'}catch(_){}if(!admin)admin=(user.email||'').toLowerCase()===ADMIN}nav()}
sb.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;admin=false;if(user){try{let{data:r,error:x}=await sb.rpc('get_my_role');if(!x)admin=r==='admin'}catch(_){}if(!admin)admin=(user.email||'').toLowerCase()===ADMIN}nav();load()});
function nav(){let n=document.getElementById('nav');if(user){let name=user.user_metadata?.full_name||user.email?.split('@')[0]||'مستخدم';n.innerHTML=`<span class="user">مرحبًا <strong>${e(name)}</strong></span><button onclick="openAddProperty()">+ أضف عقارك</button><button class="secondary" onclick="showMyProperties()">عقاراتي</button>${admin?'<button class="gold" onclick="openAdmin()">🛡️ لوحة Admin</button>':''}<button class="secondary" onclick="logout()">خروج</button>`}else n.innerHTML='<button onclick="openAddProperty()">+ أضف عقارك</button><button class="secondary" onclick="openLogin()">تسجيل الدخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button>'}
function home(){scrollTo({top:0,behavior:'smooth'})}
function openLogin(){openModal(`<h2>🔐 تسجيل الدخول</h2><div class="form-group"><label>البريد الإلكتروني</label><input id="le" type="email"></div><div class="form-group"><label>كلمة المرور</label><input id="lp" type="password"></div><div class="modal-actions"><button onclick="login()">دخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button></div>`)}
async function login(){let email=document.getElementById('le').value.trim(),password=document.getElementById('lp').value;if(!email||!password)return toast('أدخل البريد وكلمة المرور');let{error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message);closeModal();toast('تم تسجيل الدخول بنجاح ✅')}
function openRegister(){openModal(`<h2>📝 إنشاء حساب</h2><div class="form-group"><label>الاسم الكامل</label><input id="rn"></div><div class="form-group"><label>رقم الهاتف</label><input id="rp" type="tel"></div><div class="form-group"><label>البريد الإلكتروني</label><input id="re" type="email"></div><div class="form-group"><label>كلمة المرور</label><input id="rpass" type="password" minlength="6"></div><div class="check"><input id="privacy" type="checkbox"><label for="privacy">أوافق على <a href="#" onclick="showPrivacy();return false">شروط الاستخدام وسياسة الخصوصية</a>، وأقر بأن KriDari منصة للربط بين المستخدمين وليست طرفًا في عقد الكراء، وأنني مسؤول عن المحتوى والمعلومات التي أنشرها، وسأبلغ عن أي نشاط أو محتوى مشبوه.</label></div><div class="modal-actions"><button onclick="register()">إنشاء الحساب</button><button class="secondary" onclick="openLogin()">لدي حساب</button></div>`)}
async function register(){let name=document.getElementById('rn').value.trim(),phone=document.getElementById('rp').value.trim(),email=document.getElementById('re').value.trim(),password=document.getElementById('rpass').value;if(!name||!phone||!email||!password)return toast('يرجى ملء جميع المعلومات');if(password.length<6)return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');if(!document.getElementById('privacy').checked)return toast('يجب قبول شروط الاستخدام والخصوصية');let{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,phone}}});if(error)return toast(error.message);if(data.user)await sb.from('profiles').update({privacy_accepted:true,privacy_accepted_at:new Date().toISOString(),terms_version:'1.0'}).eq('id',data.user.id);closeModal();toast(data.session?'تم إنشاء الحساب 🎉':'تحقق من بريدك الإلكتروني لتفعيل الحساب')}
async function logout(){await sb.auth.signOut();toast('تم تسجيل الخروج')}
function fillFilters(){sw.innerHTML='<option value="">كل الولايات</option>'+W.map(x=>`<option>${x}</option>`).join('');st.innerHTML='<option value="">كل الأنواع</option>'+T.map(x=>`<option>${x}</option>`).join('')}
function imageURL(p){if(!p)return'';return sb.storage.from('property-images').getPublicUrl(p).data.publicUrl}
async function load(){let{data,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').eq('status','approved').order('created_at',{ascending:false});if(error){console.error(error);document.getElementById('cards').innerHTML='<div class="empty"><h3>تعذر تحميل العقارات</h3><p>حاول تحديث الصفحة.</p></div>';return}current=data||[];render(current)}
function render(list){count.textContent=`${list.length} عقار`;if(!list.length){cards.innerHTML='<div class="empty"><h3>لا توجد عقارات متاحة حاليًا</h3><p>كن أول من يضيف عقارًا إلى KriDari.</p></div>';return}cards.innerHTML=list.map(p=>{let ims=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=ims.find(x=>x.is_main)||ims[0],img=m?imageURL(m.image_path):'';return `<article class="card"><div class="card-image">${img?`<img src="${img}" alt="${e(p.title)}">`:'<div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:60px">🏠</div>'}<span class="badge">${P[p.rental_period]||'كراء'}${ims.length?' · 📷 '+ims.length:''}</span></div><div class="card-body"><div class="price">${Number(p.price||0).toLocaleString('fr-DZ')} DA</div><div class="period">${P[p.rental_period]||'شهري'}</div><h3>${e(p.title)}</h3><p class="muted">📍 ${e(p.city||'')}، ${e(p.wilaya||'')}</p><div class="chips"><span class="chip">${e(p.property_type)}</span><span class="chip">${p.rooms||1} غرف</span><span class="chip">${p.furnished?'مفروشة':'غير مفروشة'}</span></div><div class="actions"><button onclick="details('${p.id}')">التفاصيل</button><button class="secondary" onclick="favorite('${p.id}')">❤️</button></div></div></article>`}).join('')}
function searchProperties(){let w=sw.value,t=st.value,period=sp.value,pr=Number(sprice.value),q=stext.value.trim().toLowerCase();render(current.filter(p=>(!w||p.wilaya===w)&&(!t||p.property_type===t)&&(!period||p.rental_period===period)&&(!pr||Number(p.price)<=pr)&&(!q||`${p.title} ${p.city||''} ${p.wilaya||''} ${p.address||''}`.toLowerCase().includes(q))))}
function openAddProperty(){if(!user)return openModal(`<h2>🔐 تسجيل الدخول مطلوب</h2><p>يجب إنشاء حساب أو تسجيل الدخول قبل إضافة عقارك.</p><div class="modal-actions"><button onclick="openLogin()">تسجيل الدخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button></div>`);selectedFiles=[];mainIndex=0;openModal(`<h2>🏠 أضف عقارك</h2><div class="form-group"><label>عنوان الإعلان *</label><input id="pt"></div><div class="grid2"><div class="form-group"><label>الولاية *</label><select id="pw"><option value="">اختر الولاية</option>${W.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>المدينة / البلدية *</label><input id="pc"></div><div class="form-group"><label>نوع العقار *</label><select id="pty"><option value="">اختر النوع</option>${T.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>عدد الغرف</label><input id="pro" type="number" min="1" value="1"></div><div class="form-group"><label>طبيعة الكراء *</label><select id="pper"><option value="">اختر</option><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select></div><div class="form-group"><label>السعر *</label><input id="ppr" type="number" min="1"></div><div class="form-group"><label>الحالة</label><select id="pf"><option value="false">غير مفروشة</option><option value="true">مفروشة</option></select></div></div><div class="form-group"><label>العنوان</label><input id="pa"></div><div class="form-group"><label>رقم الهاتف *</label><input id="pp" type="tel" value="${e(user.user_metadata?.phone||'')}"></div><div class="form-group"><label>وصف العقار</label><textarea id="pd"></textarea></div><div class="form-group"><label>صور العقار *</label><input id="pi" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="selectImages(event)"><p class="muted">حتى 10 صور، 5 MB للصورة. أول صورة هي الرئيسية.</p><div id="previews" class="previews"></div></div><div class="warning">سيخضع الإعلان للمراجعة قبل ظهوره للعامة. يمنع نشر أي محتوى احتيالي أو مضلل أو غير قانوني.</div><div class="modal-actions"><button onclick="publish()">🚀 إرسال للمراجعة</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function selectImages(ev){for(let f of Array.from(ev.target.files||[])){if(!f.type.startsWith('image/'))continue;if(f.size>5*1024*1024){toast(`الصورة ${f.name} أكبر من 5 MB`);continue}if(selectedFiles.length>=10)break;selectedFiles.push(f)}renderPreviews()}
function renderPreviews(){let c=document.getElementById('previews');if(!c)return;c.innerHTML=selectedFiles.map((f,i)=>`<div class="preview"><img src="${URL.createObjectURL(f)}"><span>${i===0?'⭐ الرئيسية':'صورة '+(i+1)}</span></div>`).join('')}
async function publish(){if(!user)return toast('يجب تسجيل الدخول');let title=pt.value.trim(),wilaya=pw.value,city=pc.value.trim(),type=pty.value,rooms=Number(pro.value)||1,period=pper.value,price=Number(ppr.value),furnished=pf.value==='true',address=pa.value.trim(),phone=pp.value.trim(),description=pd.value.trim();if(!title||!wilaya||!city||!type||!period||!price||!phone)return toast('يرجى ملء المعلومات الأساسية');if(!selectedFiles.length)return toast('أضف صورة واحدة على الأقل');let{data:p,error}=await sb.from('properties').insert({owner_id:user.id,title,description,wilaya,city,address,property_type:type,rooms,price,rental_period:period,furnished,phone,status:'pending'}).select().single();if(error)return toast(error.message);for(let i=0;i<selectedFiles.length;i++){let f=selectedFiles[i],safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${user.id}/${p.id}/${crypto.randomUUID()}-${safe}`,u=await sb.storage.from('property-images').upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type});if(u.error)continue;await sb.from('property_images').insert({property_id:p.id,image_path:path,is_main:i===0,sort_order:i})}closeModal();toast('تم إرسال الإعلان للمراجعة ✅');load()}
function details(id){let p=current.find(x=>x.id===id);if(!p)return;let ims=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=ims.find(x=>x.is_main)||ims[0],others=ims.filter(x=>x.id!==m?.id).slice(0,4);let gallery=m?`<div class="gallery"><img class="gallery-main" src="${imageURL(m.image_path)}"><div class="gallery-side">${others.map(x=>`<img src="${imageURL(x.image_path)}">`).join('')}</div></div>`:'<div style="height:240px;border-radius:12px;background:#e6eeeb;display:flex;align-items:center;justify-content:center;font-size:70px">🏠</div>';openModal(`<h2>${e(p.title)}</h2>${gallery}<div class="info"><p>📍 <strong>${e(p.city||'')}</strong>، ${e(p.wilaya||'')}</p><p>🏠 النوع: <strong>${e(p.property_type)}</strong></p><p>🚪 الغرف: <strong>${p.rooms||1}</strong></p><p>💰 <strong style="color:var(--g)">${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${e(P[p.rental_period]||'شهري')}</strong></p><p>🛋️ ${p.furnished?'مفروشة':'غير مفروشة'}</p><p>📝 ${e(p.description||'لا يوجد وصف')}</p></div><div class="warning">KriDari منصة لعرض وربط المستخدمين وليست طرفًا في عقد الكراء، ولا تتحمل مسؤولية محتوى أو تصرفات المستخدمين إلا في حدود ما يفرضه القانون. إذا لاحظت نشاطًا مشبوهًا استخدم زر التبليغ.</div><div class="modal-actions"><button onclick="requestVisit('${p.id}')">📅 طلب زيارة</button><button class="secondary" onclick="callOwner('${e(p.phone||'')}')">📞 الاتصال</button><button class="danger" onclick="report('${p.id}')">🚨 تبليغ</button></div>`)}
function callOwner(p){if(p)location.href='tel:'+p;else toast('رقم الهاتف غير متوفر')}
async function favorite(id){if(!user)return openLogin();let{data}=await sb.from('favorites').select('id').eq('user_id',user.id).eq('property_id',id).maybeSingle();if(data){await sb.from('favorites').delete().eq('id',data.id);toast('تم حذف العقار من المفضلة');return}let{error}=await sb.from('favorites').insert({user_id:user.id,property_id:id});toast(error?error.message:'تمت إضافة العقار إلى المفضلة ❤️')}
function requestVisit(id){if(!user)return openLogin();openModal(`<h2>📅 طلب زيارة</h2><div class="form-group"><label>التاريخ المقترح</label><input id="vd" type="date"></div><div class="form-group"><label>رسالة</label><textarea id="vm"></textarea></div><button onclick="sendVisit('${id}')">إرسال الطلب</button>`)}
async function sendVisit(id){let d=vd.value;if(!d)return toast('اختر تاريخ الزيارة');let{error}=await sb.from('visit_requests').insert({property_id:id,user_id:user.id,requested_date:d,message:vm.value.trim(),status:'pending'});if(error)return toast(error.message);closeModal();toast('تم إرسال طلب الزيارة ✅')}
function report(id){if(!user)return openLogin();openModal(`<h2>🚨 التبليغ عن إعلان</h2><p class="muted">أبلغ فقط عن مخالفة أو نشاط مشبوه حقيقي.</p><div class="form-group"><label>السبب</label><select id="rr"><option value="fraud">اشتباه في احتيال</option><option value="illegal">محتوى غير قانوني</option><option value="misleading">معلومات مضللة</option><option value="harassment">إساءة أو مضايقة</option><option value="other">أخرى</option></select></div><div class="form-group"><label>التفاصيل</label><textarea id="rd"></textarea></div><button onclick="sendReport('${id}')">إرسال التبليغ</button>`)}
async function sendReport(id){let{error}=await sb.from('reports').insert({property_id:id,reporter_id:user.id,reason:rr.value,message:rd.value.trim(),status:'pending'});if(error)return toast(error.message);closeModal();toast('تم إرسال البلاغ إلى الإدارة ✅')}
async function showMyProperties(){if(!user)return openLogin();let{data,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return toast(error.message);openModal(`<h2>🏠 عقاراتي</h2>${data?.length?data.map(p=>`<div class="admin-row"><strong>${e(p.title)}</strong><p class="muted">${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${e(P[p.rental_period]||'شهري')}</p><span class="status ${p.status}">${p.status==='pending'?'⏳ قيد المراجعة':p.status==='approved'?'✅ منشور':p.status==='rejected'?'❌ مرفوض':'🏠 مؤجر'}</span></div>`).join(''):'<div class="empty">لم تقم بإضافة أي عقار بعد.</div>'}`)}
async function openAdmin(){if(!admin)return toast('غير مصرح');let{data:props}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').order('created_at',{ascending:false}),{data:reports}=await sb.from('reports').select('*').order('created_at',{ascending:false});openModal(`<h2>🛡️ لوحة التحكم</h2><h3>📋 الإعلانات</h3>${props?.length?props.map(p=>`<div class="admin-row"><strong>${e(p.title)}</strong><p class="muted">${e(p.city||'')}، ${e(p.wilaya||'')} · ${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${e(P[p.rental_period]||'شهري')}</p><span class="status ${p.status}">${e(p.status)}</span><div class="actions" style="margin-top:10px">${p.status!=='approved'?`<button onclick="moderate('${p.id}','approved')">✅ قبول</button>`:''}${p.status!=='rejected'?`<button class="danger" onclick="moderate('${p.id}','rejected')">❌ رفض</button>`:''}</div></div>`).join(''):'<p class="muted">لا توجد إعلانات.</p>'}<hr><h3>🚨 البلاغات</h3>${reports?.length?reports.map(r=>`<div class="admin-row report"><strong>${e(r.reason)}</strong><p class="muted">${e(r.message||'لا تفاصيل')}</p><p class="muted">${e(r.status||'pending')}</p>${r.status==='pending'?`<button onclick="reviewReport('${r.id}')">تمت المراجعة</button>`:''}</div>`).join(''):'<p class="muted">لا توجد بلاغات.</p>'}`)}
async function moderate(id,status){if(!admin)return;let{error}=await sb.from('properties').update({status}).eq('id',id);if(error)return toast(error.message);toast(status==='approved'?'تم قبول الإعلان ✅':'تم رفض الإعلان ❌');openAdmin();load()}
async function reviewReport(id){if(!admin)return;let{error}=await sb.from('reports').update({status:'reviewed',reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id);if(error)return toast(error.message);toast('تم تسجيل مراجعة البلاغ');openAdmin()}
function showPrivacy(){openModal(`<h2>🔐 الخصوصية وشروط الاستخدام</h2><p class="muted">يستخدم KriDari بيانات الحساب والإعلانات وطلبات الزيارة لتشغيل المنصة. يلتزم المستخدم بتقديم معلومات صحيحة وعدم نشر محتوى احتيالي أو غير قانوني أو مسيء.</p><p class="muted">KriDari منصة تقنية للعرض والربط بين المستخدمين وليست طرفًا في عقد الكراء ولا تضمن هوية أي مستخدم أو صحة كل إعلان. يجب على المستخدمين التحقق بأنفسهم قبل الدفع أو التعاقد.</p><p class="muted">يمكن الإبلاغ عن أي محتوى أو سلوك مشبوه، وتقوم الإدارة بمراجعته واتخاذ الإجراء المناسب وفق القوانين والسياسات المعمول بها.</p><p class="muted">الموافقة على هذه الشروط مطلوبة لإنشاء حساب جديد.</p>`)}function showSafety(){openModal(`<h2>🛡️ السلامة والتبليغ</h2><p class="muted">لا ترسل أموالًا قبل التحقق من العقار والمالك. لا تشارك كلمات المرور أو رموز التحقق. إذا بدا الإعلان مشبوهًا استخدم زر 🚨 تبليغ.</p>`)}
fillFilters();loadUser();load();
</script>
</body>
</html>
