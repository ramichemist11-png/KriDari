<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KriDari - كراء العقارات في الجزائر</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f6f8f7;
    color:#172033;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    background:#176b5b;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

header{
    padding:15px 6%;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 2px 8px #00000010;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#176b5b;
}

.logo span{
    color:#f29f05;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.secondary{
    background:#eef5f2;
    color:#176b5b;
}

.hero{
    background:#176b5b;
    color:white;
    text-align:center;
    padding:65px 20px 75px;
}

.hero h1{
    font-size:42px;
    margin:10px 0;
}

.hero p{
    font-size:20px;
    margin-bottom:30px;
}

.search{
    max-width:950px;
    margin:auto;
    background:white;
    padding:12px;
    border-radius:15px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:8px;
}

select,
input,
textarea{
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    width:100%;
    font-size:15px;
    background:white;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.wrap{
    max-width:1150px;
    margin:auto;
    padding:40px 6%;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    border:1px solid #e2e5e4;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 3px 15px #00000008;
}

.photo{
    height:190px;
    background:linear-gradient(135deg,#d9e6e2,#efd4a5);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#176b5b;
    font-weight:bold;
    overflow:hidden;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.body{
    padding:18px;
}

.price{
    font-size:21px;
    font-weight:bold;
    color:#176b5b;
}

.muted{
    color:#68717e;
    font-size:14px;
}

.card h3{
    margin-bottom:8px;
}

.card-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.card-actions button{
    flex:1;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0009;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.box{
    position:relative;
    background:white;
    padding:28px;
    border-radius:18px;
    width:min(550px,100%);
    max-height:90vh;
    overflow:auto;
}

.close{
    position:absolute;
    top:12px;
    left:12px;
    width:38px;
    height:38px;
    padding:0;
    border-radius:50%;
    background:#f1f3f2;
    color:#333;
    font-size:22px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.modal-title{
    margin-top:5px;
    margin-bottom:25px;
    color:#176b5b;
}

.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#e7f7ef;
    color:#176b5b;
}

.error{
    background:#fdeaea;
    color:#b42318;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.user-box{
    display:none;
    align-items:center;
    gap:8px;
}

@media(max-width:850px){

    header{
        flex-direction:column;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        flex:1;
    }

    .hero h1{
        font-size:30px;
    }

    .hero p{
        font-size:17px;
    }

    .search{
        grid-template-columns:1fr;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .form-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Kri<span>Dari</span>
    </div>

    <div class="header-buttons">

        <div id="userBox" class="user-box">
            <span id="userName"></span>
            <button class="secondary" onclick="logout()">خروج</button>
        </div>

        <button id="loginBtn" onclick="openLogin()">
            تسجيل الدخول
        </button>

        <button onclick="openAddProperty()">
            + أضف عقارك
        </button>

    </div>

</header>


<section class="hero">

    <h1>لقّي دارك بسهولة 🏠</h1>

    <p>
        منصة كراء الشقق والعقارات في الجزائر
    </p>

    <div class="search">

        <select id="w">
            <option value="">كل الولايات</option>
            <option>وهران</option>
            <option>الجزائر</option>
            <option>قسنطينة</option>
            <option>غليزان</option>
            <option>سطيف</option>
            <option>عنابة</option>
            <option>البليدة</option>
            <option>تيبازة</option>
        </select>

        <select id="t">
            <option value="">كل الأنواع</option>
            <option>F1</option>
            <option>F2</option>
            <option>F3</option>
            <option>F4</option>
            <option>F5</option>
            <option>Villa</option>
        </select>

        <input
            id="m"
            type="number"
            placeholder="أقصى سعر DA"
        >

        <button onclick="searchProperties()">
            بحث 🔎
        </button>

    </div>

</section>


<main class="wrap">

    <div class="section-title">
        <h2>العقارات المتاحة</h2>
        <span id="propertyCount" class="muted"></span>
    </div>

    <div id="cards" class="cards"></div>

</main>


<!-- MODAL -->

<div id="modal" class="modal">

    <div class="box">

        <button class="close" onclick="closeModal()">×</button>

        <div id="content"></div>

    </div>

</div>


<script>

/* =========================
   DATA
========================= */

const defaultProperties = [

{
    id:1,
    title:"شقة F3 عصرية",
    wilaya:"وهران",
    city:"السانية",
    type:"F3",
    price:45000,
    rooms:3,
    furnished:"مفروشة",
    image:""
},

{
    id:2,
    title:"شقة F2 وسط المدينة",
    wilaya:"الجزائر",
    city:"باب الزوار",
    type:"F2",
    price:38000,
    rooms:2,
    furnished:"غير مفروشة",
    image:""
},

{
    id:3,
    title:"F4 واسعة للعائلات",
    wilaya:"قسنطينة",
    city:"الخروب",
    type:"F4",
    price:55000,
    rooms:4,
    furnished:"غير مفروشة",
    image:""
},

{
    id:4,
    title:"F1 مفروشة",
    wilaya:"وهران",
    city:"وهران",
    type:"F1",
    price:30000,
    rooms:1,
    furnished:"مفروشة",
    image:""
},

{
    id:5,
    title:"Villa عائلية",
    wilaya:"غليزان",
    city:"غليزان",
    type:"Villa",
    price:85000,
    rooms:5,
    furnished:"غير مفروشة",
    image:""
}

];


let properties =
    JSON.parse(localStorage.getItem("kridari_properties"))
    || defaultProperties;


let users =
    JSON.parse(localStorage.getItem("kridari_users"))
    || [];


let currentUser =
    JSON.parse(localStorage.getItem("kridari_current_user"))
    || null;


/* =========================
   SAVE
========================= */

function saveProperties(){

    localStorage.setItem(
        "kridari_properties",
        JSON.stringify(properties)
    );

}


function saveUsers(){

    localStorage.setItem(
        "kridari_users",
        JSON.stringify(users)
    );

}


/* =========================
   RENDER
========================= */

function render(list = properties){

    const cards =
        document.getElementById("cards");

    document.getElementById("propertyCount").textContent =
        list.length + " عقار";


    if(list.length === 0){

        cards.innerHTML = `
            <div class="empty">
                <h3>لا توجد عقارات</h3>
                <p>جرّب تغيير معايير البحث.</p>
            </div>
        `;

        return;
    }


    cards.innerHTML = list.map(p => `

        <article class="card">

            <div class="photo">

                ${
                    p.image
                    ?
                    `<img src="${p.image}" alt="${p.title}">`
                    :
                    `🏠 عقار للإيجار`
                }

            </div>

            <div class="body">

                <div class="price">
                    ${Number(p.price).toLocaleString("fr-DZ")}
                    DA / شهر
                </div>

                <h3>
                    ${escapeHtml(p.title)}
                </h3>

                <p class="muted">
                    📍 ${escapeHtml(p.city)}،
                    ${escapeHtml(p.wilaya)}
                </p>

                <p class="muted">
                    ${p.type}
                    · ${p.rooms} غرف
                    · ${p.furnished}
                </p>

                <div class="card-actions">

                    <button onclick="showDetails(${p.id})">
                        التفاصيل
                    </button>

                </div>

            </div>

        </article>

    `).join("");

}


/* =========================
   SEARCH
========================= */

function searchProperties(){

    const w =
        document.getElementById("w").value;

    const t =
        document.getElementById("t").value;

    const m =
        Number(document.getElementById("m").value);


    const result = properties.filter(p =>

        (!w || p.wilaya === w) &&

        (!t || p.type === t) &&

        (!m || Number(p.price) <= m)

    );


    render(result);
}


/* =========================
   MODAL
========================= */

function openModal(html){

    document.getElementById("content").innerHTML =
        html;

    document.getElementById("modal").style.display =
        "flex";

}


function closeModal(){

    document.getElementById("modal").style.display =
        "none";

    document.getElementById("content").innerHTML =
        "";

}


/* Close when clicking outside */

document.getElementById("modal").addEventListener(
    "click",
    function(e){

        if(e.target === this){
            closeModal();
        }

    }
);


/* =========================
   REGISTER
========================= */

function openRegister(){

    openModal(`

        <h2 class="modal-title">
            إنشاء حساب جديد
        </h2>

        <div id="registerMessage"
             class="message">
        </div>

        <div class="form-group">
            <label>الاسم</label>
            <input id="regName"
                   placeholder="الاسم الكامل">
        </div>

        <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input id="regEmail"
                   type="email"
                   placeholder="example@email.com">
        </div>

        <div class="form-group">
            <label>كلمة المرور</label>
            <input id="regPassword"
                   type="password"
                   placeholder="كلمة المرور">
        </div>

        <button
            style="width:100%"
            onclick="registerUser()">
            إنشاء الحساب
        </button>

        <p style="text-align:center">
            لديك حساب؟
            <a href="#"
               onclick="openLogin();return false;">
               تسجيل الدخول
            </a>
        </p>

    `);

}


function registerUser(){

    const name =
        document.getElementById("regName").value.trim();

    const email =
        document.getElementById("regEmail").value.trim();

    const password =
        document.getElementById("regPassword").value;


    if(!name || !email || !password){

        showMessage(
            "registerMessage",
            "يرجى ملء جميع المعلومات.",
            "error"
        );

        return;
    }


    if(users.some(u => u.email === email)){

        showMessage(
            "registerMessage",
            "هذا البريد الإلكتروني مسجل مسبقاً.",
            "error"
        );

        return;
    }


    users.push({
        id:Date.now(),
        name,
        email,
        password
    });


    saveUsers();


    showMessage(
        "registerMessage",
        "تم إنشاء الحساب بنجاح.",
        "success"
    );


    setTimeout(openLogin,700);

}


/* =========================
   LOGIN
========================= */

function openLogin(){

    openModal(`

        <h2 class="modal-title">
            تسجيل الدخول
        </h2>

        <div id="loginMessage"
             class="message">
        </div>

        <div class="form-group">

            <label>
                البريد الإلكتروني
            </label>

            <input
                id="loginEmail"
                type="email"
                placeholder="example@email.com">

        </div>

        <div class="form-group">

            <label>
                كلمة المرور
            </label>

            <input
                id="loginPassword"
                type="password"
                placeholder="كلمة المرور">

        </div>

        <button
            style="width:100%"
            onclick="loginUser()">

            دخول

        </button>

        <p style="text-align:center">

            ليس لديك حساب؟

            <a href="#"
               onclick="openRegister();return false;">

               إنشاء حساب

            </a>

        </p>

    `);

}


function loginUser(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    const user =
        users.find(
            u =>
            u.email === email &&
            u.password === password
        );


    if(!user){

        showMessage(
            "loginMessage",
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
            "error"
        );

        return;
    }


    currentUser = user;

    localStorage.setItem(
        "kridari_current_user",
        JSON.stringify(user)
    );


    closeModal();

    updateHeader();

}


/* =========================
   LOGOUT
========================= */

function logout(){

    currentUser = null;

    localStorage.removeItem(
        "kridari_current_user"
    );

    updateHeader();

}


/* =========================
   HEADER
========================= */

function updateHeader(){

    const loginBtn =
        document.getElementById("loginBtn");

    const userBox =
        document.getElementById("userBox");

    const userName =
        document.getElementById("userName");


    if(currentUser){

        loginBtn.style.display = "none";

        userBox.style.display = "flex";

        userName.textContent =
            "مرحباً " + currentUser.name;

    }else{

        loginBtn.style.display = "block";

        userBox.style.display = "none";

    }

}


/* =========================
   ADD PROPERTY
========================= */

function openAddProperty(){

    if(!currentUser){

        openModal(`

            <h2 class="modal-title">
                إضافة عقار
            </h2>

            <p>
                يجب تسجيل الدخول أولاً لإضافة عقارك.
            </p>

            <button
                onclick="openLogin()"
                style="width:100%">

                تسجيل الدخول

            </button>

        `);

        return;
    }


    openModal(`

        <h2 class="modal-title">
            أضف عقارك 🏠
        </h2>

        <div id="propertyMessage"
             class="message">
        </div>

        <div class="form-group">

            <label>
                عنوان العقار
            </label>

            <input
                id="propertyTitle"
                placeholder="مثال: شقة F3 عصرية">

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>
                    الولاية
                </label>

                <select id="propertyWilaya">

                    <option>وهران</option>
                    <option>الجزائر</option>
                    <option>قسنطينة</option>
                    <option>غليزان</option>
                    <option>سطيف</option>
                    <option>عنابة</option>
                    <option>البليدة</option>
                    <option>تيبازة</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    المدينة
                </label>

                <input
                    id="propertyCity"
                    placeholder="مثال: السانية">

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>
                    النوع
                </label>

                <select id="propertyType">

                    <option>F1</option>
                    <option>F2</option>
                    <option>F3</option>
                    <option>F4</option>
                    <option>F5</option>
                    <option>Villa</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    عدد الغرف
                </label>

                <input
                    id="propertyRooms"
                    type="number"
                    min="1"
                    placeholder="3">

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>
                    السعر DA / شهر
                </label>

                <input
                    id="propertyPrice"
                    type="number"
                    min="0"
                    placeholder="45000">

            </div>


            <div class="form-group">

                <label>
                    الحالة
                </label>

                <select id="propertyFurnished">

                    <option>
                        مفروشة
                    </option>

                    <option>
                        غير مفروشة
                    </option>

                </select>

            </div>

        </div>


        <div class="form-group">

            <label>
                صورة العقار
            </label>

            <input
                id="propertyImage"
                type="file"
                accept="image/*">

        </div>


        <div class="form-group">

            <label>
                وصف العقار
            </label>

            <textarea
                id="propertyDescription"
                placeholder="اكتب معلومات إضافية عن العقار...">
            </textarea>

        </div>


        <button
            style="width:100%"
            onclick="addProperty()">

            نشر العقار

        </button>

    `);

}


function addProperty(){

    const title =
        document.getElementById("propertyTitle")
        .value.trim();

    const wilaya =
        document.getElementById("propertyWilaya")
        .value;

    const city =
        document.getElementById("propertyCity")
        .value.trim();

    const type =
        document.getElementById("propertyType")
        .value;

    const rooms =
        Number(
            document.getElementById("propertyRooms").value
        );

    const price =
        Number(
            document.getElementById("propertyPrice").value
        );

    const furnished =
        document.getElementById("propertyFurnished")
        .value;

    const description =
        document.getElementById("propertyDescription")
        .value.trim();

    const imageInput =
        document.getElementById("propertyImage");


    if(
        !title ||
        !city ||
        !rooms ||
        !price
    ){

        showMessage(
            "propertyMessage",
            "يرجى ملء المعلومات الأساسية.",
            "error"
        );

        return;
    }


    const createProperty = image => {

        const property = {

            id:Date.now(),

            title,

            wilaya,

            city,

            type,

            price,

            rooms,

            furnished,

            description,

            image:image || "",

            owner:currentUser.email,

            createdAt:new Date().toISOString()

        };


        properties.unshift(property);

        saveProperties();

        closeModal();

        render();

        window.scrollTo({
            top:document.querySelector(".wrap").offsetTop,
            behavior:"smooth"
        });

    };


    const file =
        imageInput.files[0];


    if(file){

        const reader =
            new FileReader();

        reader.onload = function(e){

            createProperty(e.target.result);

        };

        reader.readAsDataURL(file);

    }else{

        createProperty("");

    }

}


/* =========================
   PROPERTY DETAILS
========================= */

function showDetails(id){

    const p =
        properties.find(x => x.id === id);

    if(!p) return;


    openModal(`

        <h2 class="modal-title">
            ${escapeHtml(p.title)}
        </h2>

        ${
            p.image
            ?
            `<img
                src="${p.image}"
                style="
                    width:100%;
                    height:230px;
                    object-fit:cover;
                    border-radius:12px;
                    margin-bottom:15px;
                ">`
            :
            ""
        }

        <p>
            📍
            ${escapeHtml(p.city)}،
            ${escapeHtml(p.wilaya)}
        </p>

        <h2 style="color:#176b5b">

            ${Number(p.price).toLocaleString("fr-DZ")}
            DA / شهر

        </h2>

        <p>
            🏠 النوع:
            ${p.type}
        </p>

        <p>
            🛏 عدد الغرف:
            ${p.rooms}
        </p>

        <p>
            🪑 الحالة:
            ${p.furnished}
        </p>

        ${
            p.description
            ?
            `<p>${escapeHtml(p.description)}</p>`
            :
            ""
        }

        <button
            onclick="requestVisit('${p.id}')"
            style="width:100%;margin-top:15px">

            طلب زيارة 📅

        </button>

    `);

}


/* =========================
   VISIT
========================= */

function requestVisit(id){

    if(!currentUser){

        openLogin();

        return;
    }


    alert(
        "تم إرسال طلب الزيارة بنجاح.\nسنتواصل معك قريباً."
    );

}


/* =========================
   MESSAGE
========================= */

function showMessage(id,text,type){

    const el =
        document.getElementById(id);

    el.textContent = text;

    el.className =
        "message " + type;

    el.style.display = "block";

}


/* =========================
   SECURITY / HTML
========================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

updateHeader();

render();

</script>

</body>
  </html>
