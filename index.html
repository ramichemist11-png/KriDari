<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://rvhqwpynhlgcscscybse.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HTJaBpq4c4JSyk5ybSOyNg_QS8tx3WE";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let currentProfile = null;
let currentProperties = [];
let selectedFiles = [];
let mainImageIndex = 0;


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function periodLabel(period){

if(period === "daily") return "يومي";
if(period === "yearly") return "سنوي";

return "شهري";

}


function periodSuffix(period){

if(period === "daily") return " / يوم";
if(period === "yearly") return " / سنة";

return " / شهر";

}


function formatPrice(price,period){

return Number(price || 0).toLocaleString("fr-DZ")
+ " DA"
+ periodSuffix(period);

}


function toast(message){

const el = document.getElementById("toast");

el.textContent = message;
el.classList.add("show");

setTimeout(() => {
el.classList.remove("show");
},3000);

}


function openModal(html){

document.getElementById("modalContent").innerHTML = html;
document.getElementById("modal").classList.add("show");

}


function closeModal(){

document.getElementById("modal").classList.remove("show");

}


document.getElementById("modal").addEventListener(
"click",
function(e){

if(e.target === this){
closeModal();
}

}
);


/* =====================================================
   PROFILE / ADMIN
===================================================== */

async function loadProfile(){

if(!currentUser){
currentProfile = null;
return;
}

const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(error){
console.error(error);
currentProfile = null;
return;
}

currentProfile = data || null;

}


function isAdmin(){

return currentProfile?.role === "admin";

}


/* =====================================================
   AUTH
===================================================== */

async function loadUser(){

const {
data:{session}
} = await supabaseClient.auth.getSession();

currentUser = session?.user || null;

await loadProfile();

updateNav();

}


supabaseClient.auth.onAuthStateChange(
async (event,session) => {

currentUser = session?.user || null;

await loadProfile();

updateNav();

if(event === "SIGNED_IN"){
await loadProperties();
}

}
);


function updateNav(){

const nav = document.getElementById("nav");

if(currentUser){

const name =
currentUser.user_metadata?.full_name ||
currentUser.email?.split("@")[0] ||
"مستخدم";

nav.innerHTML = `

<span class="user">
مرحبًا <strong>${escapeHTML(name)}</strong>
</span>

<button onclick="openAddProperty()">
+ أضف عقارك
</button>

<button class="secondary"
onclick="showMyProperties()">
عقاراتي
</button>

${
isAdmin()
?
`<button onclick="openAdminDashboard()">
🛡️ لوحة الإدارة
</button>`
:
""
}

<button class="secondary"
onclick="logout()">
خروج
</button>

`;

}else{

nav.innerHTML = `

<button onclick="openAddProperty()">
+ أضف عقارك
</button>

<button class="secondary"
onclick="openLogin()">
تسجيل الدخول
</button>

<button class="secondary"
onclick="openRegister()">
إنشاء حساب
</button>

`;

}

}


function openLogin(){

openModal(`

<h2>🔐 تسجيل الدخول</h2>

<div class="form-group">
<label>البريد الإلكتروني</label>
<input id="loginEmail" type="email"
placeholder="example@email.com">
</div>

<div class="form-group">
<label>كلمة المرور</label>
<input id="loginPassword" type="password"
placeholder="كلمة المرور">
</div>

<div class="modal-actions">

<button onclick="login()">دخول</button>

<button class="secondary"
onclick="openRegister()">
إنشاء حساب
</button>

</div>

`);

}


async function login(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

if(!email || !password){

toast("أدخل البريد وكلمة المرور");
return;

}

const {error} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

toast(error.message);
return;

}

closeModal();

toast("تم تسجيل الدخول بنجاح ✅");

}


function openRegister(){

openModal(`

<h2>📝 إنشاء حساب</h2>

<div class="form-group">
<label>الاسم الكامل</label>
<input id="regName" placeholder="اسمك الكامل">
</div>

<div class="form-group">
<label>رقم الهاتف</label>
<input id="regPhone" type="tel"
placeholder="05xxxxxxxx">
</div>

<div class="form-group">
<label>البريد الإلكتروني</label>
<input id="regEmail" type="email"
placeholder="example@email.com">
</div>

<div class="form-group">
<label>كلمة المرور</label>
<input id="regPassword" type="password"
placeholder="6 أحرف على الأقل">
</div>

<div class="modal-actions">

<button onclick="register()">إنشاء الحساب</button>

<button class="secondary"
onclick="openLogin()">
لدي حساب
</button>

</div>

`);

}


async function register(){

const name =
document.getElementById("regName").value.trim();

const phone =
document.getElementById("regPhone").value.trim();

const email =
document.getElementById("regEmail").value.trim();

const password =
document.getElementById("regPassword").value;

if(!name || !phone || !email || !password){

toast("يرجى ملء جميع المعلومات");
return;

}

if(password.length < 6){

toast("كلمة المرور يجب أن تكون 6 أحرف على الأقل");
return;

}

const {data,error} =
await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
full_name:name,
phone:phone
}
}

});

if(error){

toast(error.message);
return;

}

closeModal();

if(data.session){
toast("تم إنشاء الحساب بنجاح 🎉");
}else{
toast("تم إنشاء الحساب. تحقق من بريدك الإلكتروني.");
}

}


async function logout(){

await supabaseClient.auth.signOut();

currentUser = null;
currentProfile = null;

updateNav();

toast("تم تسجيل الخروج");

}


/* =====================================================

===================================================== */

async function loadProperties(){

const {data,error} =
await supabaseClient

.from("properties")

.select(`
*,
property_images (
id,
image_path,
is_main,
sort_order
)
`)

.eq("status","approved")

.order("created_at",{
ascending:false
});

if(error){

console.error(error);

document.getElementById("cards").innerHTML = `
<div class="empty">
<h3>حدث خطأ في تحميل العقارات</h3>
<p>حاول تحديث الصفحة.</p>
</div>
`;

return;

}

currentProperties = data || [];

renderProperties(currentProperties);

}


/* =====================================================
   IMAGE URL
===================================================== */

function imageURL(path){

if(!path) return "";

const {data} =
supabaseClient
.storage
.from("property-images")
.getPublicUrl(path);

return data.publicUrl;

}


/* =====================================================
   RENDER
===================================================== */

function renderProperties(list){

const cards =
document.getElementById("cards");

document.getElementById("count").textContent =
`${list.length} عقار`;

if(!list.length){

cards.innerHTML = `
<div class="empty">
<h3>لا توجد عقارات متاحة حاليًا</h3>
<p>كن أول من يضيف عقارًا إلى KriDari.</p>
</div>
`;

return;

}

cards.innerHTML = list.map(p => {

const images =
(p.property_images || [])
.sort((a,b) => (a.sort_order || 0) - (b.sort_order || 0));

const first =
images.find(x => x.is_main) ||
images[0];

const image =
first ? imageURL(first.image_path) : "";

return `

<article class="card">

<div class="card-image">

<span class="badge">
${images.length ? `📷 ${images.length}` : "إعلان"}
</span>

<span class="period-badge">
${periodLabel(p.rental_period)}
</span>

${
image
?
`<img src="${image}" alt="${escapeHTML(p.title)}">`
:
`<div style="
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;">
🏠
</div>`
}

</div>

<div class="card-body">

<div class="price">
${formatPrice(p.price,p.rental_period)}
</div>

<h3>${escapeHTML(p.title)}</h3>

<p class="muted">
📍 ${escapeHTML(p.city || "")}،
${escapeHTML(p.wilaya)}
</p>

<p class="muted">
${escapeHTML(p.property_type)}
· ${p.rooms || 1} غرف
· ${p.furnished ? "مفروشة" : "غير مفروشة"}
</p>

<div class="actions">

<button onclick="showDetails('${p.id}')">
التفاصيل
</button>

<button class="secondary"
onclick="favorite('${p.id}')">
❤️
</button>

</div>

</div>
</article>

`;

}).join("");

}


/* =====================================================
   SEARCH
===================================================== */

function searchProperties(){

const wilaya =
document.getElementById("searchWilaya").value;

const type =
document.getElementById("searchType").value;

const period =
document.getElementById("searchPeriod").value;

const price =
Number(document.getElementById("searchPrice").value);

const text =
document.getElementById("searchText")
.value.trim()
.toLowerCase();

const result =
currentProperties.filter(p => {

const a = !wilaya || p.wilaya === wilaya;
const b = !type || p.property_type === type;
const c = !period || p.rental_period === period;
const d = !price || Number(p.price) <= price;

const combined =
`${p.title} ${p.city || ""} ${p.wilaya} ${p.address || ""}`
.toLowerCase();

const e = !text || combined.includes(text);

return a && b && c && d && e;

});

renderProperties(result);

}

/* =====================================================
   SELECT IMAGES
===================================================== */

function selectImages(event){

const files =
Array.from(event.target.files || []);

if(!files.length) return;

for(const file of files){

if(!file.type.startsWith("image/")){
toast("يسمح فقط بملفات الصور");
continue;
}

if(file.size > 5 * 1024 * 1024){
toast(`الصورة ${file.name} أكبر من 5 MB`);
continue;
}

if(selectedFiles.length >= 10){
toast("الحد الأقصى 10 صور");
break;
}

selectedFiles.push(file);

}

renderPreviews();

}


function renderPreviews(){

const container =
document.getElementById("previews");

if(!container) return;

container.innerHTML = "";

selectedFiles.forEach((file,index) => {

const url =
URL.createObjectURL(file);

container.innerHTML += `

<div class="preview">

<img src="${url}">

${
index === mainImageIndex
?
`<div class="main-label">⭐ الرئيسية</div>`
:
""
}

</div>

`;

});

}


/* =====================================================
   PUBLISH PROPERTY
===================================================== */

async function publishProperty(){

if(!currentUser){
toast("يجب تسجيل الدخول");
return;
}

const title =
document.getElementById("pTitle").value.trim();

const wilaya =
document.getElementById("pWilaya").value;

const city =
document.getElementById("pCity").value.trim();

const type =
document.getElementById("pType").value;

const rooms =
Number(document.getElementById("pRooms").value);

const rentalPeriod =
document.getElementById("pRentalPeriod").value;

const price =
Number(document.getElementById("pPrice").value);

const furnished =
document.getElementById("pFurnished").value === "true";

const address =
document.getElementById("pAddress").value.trim();

const phone =
document.getElementById("pPhone").value.trim();

const description =
document.getElementById("pDescription").value.trim();

if(
!title ||
!wilaya ||
!city ||
!type ||
!rentalPeriod ||
!price ||
!phone
){

toast("يرجى ملء جميع المعلومات الأساسية");
return;

}

if(selectedFiles.length === 0){

toast("أضف صورة واحدة على الأقل");
return;

}

const publishButton =
document.querySelector(
"#modalContent .modal-actions button"
);

if(publishButton){
publishButton.disabled = true;
publishButton.textContent = "جاري الإرسال...";
}

try{

const {
data:property,
error:propertyError
} = await supabaseClient

.from("properties")

.insert({

owner_id:currentUser.id,
title,
description,
wilaya,
city,
address,
property_type:type,
rooms:rooms || 1,
price,
rental_period:rentalPeriod,
furnished,
phone,
status:"pending"

})

.select()
.single();

if(propertyError){
throw propertyError;
}


/* Upload images */

for(let i=0;i<selectedFiles.length;i++){

const file =
selectedFiles[i];

const safeName =
file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

const path =
`${currentUser.id}/${property.id}/${crypto.randomUUID()}-${safeName}`;

const {
error:uploadError
} = await supabaseClient

.storage

.from("property-images")

.upload(path,file,{

cacheControl:"3600",
upsert:false,
contentType:file.type

});

if(uploadError){

console.error(uploadError);
continue;

}

const {
error:imageError
} = await supabaseClient

.from("property_images")

.insert({

property_id:property.id,
image_path:path,
is_main:i === mainImageIndex,
sort_order:i

});

if(imageError){
console.error(imageError);
}

}

closeModal();

toast(
"تم إرسال العقار للمراجعة بنجاح ✅"
);

selectedFiles = [];

await loadProperties();

}catch(error){

console.error(error);

toast(
"حدث خطأ أثناء نشر العقار: " +
(error.message || "")
);

if(publishButton){

publishButton.disabled = false;
publishButton.textContent = "🚀 إرسال للمراجعة";

}

}

}

async function adminApprove(propertyId){

if(!isAdmin()){

toast("ليس لديك صلاحية");
return;

}

const {error} =
await supabaseClient

.from("properties")

.update({
status:"approved"
})

.eq("id",propertyId);

if(error){

toast(error.message);
return;

}

toast("تمت الموافقة ونشر العقار ✅");

await openAdminDashboard();
await loadProperties();

}


async function adminReject(propertyId){

if(!isAdmin()){

toast("ليس لديك صلاحية");
return;

}

const {error} =
await supabaseClient

.from("properties")

.update({
status:"rejected"
})

.eq("id",propertyId);

if(error){

toast(error.message);
return;

}

toast("تم رفض الإعلان ❌");

await openAdminDashboard();

}


async function adminDelete(propertyId){

if(!isAdmin()){

toast("ليس لديك صلاحية");
return;

}

if(!confirm("هل أنت متأكد من حذف هذا الإعلان نهائيًا؟")){
return;
}

const {error} =
await supabaseClient

.from("properties")

.delete()

.eq("id",propertyId);

if(error){

toast(error.message);
return;

}

toast("تم حذف الإعلان 🗑️");

await openAdminDashboard();
await loadProperties();

}
