<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123f38">
  <title>KriDari | كراء العقارات في الجزائر</title>
  <style>html,body{margin:0;height:100%;background:#f5f6f4;font-family:Tahoma,Arial,sans-serif}body{display:grid;place-items:center;color:#123f38;font-weight:700}#e{display:none;color:#b42318;text-align:center;padding:20px}</style>
</head>
<body>
  <div id="l">جاري فتح KriDari…</div>
  <div id="e">تعذر تشغيل التطبيق. يرجى إعادة تحميل الصفحة.</div>
  <script>
  (async()=>{
    try{
      const r=await fetch('/app.html?boot='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error('app '+r.status);
      let html=await r.text();
      html=html.replace(/https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2/g,'https://unpkg.com/@supabase/supabase-js@2');
      document.open();document.write(html);document.close();
    }catch(err){console.error(err);document.getElementById('l').style.display='none';document.getElementById('e').style.display='block'}
  })();
  </script>
</body>
</html>
