<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123f38">
<meta name="description" content="KriDari - منصة كراء العقارات في الجزائر">
<title>KriDari | كراء العقارات في الجزائر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --green:#123f38;
  --green2:#176b5b;
  --gold:#c99a3d;
  --bg:#f5f6f4;
  --white:#fff;
  --text:#18211f;
  --muted:#69736f;
  --line:#dfe6e2;
  --danger:#b42318;
  --shadow:0 10px 35px rgba(18,63,56,.10);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  background:var(--green2);
  color:white;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  filter:brightness(.95);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

button.secondary{
  background:#edf3f0;
  color:var(--green);
}

button.gold{
  background:var(--gold);
}

button.danger{
  background:#fff0ee;
  color:var(--danger);
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:13px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  text-decoration:none;
  font-size:30px;
  font-weight:900;
  color:var(--green);
}

.logo span{
  color:var(--gold);
}

.nav{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.user{
  font-size:13px;
  color:#46524f;
}

.hero{
  min-height:500px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  padding:60px 5%;
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      115deg,
      rgba(9,46,40,.94),
      rgba(23,107,91,.82)
    ),
    url("https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Martyrs_Memorial_Algiers.jpg/1280px-Martyrs_Memorial_Algiers.jpg")
    center/cover no-repeat;
}

.hero-content{
  width:min(1100px,100%);
  position:relative;
  z-index:2;
}

.hero h1{
  font-size:44px;
  margin:0 0 12px;
}

.hero p{
  font-size:18px;
  margin:0 0 28px;
  opacity:.94;
}

.search{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr 1.4fr auto;
  gap:8px;
  background:rgba(255,255,255,.98);
  padding:14px;
  border-radius:18px;
  box-shadow:0 20px 55px rgba(0,0,0,.25);
  color:var(--text);
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d5ded9;
  border-radius:10px;
  outline:none;
  background:white;
}

textarea{
  min-height:105px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--green2);
  box-shadow:0 0 0 3px rgba(23,107,91,.10);
}

main{
  max-width:1180px;
  margin:auto;
  padding:38px 5%;
}

.title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:23px;
}

.title-row h2{
  margin:0;
  font-size:29px;
}

.muted{
  color:var(--muted);
  font-size:14px;
  line-height:1.75;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
}

.card-image{
  height:210px;
  position:relative;
  background:linear-gradient(135deg,#dce9e5,#efd7a8);
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.badge{
  position:absolute;
  top:11px;
  right:11px;
  background:rgba(255,255,255,.96);
  color:var(--green);
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.views{
  position:absolute;
  bottom:9px;
  left:9px;
  background:rgba(0,0,0,.55);
  color:white;
  padding:4px 8px;
  border-radius:7px;
  font-size:11px;
}

.card-body{
  padding:17px;
}

.price{
  font-size:21px;
  font-weight:900;
  color:var(--green);
}

.period{
  font-size:12px;
  color:var(--gold);
  font-weight:bold;
}

.card h3{
  margin:8px 0;
  font-size:19px;
}

.chips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.chip{
  background:#f0f4f2;
  color:#38534c;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.actions button{
  flex:1;
}

.empty{
  background:white;
  border:1px solid var(--line);
  padding:45px;
  text-align:center;
  border-radius:15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.box{
  background:white;
  width:min(740px,100%);
  max-height:93vh;
  overflow:auto;
  border-radius:20px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  left:14px;
  top:13px;
  width:40px;
  height:40px;
  padding:0;
  border-radius:50%;
  background:#f0f2f1;
  color:#333;
  font-size:24px;
}

.box h2{
  color:var(--green);
  margin:0 45px 20px 0;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-weight:800;
  margin-bottom:6px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.modal-actions{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.modal-actions>*{
  flex:1;
}

.check{
  display:flex;
  gap:8px;
  align-items:flex-start;
  background:#f5f8f6;
  border:1px solid var(--line);
  padding:12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.7;
}

.check input{
  width:auto;
  margin-top:4px;
}

.check a{
  color:var(--green2);
  text-decoration:underline;
}

.previews{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-top:9px;
}

.preview{
  height:85px;
  border-radius:8px;
  overflow:hidden;
  position:relative;
  background:#eee;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview span{
  position:absolute;
  bottom:0;
  right:0;
  left:0;
  background:rgba(18,63,56,.88);
  color:white;
  text-align:center;
  font-size:10px;
  padding:4px;
}

.gallery{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:8px;
  margin-bottom:16px;
}

.gallery-main{
  width:100%;
  height:320px;
  object-fit:cover;
  border-radius:12px;
  display:block;
}

.gallery-side{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.gallery-side img{
  width:100%;
  height:156px;
  object-fit:cover;
  border-radius:9px;
  display:block;
}

.info{
  background:#f8faf9;
  border:1px solid var(--line);
  padding:15px;
  border-radius:13px;
  margin-top:15px;
}

.warning{
  background:#fff8e8;
  border:1px solid #ecd49b;
  color:#6c5015;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.7;
  margin-top:12px;
}

.status{
  display:inline-block;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
  font-weight:800;
}

.pending{
  background:#fff5d8;
  color:#8a6200;
}

.approved{
  background:#e6f6ef;
  color:#176b5b;
}

.rejected{
  background:#fff0ef;
  color:#b42318;
}

.rented{
  background:#eee;
  color:#555;
}

.admin-row{
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
}

.report{
  border-right:4px solid #c0392b;
}

hr{
  border:0;
  border-top:1px solid var(--line);
  margin:22px 0;
}

.toast{
  display:none;
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  z-index:300;
  background:#172033;
  color:white;
  padding:13px 20px;
  border-radius:10px;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

footer{
  background:#14211f;
  color:#dfe8e5;
  text-align:center;
  padding:32px 20px;
  margin-top:30px;
}

.footer-links{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  margin:15px;
}

.footer-links a{
  color:#dfe8e5;
  text-decoration:none;
}

.footer-links a:hover{
  color:#d9a441;
}

@media(max-width:1050px){
  .search{
    grid-template-columns:1fr 1fr 1fr;
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){

  header{
    flex-direction:column;
    align-items:flex-start;
  }

  .hero{
    min-height:550px;
  }

  .hero h1{
    font-size:31px;
  }

  .search{
    grid-template-columns:1fr;
  }

  .cards,
  .grid2{
    grid-template-columns:1fr;
  }

  .previews{
    grid-template-columns:repeat(3,1fr);
  }

  .gallery{
    grid-template-columns:1fr;
  }

  .gallery-main{
    height:240px;
  }

  .gallery-side img{
    height:105px;
  }

  .modal-actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>

  <a class="logo" href="#" onclick="home();return false">
    Kri<span>Dari</span>

  <div id="nav" class="nav"></div>

</header>


<section class="hero">

  <div class="hero-content">

    <p>

    </p>

    <div class="search">

      <select id="sw">

      <input

      <button onclick="searchProperties()">
        🔎 بحث
      </button>

    </div>

</section>


<main>

  <div class="title-row">

    <h2>
      العقارات المتاحة
    </h2>

    <span
      id="count"

    </span>

  </div>

  <div
    id="cards"
    class="cards">
  </div>

</main>


<footer>

  <strong
    style="color:#d9a441;font-size:22px">

  </strong>

  <div class="footer-links">

  <div

<div
  id="modal"

  <div class="box">

    <button

      onclick="closeModal()">

    </button>

    <div id="modalContent"></div>

  </div>

</div>


<div
  id="toast"
  class="toast">
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://rvhqwpynhlgcscscybse.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HTJaBpq4c4JSyk5ybSOyNg_QS8tx3WE";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ADMIN
===================================================== */

const ADMIN_EMAIL =
"rami.chemist11@gmail.com";


/* =====================================================
   DATA
===================================================== */

const WILAYAS = [
"الجزائر",
"وهران",
"قسنطينة",
"غليزان",
"عنابة",
"سطيف",
"مستغانم",
"تلمسان",
"الشلف",
"البليدة",
"بجاية",
"تيزي وزو",
"سيدي بلعباس",
"تيارت",
"معسكر",
"سعيدة",
"سكيكدة",
"جيجل",
"باتنة",
"بسكرة",
"بشار",
"البويرة",
"بومرداس",
"برج بوعريريج",
"تيبازة",
"المدية",
"قالمة",
"الطارف",
"ميلة",
"خنشلة",
"سوق أهراس",
"عين تموشنت",
"عين الدفلى",
"تيسمسيلت",
"النعامة",
"غرداية",
"ورقلة",
"الوادي",
"الجلفة",
"الأغواط",
"أدرار",
"تمنراست",
"تندوف",
"إليزي"
];

const PROPERTY_TYPES = [
"F1",
"F2",
"F3",
"F4",
"F5",
"Villa",
"Studio",
"Duplex",
"Local commercial",
"Terrain"
];

const RENTAL_PERIODS = {
daily:"يومي",
monthly:"شهري",
yearly:"سنوي"
};


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let isAdmin = false;
let currentProperties = [];
let selectedFiles = [];
let mainImageIndex = 0;


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  return Number(value || 0)
    .toLocaleString("fr-DZ");

}


function periodText(period){

  return RENTAL_PERIODS[period] || "شهري";

}


function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {
      el.classList.remove("show");
    },3000);

}


function openModal(html){

  document
    .getElementById("modalContent")
    .innerHTML = html;

  document
    .getElementById("modal")
    .classList.add("show");

}


function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}


document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(event){

      if(event.target === this){
        closeModal();
      }

    }
  );


function home(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   FILTERS
===================================================== */

function initFilters(){

  const sw =
    document.getElementById("sw");

  const st =
    document.getElementById("st");


  sw.innerHTML =
    `<option value="">كل الولايات</option>` +
    WILAYAS
      .map(w =>
        `<option value="${escapeHTML(w)}">
          ${escapeHTML(w)}
        </option>`
      )
      .join("");


  st.innerHTML =
    `<option value="">كل الأنواع</option>` +
    PROPERTY_TYPES
      .map(t =>
        `<option value="${escapeHTML(t)}">
          ${escapeHTML(t)}
        </option>`
      )
      .join("");

}


/* =====================================================
   AUTH
===================================================== */

async function loadUser(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();


  currentUser =
    session?.user || null;


  isAdmin =
    !!currentUser &&
    currentUser.email?.toLowerCase() ===
    ADMIN_EMAIL.toLowerCase();


  updateNav();

}


supabaseClient.auth.onAuthStateChange(
  async (event,session) => {

    currentUser =
      session?.user || null;

    isAdmin =
      !!currentUser &&
      currentUser.email?.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase();

    updateNav();

    if(event === "SIGNED_IN"){
      await loadProperties();
    }

  }
);


function updateNav(){

  const nav =
    document.getElementById("nav");


  if(currentUser){

    const name =
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split("@")[0] ||
      "مستخدم";


    nav.innerHTML = `

      <span class="user">
        مرحبًا
        <strong>
          ${escapeHTML(name)}
        </strong>
      </span>

      <button onclick="openAddProperty()">
        + أضف عقارك
      </button>

      <button
        class="secondary"
        onclick="showMyProperties()">
        عقاراتي
      </button>

      ${
        isAdmin
        ? `
          <button
            class="gold"
            onclick="openAdminPanel()">
            🛡️ Admin
          </button>
        `
        : ""
      }

      <button
        class="secondary"
        onclick="logout()">
        خروج
      </button>

    `;

  }else{

    nav.innerHTML = `

      <button onclick="openAddProperty()">
        + أضف عقارك
      </button>

      <button
        class="secondary"
        onclick="openLogin()">
        تسجيل الدخول
      </button>

      <button
        class="secondary"
        onclick="openRegister()">
        إنشاء حساب
      </button>

    `;

  }

}


/* =====================================================
   LOGIN
===================================================== */

function openLogin(){

  openModal(`

    <h2>🔐 تسجيل الدخول</h2>

    <div class="form-group">

      <label>
        البريد الإلكتروني
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="example@email.com">

    </div>

    <div class="form-group">

      <label>
        كلمة المرور
      </label>

      <input
        id="loginPassword"
        type="password"
        placeholder="كلمة المرور">

    </div>

    <div class="modal-actions">

      <button onclick="login()">
        دخول
      </button>

      <button
        class="secondary"
        onclick="openRegister()">
        إنشاء حساب
      </button>

    </div>

  `);

}


async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    toast(
      "أدخل البريد الإلكتروني وكلمة المرور"
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if(error){

    toast(error.message);

    return;

  }


  closeModal();

  toast("تم تسجيل الدخول بنجاح ✅");

}


/* =====================================================
   REGISTER
===================================================== */

function openRegister(){

  openModal(`

    <h2>
      📝 إنشاء حساب جديد
    </h2>

    <div class="form-group">

      <label>
        الاسم الكامل *
      </label>

      <input
        id="regName"
        placeholder="اسمك الكامل">

    </div>

    <div class="form-group">

      <label>
        رقم الهاتف *
      </label>

      <input
        id="regPhone"
        type="tel"
        placeholder="05xxxxxxxx">

    </div>

    <div class="form-group">

      <label>
        البريد الإلكتروني *
      </label>

      <input
        id="regEmail"
        type="email"
        placeholder="example@email.com">

    </div>

    <div class="form-group">

      <label>

async function register(){

      .value
      .trim();

  const phone =
    document
      .getElementById("regPhone")
      .value
      .trim();

  const email =
    document
      .getElementById("regEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("regPassword")
      .value;

  const accepted =
    document
      .getElementById("acceptTerms")
      .checked;


  if(
    !name ||
    !phone ||
    !email ||
    !password
  ){

  }


  if(password.length < 6){

  }


  if(!accepted){

    );

    return;

  }


  const {
    data,
    error
  } =

      email,

      password,

      options:{
        data:{
          full_name:name,
          phone:phone,
          accepted_terms:true,
          accepted_terms_at:new Date().toISOString()
        }
      }

    });


  if(error){

    toast(error.message);

    return;

  }


  closeModal();


  if(data.session){

      "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتفعيل الحساب."

function imageURL(path){

  if(!path){
    return "";
  }


  const {
    data
  } =
    supabaseClient.storage
      .from("property-images")
      .getPublicUrl(path);


  return data.publicUrl;

}

function searchProperties(){

  const wilaya =
    document.getElementById("sw").value;

  const type =
    document.getElementById("st").value;

  const rentalPeriod =
    document.getElementById("sp").value;

  const maxPrice =
    Number(
      document.getElementById("sprice").value
    );

  const text =
    document
      .getElementById("stext")
      .value
      .trim()
      .toLowerCase();


  const result =
    currentProperties.filter(property => {

      const a =
        !wilaya ||
        property.wilaya === wilaya;

      const b =
        !type ||
        property.property_type === type;

      const c =
        !rentalPeriod ||
        property.rental_period === rentalPeriod;

      const d =
        !maxPrice ||
        Number(property.price) <= maxPrice;


      const combined =
        `
          ${property.title || ""}
          ${property.city || ""}
          ${property.wilaya || ""}
          ${property.address || ""}
        `
        .toLowerCase();


      const e =
        !text ||
        combined.includes(text);


      return a && b && c && d && e;

    });


  renderProperties(result);

}

/* =====================================================
   IMAGE SELECT
===================================================== */

function selectImages(event){

  const incoming =
    Array.from(
      event.target.files || []
    );


  if(!incoming.length){
    return;
  }


  for(const file of incoming){

    if(!file.type.startsWith("image/")){

      toast(
        "يسمح فقط بملفات الصور"
      );

      continue;

    }


    if(
      file.size >
      5 * 1024 * 1024
    ){

      toast(
        `الصورة ${file.name} أكبر من 5 MB`
      );

      continue;

    }


    if(selectedFiles.length >= 10){

      toast(
        "الحد الأقصى 10 صور"
      );

      break;

    }


    selectedFiles.push(file);

  }


  renderPreviews();

}


function renderPreviews(){

  const container =
    document.getElementById("previews");


  if(!container){
    return;
  }


  container.innerHTML =
    selectedFiles
      .map(
        (file,index) => `

          <div class="preview">

            <img
              src="${URL.createObjectURL(file)}"
              alt="صورة">

            <span>
              ${
                index === mainImageIndex
                ? "⭐ الرئيسية"
                : "صورة " + (index + 1)
              }
            </span>

          </div>

        `
      )
      .join("");

}

async function publishProperty(){

  if(!currentUser){

    toast(
      "يجب تسجيل الدخول"
    );

    return;

  }


  const title =
    document
      .getElementById("pTitle")
      .value
      .trim();

  const wilaya =
    document
      .getElementById("pWilaya")
      .value;

  const city =
    document
      .getElementById("pCity")
      .value
      .trim();

  const type =
    document
      .getElementById("pType")
      .value;

  const rooms =
    Number(
      document
        .getElementById("pRooms")
        .value
    ) || 1;

  const period =
    document
      .getElementById("pPeriod")
      .value;

  const price =
    Number(
      document
        .getElementById("pPrice")
        .value
    );

  const furnished =
    document
      .getElementById("pFurnished")
      .value === "true";

  const address =
    document
      .getElementById("pAddress")
      .value
      .trim();

  const phone =
    document
      .getElementById("pPhone")
      .value
      .trim();

  const description =
    document
      .getElementById("pDescription")
      .value
      .trim();


  if(
    !title ||
    !wilaya ||
    !city ||
    !type ||
    !price ||
    !phone
  ){

    toast(
      "يرجى ملء جميع المعلومات الأساسية"
    );

    return;

  }


  if(!selectedFiles.length){

    toast(
      "أضف صورة واحدة على الأقل"
    );

    return;

  }


  const button =
    document.getElementById(
      "publishButton"
    );


  button.disabled = true;
  button.textContent =
    "جاري الإرسال...";


  try{

    const {
      data:property,
      error:propertyError
    } =
      await supabaseClient
        .from("properties")
        .insert({

          owner_id:
            currentUser.id,

          title,

          description,

          wilaya,

          city,

          address,

          property_type:
            type,

          rooms,

          price,

          furnished,

          phone,

          rental_period:
            period,

          status:
            "pending"

        })
        .select()
        .single();


    if(propertyError){

      throw propertyError;

    }


    for(
      let i = 0;
      i < selectedFiles.length;
      i++
    ){

      const file =
        selectedFiles[i];


      const safeName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const path =
        `${currentUser.id}/${property.id}/${crypto.randomUUID()}-${safeName}`;


      const {
        error:uploadError
      } =
        await supabaseClient
          .storage
          .from("property-images")
          .upload(
            path,
            file,
            {
              cacheControl:"3600",
              upsert:false,
              contentType:file.type
            }
          );


      if(uploadError){

        console.error(
          uploadError
        );

        continue;

      }


      await supabaseClient
        .from("property_images")
        .insert({

          property_id:
            property.id,

          image_path:
            path,

          is_main:
            i === mainImageIndex,

          sort_order:
            i

        });

    }


    closeModal();

    toast(
      "تم إرسال العقار للمراجعة بنجاح ✅"
    );


    selectedFiles = [];

    await loadProperties();


  }catch(error){

    console.error(error);

    toast(
      "تعذر نشر العقار. تحقق من جداول Supabase وRLS."
    );


  }finally{

    button.disabled = false;

    button.textContent =
      "🚀 إرسال للمراجعة";

  }

}

        user_id:
          currentUser.id,

        requested_date:
          date,

        message,

        status:
          "pending"

      });


  if(error){

    toast(
      "تعذر إرسال طلب الزيارة"
    );

    return;

  }


  closeModal();

  toast(
    "تم إرسال طلب الزيارة ✅"
  );

}

async function favorite(propertyId){

        <option>
          معلومات كاذبة
        </option>

          محتوى غير مناسب
        </option>

async function sendReport(propertyId){

    document
      .getElementById("reportReason")

    document
      .getElementById("reportDetails")
      .value
      .trim();


  if(!reason){

    toast(
      "اختر سبب التبليغ"
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("property_reports")
      .insert({

        property_id:
          propertyId,

        reporter_id:
          currentUser.id,

        reason,

        details,

        status:
          "open"

      });


  if(error){

    toast(
      "تعذر إرسال التبليغ"
    );

    return;

  }


  closeModal();

  toast(
    "تم إرسال التبليغ للإدارة ✅"

}


/* =====================================================
   MY PROPERTIES
===================================================== */

async function showMyProperties(){

  if(!currentUser){

    openLogin();

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("properties")
      .select("*")
      .eq(
        "owner_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    toast(
      "تعذر تحميل عقاراتك"
    );

    return;

  }


  if(!data.length){

    openModal(`

      <h2>
        🏠 عقاراتي
      </h2>

      <div class="empty">

        لا توجد عقارات مضافة بعد.

      </div>

      <br>

      <button
        onclick="openAddProperty()">

        + أضف أول عقار

      </button>

    `);

    return;

  }


  openModal(`

    <h2>
      🏠 عقاراتي
    </h2>

    ${
      data.map(
        property => `

          <div class="admin-row">

            <b>
              ${escapeHTML(property.title)}
            </b>

            <br><br>

            ${getStatus(property.status)}

            <p class="muted">

              ${money(property.price)}
              DA /
              ${periodText(
                property.rental_period
              )}

            </p>


            ${
              property.rejection_reason
              ?
              `
                <div class="warning">

                  سبب الرفض:

                  ${escapeHTML(
                    property.rejection_reason
                  )}

                </div>
              `
              :
              ""
            }


            ${
              property.status === "approved"
              ?
              `
                <br>

                <button
                  class="secondary"
                  onclick="markRented('${property.id}')">

                  🏠 تم التأجير

                </button>
              `
              :
              ""
            }

          </div>

        `
      ).join("")
    }

  `);

}


function getStatus(status){

  const statuses = {

    pending:[
      "pending",
      "⏳ قيد المراجعة"
    ],

    approved:[
      "approved",
      "✅ منشور"
    ],

    rejected:[
      "rejected",
      "❌ مرفوض"
    ],

    rented:[
      "rented",
      "🏠 مؤجر"
    ]

  };


  const value =
    statuses[status] ||
    [
      "pending",
      status || "غير معروف"
    ];


  return `

    <span
      class="status ${value[0]}">

      ${value[1]}

    </span>

  `;

}


async function markRented(propertyId){

  const {
    error
  } =
    await supabaseClient
      .from("properties")
      .update({
        status:"rented"
      })
      .eq(
        "id",
        propertyId
      )
      .eq(
        "owner_id",
        currentUser.id
      );


  if(error){

    toast(
      "تعذر تحديث الحالة"
    );

    return;

  }


  closeModal();

  toast(
    "تم تحديث حالة العقار"
  );

  loadProperties();

}


/* =====================================================
   ADMIN PANEL
===================================================== */

async function openAdminPanel(){

  if(!isAdmin){

    toast(
      "ليس لديك صلاحية Admin"
    );

    return;

  }


  const [
    propertiesResult,
    reportsResult
  ] =
    await Promise.all([

      supabaseClient
        .from("properties")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        ),

      supabaseClient
        .from("property_reports")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        )

    ]);


  if(propertiesResult.error){

    toast(
      "تعذر تحميل لوحة الإدارة"
    );

    return;

  }


  const properties =
    propertiesResult.data || [];

  const reports =
    reportsResult.data || [];


  window.adminProperties =
    properties;

  window.adminReports =
    reports;


  openModal(`

    <h2>
      🛡️ لوحة التحكم Admin
    </h2>

    <p class="muted">

      البريد الإداري:
      ${escapeHTML(
        currentUser.email
      )}

    </p>


    <h3>
      📋 الإعلانات
    </h3>

    <div id="adminProperties">

      ${renderAdminProperties()}

    </div>


    <hr>


    <h3>
      🚩 التبليغات
    </h3>

    <div id="adminReports">

      ${renderAdminReports()}

    </div>

  `);

}


function renderAdminProperties(){

  const properties =
    window.adminProperties || [];


  if(!properties.length){

    return `

      <div class="empty">
        لا توجد إعلانات.
      </div>

    `;

  }


  return properties
    .map(
      property => `

        <div class="admin-row">

          <b>
            ${escapeHTML(property.title)}
          </b>

          <br><br>

          ${getStatus(property.status)}

          <p class="muted">

            📍
            ${escapeHTML(property.city || "")}،
            ${escapeHTML(property.wilaya || "")}

            <br>

            💰
            ${money(property.price)}
            DA /
            ${periodText(
              property.rental_period
            )}

            <br>

            👤 Owner:
            ${escapeHTML(
              property.owner_id
            )}

          </p>


          <div class="actions">

            ${
              property.status !== "approved"
              ?
              `
                <button
                  onclick="approveProperty('${property.id}')">

                  ✅ قبول

                </button>
              `
              :
              ""
            }


            ${
              property.status !== "rejected"
              ?
              `
                <button
                  class="danger"
                  onclick="rejectProperty('${property.id}')">

                  ❌ رفض

                </button>
              `
              :
              ""
            }


            <button
              class="secondary"
              onclick="deleteProperty('${property.id}')">

              🗑️ حذف

            </button>

          </div>

        </div>

      `
    )
    .join("");

}


function renderAdminReports(){

  const reports =
    window.adminReports || [];


  if(!reports.length){

    return `

      <div class="empty">

        لا توجد تبليغات.

      </div>

    `;

  }


  return reports
    .map(
      report => `

        <div class="admin-row report">

          <b>
            🚩
            ${escapeHTML(report.reason)}
          </b>

          <p>

            ${escapeHTML(
              report.details ||
              "لا توجد تفاصيل"
            )}

          </p>

          <p class="muted">

            العقار:
            ${escapeHTML(
              report.property_id
            )}

            <br>

            المبلّغ:
            ${escapeHTML(
              report.reporter_id
            )}

            <br>

            الحالة:
            ${escapeHTML(
              report.status ||
              "open"
            )}

          </p>


          ${
            report.status !== "closed"
            ?
            `
              <button
                class="secondary"
                onclick="closeReport('${report.id}')">

                إغلاق التبليغ

              </button>
            `
            :
            `
              <span class="status approved">
                مغلق
              </span>
            `
          }

        </div>

      `
    )
    .join("");

}


/* =====================================================
   ADMIN ACTIONS
===================================================== */

async function approveProperty(id){

  if(!isAdmin){
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("properties")
      .update({

        status:"approved",

        rejection_reason:null

      })
      .eq(
        "id",
        id
      );


  if(error){

    toast(
      "تعذر قبول الإعلان"
    );

    return;

  }


  toast(
    "تم قبول الإعلان ✅"
  );


  openAdminPanel();

  loadProperties();

}


function rejectProperty(id){

  openModal(`

    <h2>
      ❌ رفض الإعلان
    </h2>

    <div class="form-group">

      <label>
        سبب الرفض
      </label>

      <textarea
        id="rejectReason"
        placeholder="اكتب سبب الرفض...">
      </textarea>

    </div>

    <button
      class="danger"
      onclick="confirmReject('${id}')">

      تأكيد الرفض

    </button>

  `);

}


async function confirmReject(id){

  const reason =
    document
      .getElementById("rejectReason")
      .value
      .trim();


  const {
    error
  } =
    await supabaseClient
      .from("properties")
      .update({

        status:"rejected",

        rejection_reason:
          reason ||
          "مخالفة شروط النشر"

      })
      .eq(
        "id",
        id
      );


  if(error){

    toast(
      "تعذر رفض الإعلان"
    );

    return;

  }


  toast(
    "تم رفض الإعلان"
  );


  openAdminPanel();

}


async function deleteProperty(id){

  if(!isAdmin){
    return;
  }


  if(
    !confirm(
      "هل تريد حذف الإعلان نهائيًا؟"
    )
  ){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("properties")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    toast(
      "تعذر حذف الإعلان"
    );

    return;

  }


  toast(
    "تم حذف الإعلان"
  );


  openAdminPanel();

  loadProperties();

}


async function closeReport(id){

  if(!isAdmin){
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("property_reports")
      .update({
        status:"closed"
      })
      .eq(
        "id",
        id
      );


  if(error){

    toast(
      "تعذر تحديث التبليغ"
    );

    return;

  }


  toast(
    "تم إغلاق التبليغ"
  );


  openAdminPanel();

}
