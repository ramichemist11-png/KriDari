<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f38"><title>KriDari | كراء العقارات في الجزائر</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,Arial,sans-serif}body{background:#f5f6f4}.bar{height:66px;position:fixed;top:0;left:0;right:0;z-index:1000;background:#fffffff7;backdrop-filter:blur(12px);border-bottom:1px solid #dfe6e2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4%;box-shadow:0 4px 18px #0001}.logo{font-size:26px;font-weight:900;color:#123f38;white-space:nowrap}.logo span{color:#c99a3d}.nav{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.nav button{border:0;border-radius:9px;padding:9px 12px;background:#176b5b;color:#fff;font-weight:700;cursor:pointer}.nav button.alt{background:#edf3f0;color:#123f38}.nav button.gold{background:#c99a3d;color:#fff}.nav .name{font-size:12px;color:#46524f;font-weight:700}.frame{position:fixed;top:66px;left:0;right:0;bottom:0;border:0;width:100%;height:calc(100% - 66px);background:#f5f6f4}.loading{position:fixed;inset:66px 0 0;z-index:900;display:grid;place-items:center;background:#f5f6f4;color:#123f38;font-weight:700}.loading.hide{display:none}@media(max-width:650px){.bar{height:58px;padding:6px 8px}.logo{font-size:21px}.nav{gap:4px}.nav button{font-size:11px;padding:7px 8px}.nav .name{display:none}.frame{top:58px;height:calc(100% - 58px)}.loading{inset:58px 0 0}}</style></head><body><div class="bar"><div class="logo">Kri<span>Dari</span></div><div id="nav" class="nav"></div></div><div id="loading" class="loading">جاري تجهيز KriDari…</div><iframe id="app" class="frame" src="/app.html" title="KriDari"></iframe><script>const frame=document.getElementById('app'),loading=document.getElementById('loading'),nav=document.getElementById('nav');let ready=false;function fw(){return frame.contentWindow}function call(name,...args){try{if(typeof fw()[name]==='function')return fw()[name](...args)}catch(e){console.error(e)}}function render(){try{const w=fw(),u=w.user,a=!!w.admin;if(u){const n=u.user_metadata?.full_name||u.email?.split('@')[0]||'مستخدم';nav.innerHTML=`<span class="name">مرحبًا ${String(n).replace(/[<>]/g,'')}</span><button onclick="call('openAddProperty')">+ أضف عقارك</button><button class="alt" onclick="call('myProperties')">عقاراتي</button>${a?'<button class="gold" onclick="call(\'openAdmin\')">🛡️ الإدارة</button>':''}<button class="alt" onclick="call('logout')">خروج</button>`}else nav.innerHTML='<button onclick="call(\'openAddProperty\')">+ أضف عقارك</button><button class="alt" onclick="call(\'openLogin\')">تسجيل الدخول</button><button class="alt" onclick="call(\'openRegister\')">إنشاء حساب</button>'}catch(e){nav.innerHTML='<button onclick="call(\'openLogin\')">تسجيل الدخول</button><button class="alt" onclick="call(\'openRegister\')">إنشاء حساب</button>'}}async function boot(){try{await new Promise(r=>setTimeout(r,500));const w=fw();if(typeof w.openRegister!=='function'){const s=w.document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';w.document.head.appendChild(s);await new Promise(resolve=>{s.onload=resolve;s.onerror=resolve});const original=[...w.document.scripts].find(x=>x.textContent&&x.textContent.includes('function openRegister'));if(original){const run=w.document.createElement('script');run.textContent=original.textContent;w.document.body.appendChild(run);await new Promise(r=>setTimeout(r,800))}}ready=true;loading.classList.add('hide');render();setInterval(render,1200)}catch(e){console.error(e);loading.textContent='تعذر تشغيل التطبيق. أعد تحميل الصفحة.'}}frame.addEventListener('load',boot);</script></body></html>
