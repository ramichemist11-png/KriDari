s,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px #176b5b1a}main{max-width:1180px;margin:auto;padding:38px 5%}.title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.title-row h2{margin:0;font-size:29px}.muted{color:var(--muted);font-size:14px;line-height:1.75}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}.card:hover{transform:translateY(-2px)}.card-image{height:210px;position:relative;background:linear-gradient(135deg,#dce9e5,#efd7a8)}.card-image img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:11px;right:11px;background:#fffffff5;color:var(--g);padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}.card-body{padding:17px}.price{font-size:21px;font-weight:900;color:var(--g)}.period{font-size:12px;color:var(--gold);font-weight:bold}.card h3{margin:8px 0;font-size:19px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#f0f4f2;color:#38534c;padding:5px 9px;border-radius:20px;font-size:12px}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}.empty{background:#fff;border:1px solid var(--line);padding:45px;text-align:center;border-radius:15px}.modal{display:none;position:fixed;inset:0;background:#0000008c;z-index:100;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;width:min(850px,100%);max-height:93vh;overflow:auto;border-radius:20px;padding:25px;position:relative}.close{position:absolute;left:14px;top:13px;width:40px;height:40px;padding:0;border-radius:50%;background:#f0f2f1;color:#333;font-size:24px}.box h2{color:var(--g);margin:0 45px 20px 0}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:800;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.check{display:flex;gap:8px;align-items:flex-start;background:#f5f8f6;border:1px solid var(--line);padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.check input{width:auto;margin-top:4px}.check a{color:var(--g2);text-decoration:underline}.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:16px}.gallery-main{width:100%;height:320px;object-fit:cover;border-radius:12px}.gallery-side{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gallery-side img{width:100%;height:156px;object-fit:cover;border-radius:9px}.info{background:#f8faf9;border:1px solid var(--line);padding:15px;border-radius:13px;margin-top:15px}.warning{background:#fff8e8;border:1px solid #ecd49b;color:#6c5015;padding:12px;border-radius:10px;font-size:13px;line-height:1.7;margin-top:12px}.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.pending{background:#fff5d8;color:#8a6200}.approved{background:#e6f6ef;color:#176b5b}.rejected{background:#fff0ef;color:#b42318}.admin-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}.report{border-right:4px solid #c0392b}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:300;background:#172033;color:#fff;padding:13px 20px;border-radius:10px;max-width:92%;text-align:center}.toast.show{display:block}.success{text-align:center;padding:15px}.success-icon{font-size:54px}.footer{background:#14211f;color:#dfe8e5;text-align:center;padding:32px 20px;margin-top:30px}.footer a{color:#dfe8e5;margin:0 10px}@media(max-width:1050px){.search{grid-template-columns:1fr 1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{flex-direction:column;align-items:flex-start}.hero{min-height:550px}.hero h1{font-size:31px}.search{grid-template-columns:1fr}.cards,.grid2{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.gallery-main{height:240px}.gallery-side img{height:105p </style></head><body>
<header><a class="logo" href="#" onclick="home();return false">Kri<span>Dari</span></a><div id="nav" class="nav"></div></header>
<section class="hero"><div class="hero-content"><h1>🏠 لقّي دارك بسهولة</h1><p>منصة منظمة لكراء الشقق والعقارات في الجزائر</p><div class="search"><select id="sw"><option value="">كل الولايات</option></select><select id="st"><option value="">كل الأنواع</option></select><select id="sp"><option value="">كل أنواع الكراء</option><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select><input id="sprice" type="number" placeholder="أقصى سعر DA"><input id="stext" placeholder="المدينة أو العنوان"><button onclick="searchProperties()">🔎 بحث</button></div></div></section>
<main><div class="title-row"><h2>العقارات المتاحة</h2><span id="count" class="muted"></span></div><div id="cards" class="cards"></div></main>
<footer class="footer"><strong>KriDari</strong><br>منصة كراء العقارات في الجزائر<br><a href="#" onclick="showPrivacy();return false">الخصوصية والشروط</a><a href="#" onclick="showSafety();return false">السلامة والتبليغ</a>© 2026</footer>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://rvhqwpynhlgcscscybse.supabase.co';const SUPABASE_KEY='sb_publishable_HTJaBpq4c4JSyk5ybSOyNg_QS8tx3WE';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const ADMIN='rami.chemist11@gmail.com';let user=null,admin=false,current=[],regDraft={};const W=['الجزائر','وهران','قسنطينة','غليزان','عنابة','سطيف','مستغانم','تلمسان','الشلف','البليدة','بجاية','تيزي وزو','سيدي بلعباس'];const T=['F1','F2','F3','F4','F5','Villa','Studio','Duplex','Local commercial','Terrain'];const P={daily:'يومي',monthly:'شهري',yearly:'سنوي'};
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function toast(m){const x=document.getElementById('toast');x.textContent=m;x.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.remove('show'),3500)}function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function home(){scrollTo({top:0,behavior:'smooth'})}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
async function getUser(){const{data:{session}}=await sb.auth.getSession();user=session?.user||null;admin=false;if(user){try{const{data}=await sb.rpc('get_my_role');admin=data==='admin'}catch(e){}if(!admin)admin=(user.email||'').toLowerCase()===ADMIN;if(user.email_confirmed_at===null){await sb.auth.signOut();user=null;admin=false;openConfirmation(session.user.email)}}renderNav()}
sb.auth.onAuthStateChange((event,session)=>{user=session?.user||null;admin=false;if(user){sb.rpc('get_my_role').then(({data})=>{admin=data==='admin'||(user.email||'').toLowerCase()===ADMIN;renderNav()}).catch(()=>renderNav())}else renderNav();if(event==='SIGNED_IN')loadProperties()});
function renderNav(){const n=document.getElementById('nav');if(user){const name=user.user_metadata?.full_name||user.email?.split('@')[0]||'مستخدم';n.innerHTML=`<span class="user">مرحبًا <strong>${esc(name)}</strong></span><button onclick="openAddProperty()">+ أضف عقارك</button><button class="secondary" onclick="myProperties()">عقاراتي</button>${admin?'<button class="gold" onclick="openAdmin()">🛡️ لوحة التحكم</button>':''}<button class="secondary" onclick="logout()">خروج</button>`}else n.innerHTML='<button onclick="openAddProperty()">+ أضف عقارك</button><button class="secondary" onclick="openLogin()">تسجيل الدخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button>'}
function openLogin(msg=''){openModal(`<h2>🔐 تسجيل الدخول</h2>${msg?`<div class="warning">${esc(msg)}</div>`:''}<div class="form-group"><label>البريد الإلكتروني</label><input id="le" type="email" autocomplete="email"></div><div class="form-group"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"></div><div class="modal-actions"><button onclick="login()">دخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button></div><hr><button class="secondary" onclick="openResend()">📩 إعادة إرسال تأكيد البريد</button>`)}
async function login(){const email=le.value.trim(),password=lp.value;if(!email||!password)return toast('أدخل البريد وكلمة المرور');const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return openLogin(/not confirmed|confirm|verified/i.test(error.message)?'البريد الإلكتروني غير مؤكد. افتح رسالة التأكيد أو أعد إرسالها.':error.message);if(data.user?.email_confirmed_at===null){await sb.auth.signOut();return openConfirmation(email)}closeModal();toast('تم تسجيل الدخول بنجاح ✅')}
function openRegister(){const d=regDraft;openModal(`<h2>📝 إنشاء حساب</h2><div class="form-group"><label>الاسم الكامل *</label><input id="rn" value="${esc(d.name||'')}"></div><div class="form-group"><label>رقم الهاتف *</label><input id="rp" value="${esc(d.phone||'')}" type="tel"></div><div class="form-group"><label>البريد الإلكتروني *</label><input id="re" value="${esc(d.email||'')}" type="email"></div><div class="form-group"><label>كلمة المرور *</label><input id="rpass" type="password" minlength="6"></div><div class="check"><input id="privacy" type="checkbox" ${d.privacy?'checked':''}><label for="privacy">أوافق على <a href="#" onclick="privacyFromRegister();return false">شروط الاستخدام وسياسة الخصوصية</a>، وأقر بأن KriDari منصة عرض وربط وليست طرفًا في عقد الكراء، وأتحمل مسؤولية صحة ما أنشره وأبلغ عن المحتوى المشبوه.</label></div><div class="modal-actions"><button onclick="register()">إنشاء الحساب</button><button class="secondary" onclick="openLogin()">لدي حساب</button></div>`)}
function privacyFromRegister(){regDraft={name:rn.value,phone:rp.value,email:re.value,privacy:privacy.checked};showPrivacy(true)}
async function register(){const name=rn.value.trim(),phone=rp.value.trim(),email=re.value.trim(),password=rpass.value;if(!name||!phone||!email||!password)return toast('يرجى ملء جميع المعلومات');if(password.length<6)return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');if(!privacy.checked)return toast('يجب قبول شروط الاستخدام والخصوصية');const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/',data:{full_name:name,phone,privacy_accepted:true,privacy_accepted_at:new Date().toISOString(),terms_version:'1.0'}}});if(error)return toast(error.message);regDraft={};if(data.session){await sb.auth.signOut();return openConfirmation(email)}openConfirmation(email)}
function openConfirmation(email){openModal(`<div class="success"><div class="success-icon">📩</div><h2>تأكيد البريد الإلكتروني مطلوب</h2><p>أرسلنا رسالة تأكيد إلى:</p><strong>${esc(email)}</strong><p class="muted">لن يسمح لك KriDari بتسجيل الدخول قبل تأكيد البريد. تحقق أيضًا من Spam/Junk.</p><div class="warning">إذا لم تصل الرسالة، قد يكون مزود البريد الافتراضي في Supabase قد وصل إلى حد الإرسال. يمكنك إعادة المحاولة لاحقًا أو إعداد SMTP مخصص للمشروع.</div><div class="modal-actions"><button onclick="openResend('${esc(email)}')">📩 إعادة إرسال</button><button class="secondary" onclick="closeModal()">إغلاق</button></div></div>`)}
function openResend(email=''){openModal(`<h2>📩 إعادة إرسال تأكيد البريد</h2><div class="form-group"><label>البريد الإلكتروني</label><input id="resendEmail" type="email" value="${esc(email)}"></div><button onclick="resend()">إرسال رابط جديد</button>`)}async function resend(){const email=resendEmail.value.trim();if(!email)return toast('أدخل البريد الإلكتروني');const{error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+'/'}});if(error)return toast(error.message);openModal(`<div class="success"><div class="success-icon">✅</div><h2>تم طلب إرسال رسالة جديدة</h2><p class="muted">تحقق من Inbox وSpam/Junk. إذا لم تصل، فالمشكلة في تسليم البريد وليس في تسجيل الحساب.</p><button onclick="closeModal()">حسنًا</button></div>`)}async function logout(){await sb.auth.signOut();toast('تم تسجيل الخروج')}
function fillFilters(){sw.innerHTML='<option value="">كل الولايات</option>'+W.map(x=>`<option>${x}</option>`).join('');st.innerHTML='<option value="">كل الأنواع</option>'+T.map(x=>`<option>${x}</option>`).join('')}function imageURL(p){return p?sb.storage.from('property-images').getPublicUrl(p).data.publicUrl:''}
async function loadProperties(){const{data,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').eq('status','approved').order('created_at',{ascending:false});if(error){cards.innerHTML='<div class="empty">تعذر تحميل العقارات.</div>';return}current=data||[];render(current)}function render(list){count.textContent=`${list.length} عقار`;cards.innerHTML=list.length?list.map(p=>{const ims=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=ims.find(x=>x.is_main)||ims[0],img=m?imageURL(m.image_path):'';return `<article class="card"><div class="card-image">${img?`<img src="${img}" alt="${esc(p.title)}">`:'<div style="height:100%;display:grid;place-items:center;font-size:60px">🏠</div>'}<span class="badge">${P[p.rental_period]||'كراء'}${ims.length?' · 📷 '+ims.length:''}</span></div><div class="card-body"><div class="price">${Number(p.price||0).toLocaleString('fr-DZ')} DA</div><div class="period">${P[p.rental_period]||'شهري'}</div><h3>${esc(p.title)}</h3><p class="muted">📍 ${esc(p.city||'')}، ${esc(p.wilaya||'')}</p><div class="chips"><span class="chip">${esc(p.property_type)}</span><span class="chip">${p.rooms||1} غرف</span><span class="chip">${p.furnished?'مفروشة':'غير مفروشة'}</span></div><div class="actions"><button onclick="details('${p.id}')">التفاصيل</button><button class="secondary" onclick="favorite('${p.id}')">❤️</button></div></div></article>`}).join(''):'<div class="empty"><h3>لا توجد عقارات متاحة حاليًا</h3><p>كن أول من يضيف عقارًا.</p></div>'}function searchProperties(){const w=sw.value,t=st.value,period=sp.value,pr=Number(sprice.value),q=stext.value.trim().toLowerCase();render(current.filter(p=>(!w||p.wilaya===w)&&(!t||p.property_type===t)&&(!period||p.rental_period===period)&&(!pr||Number(p.price)<=pr)&&(!q||`${p.title} ${p.city||''} ${p.wilaya||''} ${p.address||''}`.toLowerCase().includes(q))))}
function openAddProperty(){if(!user)return openLogin('يجب إنشاء حساب وتأكيد البريد قبل إضافة عقار');window.files=[];openModal(`<h2>🏠 أضف عقارك</h2><div class="form-group"><label>عنوان الإعلان *</label><input id="pt"></div><div class="grid2"><div class="form-group"><label>الولاية *</label><select id="pw"><option value="">اختر</option>${W.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>المدينة / البلدية *</label><input id="pc"></div><div class="form-group"><label>نوع العقار *</label><select id="pty"><option value="">اختر</option>${T.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>عدد الغرف</label><input id="pro" type="number" min="1" value="1"></div><div class="form-group"><label>طبيعة الكراء *</label><select id="pper"><option value="">اختر</option><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select></div><div class="form-group"><label>السعر DA *</label><input id="ppr" type="number" min="1"></div></div><div class="form-group"><label>العنوان</label><input id="pa"></div><div class="form-group"><label>الهاتف *</label><input id="pp" type="tel" value="${esc(user.user_metadata?.phone||'')}"></div><div class="form-group"><label>الوصف</label><textarea id="pd"></textarea></div><div class="form-group"><label>الصور *</label><input id="pi" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="window.files=Array.from(this.files)"><p class="muted">حتى 10 صور، 5MB للصورة.</p></div><div class="warning">سيبقى الإعلان قيد المراجعة حتى موافقة الإدارة.</div><div class="modal-actions"><button onclick="publish()">🚀 إرسال للمراجعة</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
async function publish(){const fs=(window.files||[]).slice(0,10),title=pt.value.trim(),wilaya=pw.value,city=pc.value.trim(),type=pty.value,period=pper.value,price=Number(ppr.value),phone=pp.value.trim();if(!title||!wilaya||!city||!type||!period||!price||!phone)return toast('يرجى ملء المعلومات الأساسية');if(!fs.length)return toast('أضف صورة واحدة على الأقل');if(fs.some(f=>!f.type.startsWith('image/')||f.size>5*1024*1024))return toast('الصورة يجب أن تكون أقل من 5MB');const{data:p,error}=await sb.from('properties').insert({owner_id:user.id,title,description:pd.value.trim(),wilaya,city,address:pa.value.trim(),property_type:type,rooms:Number(pro.value)||1,price,rental_period:period,phone,status:'pending'}).select().single();if(error)return toast(error.message);for(let i=0;i<fs.length;i++){const f=fs[i],path=`${user.id}/${p.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,u=await sb.storage.from('property-images').upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type});if(!u.error)await sb.from('property_images').insert({property_id:p.id,image_path:path,is_main:i===0,sort_order:i})}openModal(`<div class="success"><div class="success-icon">✅</div><h2>تم إرسال الإعلان</h2><p class="muted">إعلانك قيد المراجعة.</p><button onclick="closeModal()">حسنًا</button></div>`)}
function details(id){const p=current.find(x=>x.id===id);if(!p)return;const ims=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=ims.find(x=>x.is_main)||ims[0],gallery=m?`<div class="gallery"><img class="gallery-main" src="${imageURL(m.image_path)}"><div class="gallery-side">${ims.filter(x=>x.id!==m.id).slice(0,4).map(x=>`<img src="${imageURL(x.image_path)}">`).join('')}</div></div>`:'';openModal(`<h2>${esc(p.title)}</h2>${gallery}<div class="info"><p>📍 ${esc(p.city||'')}، ${esc(p.wilaya||'')}</p><p>🏠 ${esc(p.property_type)} · 🚪 ${p.rooms||1} غرف</p><p>💰 <strong>${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${P[p.rental_period]||'شهري'}</strong></p><p>📝 ${esc(p.description||'لا يوجد وصف')}</p></div><div class="warning">KriDari منصة للعرض والربط وليست طرفًا في عقد الكراء. تحقق من العقار والمالك قبل الدفع.</div><div class="modal-actions"><button onclick="visit('${p.id}')">📅 طلب زيارة</button><button class="secondary" onclick="call('${esc(p.phone||'')}')">📞 الاتصال</button><button class="danger" onclick="report('${p.id}')">🚨 تبليغ</button></div>`)}function call(p){if(p)location.href='tel:'+p;else toast('الهاتف غير متوفر')}async function favorite(id){if(!user)return openLogin();const{data}=await sb.from('favorites').select('id').eq('user_id',user.id).eq('property_id',id).maybeSingle();if(data){await sb.from('favorites').delete().eq('id',data.id);toast('تم حذف المفضلة')}else{const{error}=await sb.from('favorites').insert({user_id:user.id,property_id:id});toast(error?'تعذر حفظ المفضلة':'تمت الإضافة ❤️')}}
function visit(id){if(!user)return openLogin();openModal(`<h2>📅 طلب زيارة</h2><input id="vd" type="date"><br><br><textarea id="vm" placeholder="رسالة للمالك"></textarea><br><button onclick="sendVisit('${id}')">إرسال الطلب</button>`)}async function sendVisit(id){if(!vd.value)return toast('اختر التاريخ');const{error}=await sb.from('visit_requests').insert({property_id:id,user_id:user.id,requested_date:vd.value,message:vm.value.trim(),status:'pending'});if(error)return toast(error.message);openModal(`<div class="success"><div class="success-icon">✅</div><h2>تم إرسال طلب الزيارة</h2><button onclick="closeModal()">حسنًا</button></div>`)}
function report(id){if(!user)return openLogin('يجب تسجيل الدخول والتأكد من البريد لإرسال بلاغ');openModal(`<h2>🚨 التبليغ عن إعلان</h2><p class="muted">سيصل البلاغ إلى الإدارة مع بيانات الإعلان. استخدمه فقط عند وجود سبب حقيقي.</p><div class="form-group"><label>السبب</label><select id="rr"><option value="fraud">اشتباه في احتيال</option><option value="illegal">محتوى غير قانوني</option><option value="misleading">معلومات مضللة</option><option value="harassment">إساءة أو مضايقة</option><option value="other">أخرى</option></select></div><textarea id="rd" placeholder="التفاصيل والأدلة المتوفرة"></textarea><br><button id="rb" onclick="sendReport('${id}')">🚨 إرسال البلاغ</button>`)}async function sendReport(id){rb.disabled=true;rb.textContent='جارٍ الإرسال...';const{data,error}=await sb.from('reports').insert({property_id:id,reporter_id:user.id,reason:rr.value,message:rd.value.trim(),details:rd.value.trim(),status:'pending'}).select('id').single();if(error){rb.disabled=false;rb.textContent='🚨 إرسال البلاغ';return toast(error.message)}openModal(`<div class="success"><div class="success-icon">🚨</div><h2>تم استلام الشكوى</h2><p>تم تسجيل البلاغ وإرساله للإدارة للمراجعة.</p><p class="muted">رقم البلاغ: ${esc(data.id)}</p><button onclick="closeModal()">حسنًا</button></div>`)}
async function myProperties(){if(!user)return openLogin();const{data,error}=await sb.from('properties').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return toast(error.message);openModal(`<h2>🏠 عقاراتي</h2>${data?.length?data.map(p=>`<div class="admin-row"><strong>${esc(p.title)}</strong><p>${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${P[p.rental_period]||'شهري'}</p><span class="status ${p.status}">${p.status==='pending'?'⏳ قيد المراجعة':p.status==='approved'?'✅ منشور':'❌ موقوف/مرفوض'}</span></div>`).join(''):'<div class="empty">لا توجد عقارات.</div>'}`)}
async function openAdmin(){if(!admin)return toast('غير مصرح');const{data:props,error:pe}=await sb.from('properties').select('*').order('created_at',{ascending:false});if(pe)return toast(pe.message);const{data:reports,error:re}=await sb.rpc('admin_get_reports');if(re)return toast(re.message);openModal(`<h2>🛡️ لوحة التحكم</h2><h3>الإعلانات</h3>${props?.map(p=>`<div class="admin-row"><strong>${esc(p.title)}</strong><p class="muted">${esc(p.city||'')}، ${esc(p.wilaya||'')} · ${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${P[p.rental_period]||'شهري'}</p><span class="status ${p.status}">${p.status==='pending'?'⏳ قيد المراجعة':p.status==='approved'?'✅ منشور':'❌ موقوف/مرفوض'}</span><div class="actions">${p.status!=='approved'?`<button onclick="moderate('${p.id}','approved')">✅ قبول</button>`:''}${p.status!=='rejected'?`<button class="danger" onclick="moderate('${p.id}','rejected')">⏹️ إيقاف</button>`:''}</div></div>`).join('')||'<p>لا توجد إعلانات.</p>'}<hr><h3>🚨 الشكاوى</h3>${reports?.map(r=>`<div class="admin-row report"><strong>${esc(r.reason)}</strong><p class="muted">${esc(r.message||r.details||'لا تفاصيل')}</p><span class="status ${r.status==='pending'?'pending':r.status==='dismissed'?'rejected':'approved'}">${esc(r.status)}</span><div class="info"><strong>المدعي</strong><p>${esc(r.reporter_name||'غير معروف')} · ${esc(r.reporter_email||'')} · ${esc(r.reporter_phone||'')}</p><div class="actions"><button class="secondary" onclick="contact('mailto:${esc(r.reporter_email||'')}')">✉️</button><button class="secondary" onclick="contact('tel:${esc(r.reporter_phone||'')}')">📞</button><button class="ok" onclick="contacted('${r.report_id}','complainant',${!r.complainant_contacted})">${r.complainant_contacted?'✓ تم التواصل':'تواصلت'}</button></div><strong>المدعى عليه</strong><p>${esc(r.owner_name||'غير معروف')} · ${esc(r.owner_email||'')} · ${esc(r.owner_phone||'')}</p><div class="actions"><button class="secondary" onclick="contact('mailto:${esc(r.owner_email||'')}')">✉️</button><button class="secondary" onclick="contact('tel:${esc(r.owner_phone||'')}')">📞</button><button class="ok" onclick="contacted('${r.report_id}','defendant',${!r.defendant_contacted})">${r.defendant_contacted?'✓ تم التواصل':'تواصلت'}</button></div></div><div class="actions"><button onclick="resolve('${r.report_id}','evidence')">📎 طلب إثبات</button><button class="ok" onclick="resolve('${r.report_id}','warning')">⚠️ تنبيه</button><button class="secondary" onclick="resolve('${r.report_id}','dismiss')">✓ رفض الشكوى</button><button class="danger" onclick="resolve('${r.report_id}','hide')">🗑️ إيقاف الإعلان</button></div></div>`).join('')||'<p>لا توجد شكاوى.</p>'}`)}function contact(url){if(url&&url.length>7)location.href=url;else toast('بيانات الاتصال غير متوفرة')}async function contacted(id,side,value){const{error}=await sb.rpc('admin_set_report_contact',{p_report_id:id,p_side:side,p_contacted:value});if(error)return toast(error.message);openAdmin()}async function resolve(id,decision){const labels={evidence:'طلب إثبات/دفاع',warning:'تنبيه',dismiss:'رفض الشكوى',hide:'إيقاف الإعلان'};const note=prompt('قرار: '+labels[decision]+'\nملاحظة الإدارة (اختياري):','');if(note===null)return;const{error}=await sb.rpc('admin_resolve_report',{p_report_id:id,p_decision:decision,p_note:note||null});if(error)return toast(error.message);toast('تم حفظ قرار الإدارة');openAdmin();loadProperties()}async function moderate(id,status){if(!admin)return toast('غير مصرح');const{error}=await sb.from('properties').update({status}).eq('id',id);if(error)return toast(error.message);openAdmin();loadProperties()}
function showPrivacy(back=false){openModal(`<h2>🔐 الخصوصية وشروط الاستخدام</h2><p class="muted">تُستخدم بيانات الحساب والإعلانات وطلبات الزيارة لتشغيل KriDari. يجب تقديم معلومات صحيحة وعدم نشر الاحتيال أو المحتوى غير القانوني أو المسيء.</p><p class="muted">KriDari منصة تقنية للعرض والربط وليست طرفًا في عقد الكراء ولا تضمن هوية المستخدم أو صحة الإعلان. المستخدم مسؤول عن التحقق قبل الدفع أو التعاقد.</p><p class="muted">يمكن التبليغ عن المحتوى المشبوه، وتراجع الإدارة البلاغات وتتخذ الإجراء المناسب. قد تطلب الإدارة إثباتات أو توقف الإعلان عند الحاجة.</p><p class="muted">الموافقة على الشروط مطلوبة لإنشاء الحساب.</p>${back?'<button class="secondary" onclick="openRegister()">↩ العودة إلى التسجيل</button>':''}`)}function showSafety(){openModal(`<h2>🛡️ السلامة والتبليغ</h2><p class="muted">لا تدفع قبل التحقق من العقار والمالك. لا تشارك كلمات المرور أو رموز التأكيد. عند الاشتباه استخدم زر 🚨 تبليغ.</p>`)}
fillFilters();getUser();loadProperties();
</script></body></html>
