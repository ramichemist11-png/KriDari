(--muted);font-size:14px;line-height:1.75}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 10px 35px #123f3818}.card-image{height:210px;background:linear-gradient(135deg,#dce9e5,#efd7a8)}.card-image img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:11px;right:11px;background:#fffffff5;color:var(--g);padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}.card-body{padding:17px}.price{font-size:21px;font-weight:900;color:var(--g)}.period{font-size:12px;color:var(--gold);font-weight:bold}.card h3{margin:8px 0;font-size:19px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#f0f4f2;color:#38534c;padding:5px 9px;border-radius:20px;font-size:12px}.actions,.modal-actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}.empty{background:#fff;border:1px solid var(--line);padding:45px;text-align:center;border-radius:15px}.modal{display:none;position:fixed;inset:0;background:#0000008c;z-index:1000;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;width:min(950px,100%);max-height:93vh;overflow:auto;border-radius:20px;padding:25px;position:relative}.close{position:absolute;left:14px;top:13px;width:42px;height:42px;padding:0;border-radius:50%;background:#f0f2f1;color:#333;font-size:24px}.box h2{color:var(--g);margin:0 45px 20px 0}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:800;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions>*{flex:1}.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:16px}.gallery-main{width:100%;height:320px;object-fit:cover;border-radius:12px}.gallery-side{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gallery-side img{width:100%;height:156px;object-fit:cover;border-radius:9px}.info,.admin-row{background:#f8faf9;border:1px solid var(--line);padding:15px;border-radius:13px;margin-top:10px}.warning{background:#fff8e8;border:1px solid #ecd49b;color:#6c5015;padding:12px;border-radius:10px;font-size:13px;line-height:1.7;margin-top:12px}.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.pending{background:#fff5d8;color:#8a6200}.approved{background:#e6f6ef;color:#176b5b}.rejected{background:#fff0ef;color:#b42318}.hidden,.suspended{background:#edf0f0;color:#53615c}.report{border-right:4px solid #c0392b}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:3000;background:#172033;color:#fff;padding:13px 20px;border-radius:10px;max-width:92%;text-align:center}.toast.show{display:block}.success{text-align:center;padding:15px}.success-icon{font-size:54px}.notice{background:#eef7f4;border:1px solid #c8e3da;padding:13px;border-radius:12px;margin:10px 0}.footer{background:#14211f;color:#dfe8e5;text-align:center;padding:32px 20px;margin-top:30px}.footer a{color:#dfe8e5;margin:0 10px}@media(max-width:1050px){.search{grid-template-columns:1fr 1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{flex-direction:column;align-items:stretch}.nav{justify-content:center}.nav button{flex:1}.hero{min-height:550px}.hero h1{font-size:31px}.search{grid-template-columns:1fr}.cards,.grid2{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.gallery-main{height:240px}.gallery-side img{height:105px}.modal-actions{flex-direction:column}}

<body>
<header><a class="logo" href="#" data-action="home">Kri<span>Dari</span></a><div id="nav" class="nav"></div></header>

<script>
'use strict';
const SUPABASE_URL='https://rvhqwpynhlgcscscybse.supabase.co',SUPABASE_KEY='sb_publishable_HTJaBpq4c4JSyk5ybSOyNg_QS8tx3WE';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),ADMIN='rami.chemist11@gmail.com';let user=null,admin=false,current=[];
const W=['الجزائر','وهران','قسنطينة','غليزان','عنابة','سطيف','مستغانم','تلمسان','الشلف','البليدة','بجاية','تيزي وزو','سيدي بلعباس'];const T=['F1','F2','F3','F4','F5','Villa','Studio','Duplex','Local commercial','Terrain'];const P={daily:'يومي',monthly:'شهري',yearly:'سنوي'};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
function toast(m){const x=$('toast');x.textContent=m;x.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.remove('show'),3500)}function openModal(h){$('modalContent').innerHTML=h;$('modal').classList.add('show');document.body.style.overflow='hidden'}function closeModal(){$('modal').classList.remove('show');document.body.style.overflow=''}function home(){scrollTo({top:0,behavior:'smooth'})}
function statusLabel(s){return s==='approved'?'تم قبول ونشر المنشور':s==='pending'?'قيد المراجعة':s==='rejected'?'تم رفض المنشور':s==='hidden'?'تم إخفاء المنشور':s==='deleted'?'تم حذف المنشور':s==='suspended'?'تم توقيف المنشور':s}
function renderNav(){const n=$('nav');if(user){const name=user.user_metadata?.full_name||user.email?.split('@')[0]||'مستخدم';n.innerHTML=`<span class="user">مرحبًا <strong>${esc(name)}</strong></span><button type="button" data-action="openAddProperty">+ أضف عقارك</button><button type="button" class="secondary" data-action="myProperties">عقاراتي</button>${admin?'<button type="button" class="gold" data-action="openAdmin">🛡️ لوحة التحكم</button>':''}<button type="button" class="secondary" data-action="logout">خروج</button>`}else n.innerHTML='<button type="button" data-action="openAddProperty">+ أضف عقارك</button><button type="button" class="secondary" data-action="openLogin">تسجيل الدخول</button><button type="button" class="secondary" data-action="openRegister">إنشاء حساب</button>'}
function openLogin(msg=''){openModal(`<h2>🔐 تسجيل الدخول</h2>${msg?`<div class="warning">${esc(msg)}</div>`:''}<div class="form-group"><label>البريد الإلكتروني</label><input id="le" type="email"></div><div class="form-group"><label>كلمة المرور</label><input id="lp" type="password"></div><div class="modal-actions"><button type="button" data-action="login">دخول</button><button type="button" class="secondary" data-action="openRegister">إنشاء حساب</button></div><hr><button type="button" class="secondary" data-action="openResend">📩 إعادة إرسال تأكيد البريد</button>`)}
async function login(){const email=$('le')?.value.trim(),password=$('lp')?.value;if(!email||!password)return toast('أدخل البريد وكلمة المرور');const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return openLogin(/not confirmed|confirm|verified/i.test(error.message)?'البريد الإلكتروني غير مؤكد. افتح رسالة التأكيد أو أعد إرسالها.':error.message);if(!data.user?.email_confirmed_at){await sb.auth.signOut();return openConfirmation(email)}closeModal();toast('تم تسجيل الدخول بنجاح ✅');loadProperties()}
function openRegister(){openModal(`<h2>📝 إنشاء حساب</h2><div class="form-group"><label>الاسم الكامل *</label><input id="rn"></div><div class="form-group"><label>رقم الهاتف *</label><input id="rp" type="tel"></div><div class="form-group"><label>البريد الإلكتروني *</label><input id="re" type="email"></div><div class="form-group"><label>كلمة المرور *</label><input id="rpass" type="password" minlength="6"></div><div class="check"><input id="privacy" type="checkbox"><label for="privacy">أوافق على شروط الاستخدام وسياسة الخصوصية.</label></div><div class="modal-actions"><button type="button" data-action="register">إنشاء الحساب</button><button type="button" class="secondary" data-action="openLogin">لدي حساب</button></div>`)}
async function register(){const name=$('rn')?.value.trim(),phone=$('rp')?.value.trim(),email=$('re')?.value.trim(),password=$('rpass')?.value;if(!name||!phone||!email||!password)return toast('يرجى ملء جميع المعلومات');if(password.length<6)return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');if(!$('privacy')?.checked)return toast('يجب الموافقة على الخصوصية');const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:name,phone,privacy_accepted:true,privacy_accepted_at:new Date().toISOString(),terms_version:'2026-08'}}});if(error)return toast(error.message);if(data.user&&!data.session)return openConfirmation(email);closeModal();toast('تم إنشاء الحساب بنجاح 🎉')}
function openConfirmation(email){openModal(`<div class="success"><div class="success-icon">📩</div><h2>تأكيد البريد الإلكتروني</h2><p>تم إنشاء الحساب للبريد:</p><strong>${esc(email)}</strong><p class="muted">لن يتم السماح بالدخول قبل تأكيد البريد الإلكتروني.</p><button type="button" data-action="openResend" data-email="${esc(email)}">إعادة إرسال رسالة التأكيد</button></div>`)}function openResend(email=''){openModal(`<h2>📩 إعادة إرسال تأكيد البريد</h2><input id="resendEmail" type="email" value="${esc(email)}"><button type="button" data-action="resend">إرسال</button>`)}async function resendConfirmation(){const email=$('resendEmail')?.value.trim();if(!email)return toast('أدخل البريد');const{error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return toast(error.message);toast('تم طلب إرسال رسالة التأكيد. افحص البريد وSpam 📩')}
async function logout(){await sb.auth.signOut();closeModal();toast('تم تسجيل الخروج')}
async function getUser(){const{data:{session}}=await sb.auth.getSession();user=session?.user||null;admin=false;if(user){try{const r=await sb.rpc('get_my_role');admin=r.data==='admin'}catch(e){}if(!admin)admin=(user.email||'').toLowerCase()===ADMIN;if(!user.email_confirmed_at){const email=user.email;await sb.auth.signOut();user=null;openConfirmation(email)}}renderNav()}
sb.auth.onAuthStateChange((event,session)=>{user=session?.user||null;if(!user)admin=false;renderNav()});
async function loadProperties(){const{data,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').eq('status','approved').order('created_at',{ascending:false});if(error){console.error(error);return toast('تعذر تحميل العقارات')}current=data||[];renderProperties(current)}function imageURL(path){return path?sb.storage.from('property-images').getPublicUrl(path).data.publicUrl:''}
function renderProperties(list){$('count').textContent=`${list.length} عقار`;$('cards').innerHTML=list.length?list.map(p=>{const imgs=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=imgs.find(x=>x.is_main)||imgs[0],img=m?imageURL(m.image_path):'';return `<article class="card"><div class="card-image" style="position:relative">${img?`<img src="${img}" alt="${esc(p.title)}">`:'<div style="height:100%;display:grid;place-items:center;font-size:60px">🏠</div>'}<span class="badge">${esc(P[p.rental_period]||'شهري')}</span></div><div class="card-body"><div class="price">${Number(p.price||0).toLocaleString('fr-DZ')} DA <span class="period">/ ${esc(P[p.rental_period]||'شهري')}</span></div><h3>${esc(p.title)}</h3><p class="muted">📍 ${esc(p.city||'')}، ${esc(p.wilaya||'')}</p><div class="chips"><span class="chip">${esc(p.property_type||'')}</span><span class="chip">${p.rooms||1} غرف</span>${p.furnished?'<span class="chip">مفروشة</span>':''}</div><div class="actions"><button type="button" data-action="details" data-id="${p.id}">التفاصيل</button><button type="button" class="secondary" data-action="favorite" data-id="${p.id}">❤️</button></div></div></article>`}).join(''):'<div class="empty"><h3>لا توجد عقارات متاحة حاليًا</h3></div>'}
function searchProperties(){const w=$('sw').value,t=$('st').value,period=$('sp').value,price=Number($('sprice').value),text=$('stext').value.trim().toLowerCase();renderProperties(current.filter(p=>(!w||p.wilaya===w)&&(!t||p.property_type===t)&&(!period||p.rental_period===period)&&(!price||Number(p.price)<=price)&&(!text||`${p.title} ${p.city||''} ${p.wilaya||''} ${p.address||''}`.toLowerCase().includes(text))))}
function fillFilters(){$('sw').innerHTML='<option value="">كل الولايات</option>'+W.map(x=>`<option>${x}</option>`).join('');$('st').innerHTML='<option value="">كل الأنواع</option>'+T.map(x=>`<option>${x}</option>`).join('')}
function openAddProperty(){if(!user)return openLogin('يجب تسجيل الدخول قبل إضافة عقارك.');openModal(`<h2>🏠 إضافة عقار</h2><div class="form-group"><label>عنوان الإعلان *</label><input id="pt"></div><div class="grid2"><div class="form-group"><label>الولاية *</label><select id="pw"><option value="">اختر</option>${W.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>المدينة / البلدية *</label><input id="pc"></div><div class="form-group"><label>نوع العقار *</label><select id="ptype"><option value="">اختر</option>${T.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>عدد الغرف</label><input id="prooms" type="number" min="1" value="1"></div><div class="form-group"><label>نوع الكراء *</label><select id="pper"><option value="monthly">شهري</option><option value="daily">يومي</option><option value="yearly">سنوي</option></select></div><div class="form-group"><label>السعر DA *</label><input id="pprice" type="number" min="1"></div></div><div class="form-group"><label>العنوان</label><input id="paddr"></div><div class="form-group"><label>رقم الهاتف *</label><input id="pphone" type="tel" value="${esc(user.user_metadata?.phone||'')}"></div><div class="form-group"><label>الوصف</label><textarea id="pdesc"></textarea></div><div class="form-group"><label>الصور *</label><input id="pfiles" type="file" accept="image/jpeg,image/png,image/webp" multiple></div><div class="modal-actions"><button type="button" data-action="publishProperty">🚀 إرسال للمراجعة</button><button type="button" class="secondary" data-action="close">إلغاء</button></div>`)}
async function publishProperty(){const title=$('pt').value.trim(),wilaya=$('pw').value,city=$('pc').value.trim(),type=$('ptype').value,rooms=Number($('prooms').value)||1,period=$('pper').value,price=Number($('pprice').value),address=$('paddr').value.trim(),phone=$('pphone').value.trim(),description=$('pdesc').value.trim(),files=Array.from($('pfiles').files||[]);if(!title||!wilaya||!city||!type||!price||!phone)return toast('أكمل المعلومات الأساسية');if(!files.length)return toast('أضف صورة واحدة على الأقل');if(files.length>10||files.some(f=>f.size>5*1024*1024||!/^image\/(jpeg|png|webp)$/.test(f.type)))return toast('الصور: حتى 10 صور، وكل صورة أقل من 5MB');const{data:p,error}=await sb.from('properties').insert({owner_id:user.id,title,description,wilaya,city,address,property_type:type,rooms,price,rental_period:period,phone,status:'pending'}).select().single();if(error)return toast(error.message);for(let i=0;i<files.length;i++){const f=files[i],path=`${user.id}/${p.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,up=await sb.storage.from('property-images').upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type});if(up.error)return toast('تعذر رفع إحدى الصور');const r=await sb.from('property_images').insert({property_id:p.id,image_path:path,is_main:i===0,sort_order:i});if(r.error)return toast(r.message)}closeModal();toast('تم إرسال العقار للمراجعة ✅');loadProperties()}
function showDetails(id){const p=current.find(x=>x.id===id);if(!p)return;const imgs=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=imgs.find(x=>x.is_main)||imgs[0];const phone=String(p.phone||'').trim();openModal(`<h2>${esc(p.title)}</h2>${m?`<div class="gallery"><img class="gallery-main" src="${imageURL(m.image_path)}"><div class="gallery-side">${imgs.filter(x=>x.id!==m.id).slice(0,4).map(x=>`<img src="${imageURL(x.image_path)}">`).join('')}</div></div>`:''}<div class="info"><p>📍 ${esc(p.city||'')}، ${esc(p.wilaya||'')}</p><p>🏠 ${esc(p.property_type||'')} · ${p.rooms||1} غرف</p><p>💰 <strong>${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${esc(P[p.rental_period]||'شهري')}</strong></p><p>📝 ${esc(p.description||'لا يوجد وصف')}</p></div><div class="modal-actions">${phone?`<button type="button" data-action="call" data-phone="${esc(phone)}">📞 اتصال</button><button type="button" class="secondary" data-action="whatsapp" data-phone="${esc(phone)}">💬 WhatsApp</button>`:''}<button type="button" data-action="visit" data-id="${p.id}">📅 طلب زيارة</button><button type="button" class="danger" data-action="report" data-id="${p.id}">🚨 تبليغ</button></div>`)}
function requestVisit(id){if(!user)return openLogin('سجل الدخول أولًا لإرسال طلب زيارة.');openModal(`<h2>📅 طلب زيارة</h2><input id="vd" type="date"><textarea id="vm" placeholder="رسالة للمالك"></textarea><button type="button" data-action="sendVisit" data-id="${id}">إرسال الطلب</button>`)}async function sendVisit(id){if(!$('vd').value)return toast('اختر تاريخًا');const{error}=await sb.from('visit_requests').insert({property_id:id,user_id:user.id,requested_date:$('vd').value,message:$('vm').value.trim(),status:'pending'});if(error)return toast(error.message);openModal('<div class="success"><div class="success-icon">✅</div><h2>تم إرسال طلب الزيارة</h2><p>تم تسجيل طلبك بنجاح.</p><button data-action="close">حسنًا</button></div>')}
async function favorite(id){if(!user)return openLogin('سجل الدخول لإضافة المفضلة.');const{data,error}=await sb.from('favorites').select('id').eq('user_id',user.id).eq('property_id',id).maybeSingle();if(error)return toast(error.message);if(data)await sb.from('favorites').delete().eq('id',data.id);else await sb.from('favorites').insert({user_id:user.id,property_id:id});toast(data?'تم حذف العقار من المفضلة':'تمت إضافة العقار للمفضلة ❤️')}
function reportProperty(id){if(!user)return openLogin('سجل الدخول أولًا لإرسال بلاغ.');openModal(`<h2>🚨 التبليغ عن مشكلة</h2><p class="muted">اختر السبب واكتب التفاصيل.</p><select id="rr"><option value="suspected_scam">احتيال / نشاط مشبوه</option><option value="fake">إعلان وهمي</option><option value="inappropriate">محتوى غير مناسب</option><option value="duplicate">إعلان مكرر</option><option value="other">أخرى</option></select><textarea id="rd" placeholder="التفاصيل"></textarea><button type="button" data-action="sendReport" data-id="${id}">إرسال البلاغ</button>`)}
async function sendReport(id){const{data,error}=await sb.from('reports').insert({property_id:id,reporter_id:user.id,reason:$('rr').value,details:$('rd').value.trim(),message:$('rd').value.trim(),status:'pending'}).select('id').single();if(error)return toast(error.message);try{const{data:p}=await sb.from('properties').select('owner_id').eq('id',id).single();if(p?.owner_id)await sb.from('notifications').insert({user_id:p.owner_id,title:'تم تقديم بلاغ بشأن إعلانك',message:'تم تقديم شكوى بشأن إعلانك. يرجى متابعة التنبيهات وتقديم ما يثبت صحة الإعلان عند طلب الإدارة.',type:'report'})}catch(e){console.warn('notification insert unavailable',e)}openModal(`<div class="success"><div class="success-icon">✅</div><h2>تم تقديم الشكوى</h2><p>تم تسجيل الشكوى بنجاح، وسيتم إشعار الأطراف المعنية عند اتخاذ أي إجراء.</p><p class="muted">رقم الشكوى: <strong>${esc(data.id)}</strong></p><button type="button" data-action="close">حسنًا</button></div>`)}
function callOwner(phone){if(phone)location.href='tel:'+phone;else toast('رقم الهاتف غير متوفر')}function whatsapp(phone){const p=String(phone||'').replace(/\D/g,'');if(p)location.href='https://wa.me/'+(p.startsWith('0')?'213'+p.slice(1):p);else toast('رقم الهاتف غير متوفر')}
async function myProperties(){if(!user)return openLogin();const{data,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return toast(error.message);openModal(`<h2>🏠 عقاراتي</h2>${(data||[]).map(p=>`<div class="admin-row"><strong>${esc(p.title)}</strong><p>${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${esc(P[p.rental_period]||'')}</p><span class="status ${esc(p.status)}">${esc(statusLabel(p.status))}</span>${p.status==='approved'?'<div class="notice">✅ تم قبول ونشر هذا المنشور تلقائيًا.</div>':''}${p.status==='pending'?'<div class="notice">⏳ المنشور قيد المراجعة.</div>':''}${p.status==='rejected'?'<div class="warning">❌ تم رفض المنشور.</div>':''}</div>`).join('')||'<div class="empty">لا توجد عقارات</div>')}`)}
function showPrivacy(){openModal('<h2>🔐 الخصوصية وشروط الاستخدام</h2><p class="muted">تُستخدم بيانات الحساب والإعلانات وطلبات الزيارة لتشغيل KriDari. يجب تقديم معلومات صحيحة وعدم نشر الاحتيال أو المحتوى غير القانوني.</p><p class="muted">KriDari منصة تقنية للعرض والربط وليست طرفًا في عقد الكراء. المستخدم مسؤول عن التحقق قبل الدفع أو التعاقد.</p>')}function showSafety(){openModal('<h2>🛡️ السلامة والتبليغ</h2><p class="muted">لا تدفع قبل التحقق من العقار والمالك. عند الاشتباه استخدم زر 🚨 تبليغ.</p>')}
async function openAdmin(){if(!admin)return toast('غير مصرح');const{data:props,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').order('created_at',{ascending:false});if(error)return toast(error.message);const{data:reports,error:re}=await sb.rpc('admin_get_reports');if(re)return toast(re.message);window.__adminReports=reports||[];window.__adminProps=props||[];openModal(`<h2>🛡️ لوحة التحكم</h2><div class="modal-actions"><button data-action="adminProps">🏠 العقارات</button><button data-action="adminReports" class="gold">🚨 البلاغات (${(reports||[]).filter(x=>x.status==='pending').length})</button></div><div id="adminBody"></div>`);renderAdminProps(window.__adminProps)}
function renderAdminProps(props){$('adminBody').innerHTML=(props||[]).map(p=>`<div class="admin-row"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(p.title)}</strong><span class="status ${esc(p.status)}">${esc(statusLabel(p.status))}</span></div><p class="muted">${esc(p.city||'')}، ${esc(p.wilaya||'')} · ${Number(p.price||0).toLocaleString('fr-DZ')} DA</p>${p.status==='approved'?'<div class="notice">✅ تم قبول ونشر المنشور. لن تظهر إجراءات القبول مرة أخرى.</div>':''}<div class="modal-actions">${p.status!=='approved'?'<button data-action="adminApprove" data-id="'+p.id+'">✅ قبول ونشر</button>':''}${p.status!=='hidden'&&p.status!=='deleted'?'<button class="secondary" data-action="adminHide" data-id="'+p.id+'">👁️ إخفاء</button>':''}${p.status!=='deleted'?'<button class="danger" data-action="adminDelete" data-id="'+p.id+'">🗑️ حذف</button>':''}${['hidden','suspended'].includes(p.status)?'<button class="ok" data-action="adminRestore" data-id="'+p.id+'">♻️ استرجاع</button>':''}</div></div>`).join('')||'<div class="empty">لا توجد عقارات</div>'}
function renderAdminReports(reports){$('adminBody').innerHTML=(reports||[]).map(r=>{const st=r.status||'pending';return `<div class="admin-row report"><strong>🚨 ${esc(r.property_title||'إعلان')}</strong><p>الحالة: <span class="status ${esc(st)}">${esc(reportStatus(st))}</span></p><p class="muted"><strong>المدعي:</strong> ${esc(r.reporter_name||'غير معروف')} · ${esc(r.reporter_email||'')} · ${esc(r.reporter_phone||'')}</p><p class="muted"><strong>المدعى عليه:</strong> ${esc(r.owner_name||'غير معروف')} · ${esc(r.owner_email||'')} · ${esc(r.owner_phone||'')}</p><p>${esc(r.reason||'')} — ${esc(r.details||r.message||'')}</p>${st==='pending'?`<div class="modal-actions"><button class="gold" data-action="resolveReport" data-id="${r.report_id}" data-decision="evidence">📄 طلب إثبات</button><button class="secondary" data-action="resolveReport" data-id="${r.report_id}" data-decision="dismiss">❌ رفض الشكوى</button><button class="danger" data-action="resolveReport" data-id="${r.report_id}" data-decision="hide">⛔ إخفاء الإعلان</button><button class="danger" data-action="resolveReport" data-id="${r.report_id}" data-decision="delete">🗑️ حذف الإعلان</button></div>`:st==='evidence'?'<div class="notice">⏳ تم طلب الإثبات — في انتظار التأكيد. تم إشعار صاحب الإعلان بضرورة تقديم ما يثبت صحة الإعلان أو براءته.</div>':'<div class="notice">✅ تم تنفيذ الإجراء: '+esc(reportStatus(st))+'</div>'}</div>`}).join('')||'<div class="empty">لا توجد بلاغات</div>'}
function reportStatus(s){return s==='pending'?'قيد المراجعة':s==='evidence'?'في انتظار التأكيد':s==='dismissed'?'تم رفض الشكوى':s==='hidden'?'تم إخفاء الإعلان':s==='deleted'?'تم حذف الإعلان':s==='resolved'?'تمت المعالجة':s}
async function notifyOwner(propertyId,title,message){try{const{data:p}=await sb.from('properties').select('owner_id').eq('id',propertyId).single();if(p?.owner_id)await sb.from('notifications').insert({user_id:p.owner_id,title,message,type:'report'})}catch(e){console.warn('notification insert unavailable',e)}}
async function resolveReport(id,decision){const note=decision==='evidence'?'يرجى تقديم ما يثبت صحة الإعلان أو براءتك.':decision==='dismiss'?'تم رفض الشكوى.':decision==='hide'?'تم إخفاء الإعلان بسبب الشكوى.':'تم حذف الإعلان بسبب الشكوى.';const{error}=await sb.rpc('admin_resolve_report',{p_report_id:id,p_decision:decision,p_note:note});if(error)return toast(error.message);const r=(window.__adminReports||[]).find(x=>String(x.report_id)===String(id));if(r)await notifyOwner(r.property_id,r.property_title,note);openModal('<div class="success"><div class="success-icon">'+(decision==='evidence'?'📄':'✅')+'</div><h2>'+esc(decision==='evidence'?'في انتظار التأكيد':'تم تنفيذ الإجراء')+'</h2><p>'+esc(note)+'</p><button data-action="adminReports">العودة إلى البلاغات</button></div>');await refreshAdminReports()}
async function refreshAdminReports(){const{data}=await sb.rpc('admin_get_reports');window.__adminReports=data||[]}
async function adminApprove(id){const{error}=await sb.rpc('admin_set_property_status',{p_property_id:id,p_status:'approved',p_reason:'تمت الموافقة من الإدارة'});if(error)return toast(error.message);toast('تم قبول ونشر المنشور تلقائيًا ✅');await openAdmin();loadProperties()}async function adminHide(id){const reason=prompt('سبب الإخفاء:','مراجعة إدارية');if(reason===null)return;const{error}=await sb.rpc('admin_hide_property',{p_property_id:id,p_reason:reason});if(error)return toast(error.message);toast('تم إخفاء المنشور');openAdmin();loadProperties()}async function adminDelete(id){if(!confirm('هل أنت متأكد من حذف الإعلان؟'))return;const reason=prompt('سبب الحذف:','قرار إداري');if(reason===null)return;const{error}=await sb.rpc('admin_delete_property',{p_property_id:id,p_reason:reason});if(error)return toast(error.message);toast('تم حذف المنشور');openAdmin();loadProperties()}async function adminRestore(id){const reason=prompt('سبب الاسترجاع:','تمت المراجعة');if(reason===null)return;const{error}=await sb.rpc('admin_restore_property',{p_property_id:id,p_reason:reason});if(error)return toast(error.message);toast('تم استرجاع المنشور');openAdmin();loadProperties()}
const handlers={home,close:closeModal,openLogin,openRegister,openAddProperty,login,register,openResend,resend:resendConfirmation,logout,myProperties,openAdmin,search:searchProperties,publishProperty,sendVisit,sendReport,showPrivacy,showSafety,adminProps:()=>renderAdminProps(window.__adminProps||[]),adminReports:async()=>{await refreshAdminReports();renderAdminReports(window.__adminReports)},adminApprove,adminHide,adminDelete,adminRestore,resolveReport};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const a=el.dataset.action;if(a==='details')return showDetails(el.dataset.id);if(a==='favorite')return favorite(el.dataset.id);if(a==='visit')return requestVisit(el.dataset.id);if(a==='report')return reportProperty(el.dataset.id);if(a==='call')return callOwner(el.dataset.phone);if(a==='whatsapp')return whatsapp(el.dataset.phone);if(a==='sendVisit')return sendVisit(el.dataset.id);if(a==='sendReport')return sendReport(el.dataset.id);if(a==='resolveReport')return resolveReport(el.dataset.id,el.dataset.decision);const fn=handlers[a];if(fn)await fn()});
window.addEventListener('error',e=>{console.error(e.error||e.message);toast('حدث خطأ غير متوقع')});fillFilters();renderNav();getUser();loadProperties();
</script></body></html>
