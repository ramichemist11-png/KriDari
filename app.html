<style>
:root{--g:#123f38;--g2:#176b5b;--gold:#c99a3d;--bg:#f5f6f4;--text:#18211f;--muted:#69736f;--line:#dfe6e2;--danger:#b42318;--ok:#147a57;--shadow:0 10px 35px rgba(18,63,56,.1)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 16px;background:var(--g2);color:#fff;font-weight:700;cursor:pointer}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#edf3f0!important;color:var(--g)!important}.gold{background:var(--gold)!important}.danger{background:#fff0ee!important;color:var(--danger)!important}.ok{background:#e8f7f0!important;color:var(--ok)!important}header{position:sticky;top:0;z-index:50;background:#fffffff5;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:30px;font-weight:900;color:var(--g);text-decoration:none}.logo span{color:var(--gold)}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.user{font-size:13px;color:#46524f}.hero{min-height:500px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:60px 5%;background:linear-gradient(115deg,#092e28f0,#176b5bd1),url("https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Martyrs_Memorial_Algiers.jpg/1280px-Martyrs_Memorial_Algiers.jpg") center/cover no-repeat}.hero-content{width:min(1100px,100%)}.hero h1{font-size:44px;margin:0 0 12px}.hero p{font-size:18px;margin:0 0 28px}.search{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.4fr auto;gap:8px;background:#fffffff7;padding:14px;border-radius:18px;box-shadow:0 20px 55px #0004;color:var(--text)}input,select,textarea{width:100%;padding:12px;border:1px solid #d5ded9;border-radius:10px;outline:0;background:#fff}textarea{min-height:105px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px #176b5b1a}main{max-width:1180px;margin:auto;padding:38px 5%}.title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.title-row h2{margin:0;font-size:29px}.muted{color:var(--muted);font-size:14px;line-height:1.75}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.card-image{height:210px;position:relative;background:linear-gradient(135deg,#dce9e5,#efd7a8)}.card-image img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:11px;right:11px;background:#fffffff5;color:var(--g);padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}.card-body{padding:17px}.price{font-size:21px;font-weight:900;color:var(--g)}.period{font-size:12px;color:var(--gold);font-weight:bold}.card h3{margin:8px 0;font-size:19px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#f0f4f2;color:#38534c;padding:5px 9px;border-radius:20px;font-size:12px}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}.empty{background:#fff;border:1px solid var(--line);padding:45px;text-align:center;border-radius:15px}.modal{display:none;position:fixed;inset:0;background:#0000008c;z-index:100;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;width:min(950px,100%);max-height:93vh;overflow:auto;border-radius:20px;padding:25px;position:relative}.close{position:absolute;left:14px;top:13px;width:40px;height:40px;padding:0;border-radius:50%;background:#f0f2f1;color:#333;font-size:24px}.box h2{color:var(--g);margin:0 45px 20px 0}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:800;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.check{display:flex;gap:8px;align-items:flex-start;background:#f5f8f6;border:1px solid var(--line);padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.check input{width:auto;margin-top:4px}.check a{color:var(--g2);text-decoration:underline}.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:16px}.gallery-main{width:100%;height:320px;object-fit:cover;border-radius:12px}.gallery-side{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gallery-side img{width:100%;height:156px;object-fit:cover;border-radius:9px}.info{background:#f8faf9;border:1px solid var(--line);padding:15px;border-radius:13px;margin-top:15px}.warning{background:#fff8e8;border:1px solid #ecd49b;color:#6c5015;padding:12px;border-radius:10px;font-size:13px;line-height:1.7;margin-top:12px}.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.pending{background:#fff5d8;color:#8a6200}.approved{background:#e6f6ef;color:#176b5b}.rejected{background:#fff0ef;color:#b42318}.hidden{background:#edf0f0;color:#53615c}.admin-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}.report{border-right:4px solid #c0392b}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:300;background:#172033;color:#fff;padding:13px 20px;border-radius:10px;max-width:92%;text-align:center}.toast.show{display:block}.success{text-align:center;padding:15px}.success-icon{font-size:54px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tabs button.active{background:var(--gold)}.small{font-size:12px}.footer{background:#14211f;color:#dfe8e5;text-align:center;padding:32px 20px;margin-top:30px}.footer a{color:#dfe8e5;margin:0 10px}@media(max-width:1050px){.search{grid-template-columns:1fr 1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{flex-direction:column;align-items:flex-start}.hero{min-height:550px}.hero h1{font-size:31px}.search{grid-template-columns:1fr}.cards,.grid2{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.gallery-main{height:240px}.gallery-side img{height:105px}.modal-actions{flex-direction:column}}

<body>
<header><a class="logo" href="#" onclick="home();return false">Kri<span>Dari</span></a><div id="nav" class="nav"></div></header>
<section class="hero"><div class="hero-content"><h1>🏠 لقّي دارك بسهولة</h1><p>منصة منظمة لكراء الشقق والعقارات في الجزائر</p><div class="search"><select id="sw"><option value="">كل الولايات</option></select><select id="st"><option value="">كل الأنواع</option></select><select id="sp"><option value="">كل أنواع الكراء</option><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select><input id="sprice" type="number" placeholder="أقصى سعر DA"><input id="stext" placeholder="المدينة أو العنوان"><button onclick="searchProperties()">🔎 بحث</button></div></div></section>
<main><div class="title-row"><h2>العقارات المتاحة</h2><span id="count" class="muted"></span></div><div id="cards" class="cards"></div></main>
<footer class="footer"><strong>KriDari</strong><br>منصة كراء العقارات في الجزائر<br><a href="#" onclick="showPrivacy();return false">الخصوصية والشروط</a><a href="#" onclick="showSafety();return false">السلامة والتبليغ</a>© 2026</footer>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://rvhqwpynhlgcscscybse.supabase.co';const SUPABASE_KEY='sb_publishable_HTJaBpq4c4JSyk5ybSOyNg_QS8tx3WE';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const ADMIN='rami.chemist11@gmail.com';let user=null,admin=false,current=[],regDraft={};const W=['الجزائر','وهران','قسنطينة','غليزان','عنابة','سطيف','مستغانم','تلمسان','الشلف','البليدة','بجاية','تيزي وزو','سيدي بلعباس'];const T=['F1','F2','F3','F4','F5','Villa','Studio','Duplex','Local commercial','Terrain'];const P={daily:'يومي',monthly:'شهري',yearly:'سنوي'};
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function toast(m){const x=document.getElementById('toast');x.textContent=m;x.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.remove('show'),3500)}function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function home(){scrollTo({top:0,behavior:'smooth'})}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});function statusLabel(s){return s==='approved'?'منشور':s==='pending'?'قيد المراجعة':s==='rejected'?'مرفوض':s==='hidden'?'مخفي':s==='deleted'?'محذوف':s==='suspended'?'موقوف':s}
async function getUser(){const{data:{session}}=await sb.auth.getSession();user=session?.user||null;admin=false;if(user){try{const{data}=await sb.rpc('get_my_role');admin=data==='admin'}catch(e){}if(!admin)admin=(user.email||'').toLowerCase()===ADMIN;if(user.email_confirmed_at===null){await sb.auth.signOut();const email=session.user.email;user=null;openConfirmation(email)}}renderNav()}
sb.auth.onAuthStateChange((event,session)=>{user=session?.user||null;admin=false;if(user){sb.rpc('get_my_role').then(({data})=>{admin=data==='admin'||(user.email||'').toLowerCase()===ADMIN;renderNav()}).catch(()=>renderNav())}else renderNav();if(event==='SIGNED_IN')loadProperties()});
function renderNav(){const n=document.getElementById('nav');if(user){const name=user.user_metadata?.full_name||user.email?.split('@')[0]||'مستخدم';n.innerHTML=`<span class="user">مرحبًا <strong>${esc(name)}</strong></span><button onclick="openAddProperty()">+ أضف عقارك</button><button class="secondary" onclick="myProperties()">عقاراتي</button>${admin?'<button class="gold" onclick="openAdmin()">🛡️ لوحة التحكم</button>':''}<button class="secondary" onclick="logout()">خروج</button>`}else n.innerHTML='<button onclick="openAddProperty()">+ أضف عقارك</button><button class="secondary" onclick="openLogin()">تسجيل الدخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button>'}
function openLogin(msg=''){openModal(`<h2>🔐 تسجيل الدخول</h2>${msg?`<div class="warning">${esc(msg)}</div>`:''}<div class="form-group"><label>البريد الإلكتروني</label><input id="le" type="email" autocomplete="email"></div><div class="form-group"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"></div><div class="modal-actions"><button onclick="login()">دخول</button><button class="secondary" onclick="openRegister()">إنشاء حساب</button></div><hr><button class="secondary" onclick="openResend()">📩 إعادة إرسال تأكيد البريد</button>`)}
async function login(){const email=le.value.trim(),password=lp.value;if(!email||!password)return toast('أدخل البريد وكلمة المرور');const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return openLogin(/not confirmed|confirm|verified/i.test(error.message)?'البريد الإلكتروني غير مؤكد. افتح رسالة التأكيد أو أعد إرسالها.':error.message);if(data.user?.email_confirmed_at===null){await sb.auth.signOut();return openConfirmation(email)}closeModal();toast('تم تسجيل الدخول بنجاح ✅')}
function openRegister(){const d=regDraft;openModal(`<h2>📝 إنشاء حساب</h2><div class="form-group"><label>الاسم الكامل *</label><input id="rn" value="${esc(d.name||'')}"></div><div class="form-group"><label>رقم الهاتف *</label><input id="rp" value="${esc(d.phone||'')}" type="tel"></div><div class="form-group"><label>البريد الإلكتروني *</label><input id="re" value="${esc(d.email||'')}" type="email"></div><div class="form-group"><label>كلمة المرور *</label><input id="rpass" type="password" minlength="6"></div><div class="check"><input id="privacy" type="checkbox" ${d.privacy?'checked':''}><label for="privacy">أوافق على <a href="#" onclick="privacyFromRegister();return false">شروط الاستخدام وسياسة الخصوصية</a>، وأقر بأن KriDari منصة عرض وربط وليست طرفًا في عقد الكراء، وأنني مسؤول عن صحة معلوماتي وعن التحقق من أي معاملة أو محتوى مشبوه.</label></div><div class="modal-actions"><button onclick="register()">إنشاء الحساب</button><button class="secondary" onclick="openLogin()">لدي حساب</button></div>`)}
function privacyFromRegister(){regDraft={name:rn?.value||'',phone:rp?.value||'',email:re?.value||'',privacy:privacy?.checked||false};showPrivacy(true)}
async function register(){const name=rn.value.trim(),phone=rp.value.trim(),email=re.value.trim(),password=rpass.value;if(!name||!phone||!email||!password)return toast('يرجى ملء جميع المعلومات');if(password.length<6)return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');if(!privacy.checked)return toast('يجب الموافقة على شروط الخصوصية');regDraft={name,phone,email,privacy:true};const redirectTo=location.origin+location.pathname;const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:redirectTo,data:{full_name:name,phone,privacy_accepted:true,privacy_accepted_at:new Date().toISOString(),terms_version:'2026-08'}}});if(error)return toast(error.message);if(data.user&&!data.session){closeModal();openConfirmation(email);toast('تم إنشاء الحساب. تحقق من بريدك الإلكتروني 📩')}else{closeModal();toast('تم إنشاء الحساب بنجاح 🎉')}}
function openConfirmation(email){openModal(`<div class="success"><div class="success-icon">📩</div><h2>تأكيد البريد الإلكتروني</h2><p>تم إنشاء الحساب للبريد:</p><strong>${esc(email||'')}</strong><p class="muted">لن يتم السماح بالدخول قبل تأكيد البريد الإلكتروني.</p><button onclick="openResend('${esc(email||'')}')">إعادة إرسال رسالة التأكيد</button><br><br><button class="secondary" onclick="openLogin()">العودة للدخول</button></div>`)}
function openResend(email=''){openModal(`<h2>📩 إعادة إرسال تأكيد البريد</h2><div class="form-group"><label>البريد الإلكتروني</label><input id="resendEmail" type="email" value="${esc(email)}"></div><button onclick="resendConfirmation()">إرسال</button>`)}
async function resendConfirmation(){const email=resendEmail.value.trim();if(!email)return toast('أدخل البريد');const{error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return toast(error.message);toast('تم طلب إرسال رسالة التأكيد. افحص Spam أيضًا 📩')}
async function logout(){await sb.auth.signOut();toast('تم تسجيل الخروج')}
async function loadProperties(){const{data,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').eq('status','approved').order('created_at',{ascending:false});if(error){console.error(error);return toast('تعذر تحميل العقارات')}current=data||[];renderProperties(current)}
function imageURL(path){return path?sb.storage.from('property-images').getPublicUrl(path).data.publicUrl:''}
function renderProperties(list){document.getElementById('count').textContent=`${list.length} عقار`;const c=document.getElementById('cards');if(!list.length){c.innerHTML='<div class="empty"><h3>لا توجد عقارات متاحة حاليًا</h3></div>';return}c.innerHTML=list.map(p=>{const imgs=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=imgs.find(x=>x.is_main)||imgs[0],img=m?imageURL(m.image_path):'';return `<article class="card"><div class="card-image">${img?`<img src="${img}" alt="${esc(p.title)}">`:'<div style="height:100%;display:grid;place-items:center;font-size:60px">🏠</div>'}<span class="badge">${esc(P[p.rental_period]||p.rental_period||'شهري')}</span></div><div class="card-body"><div class="price">${Number(p.price||0).toLocaleString('fr-DZ')} DA <span class="period">/ ${esc(P[p.rental_period]||'شهري')}</span></div><h3>${esc(p.title)}</h3><p class="muted">📍 ${esc(p.city||'')}، ${esc(p.wilaya||'')}</p><div class="chips"><span class="chip">${esc(p.property_type||'')}</span><span class="chip">${p.rooms||1} غرف</span>${p.furnished?'<span class="chip">مفروشة</span>':''}</div><div class="actions"><button onclick="showDetails('${p.id}')">التفاصيل</button><button class="secondary" onclick="favorite('${p.id}')">❤️</button></div></div></article>`}).join('')}
function searchProperties(){const w=sw.value,t=st.value,period=sp.value,price=Number(sprice.value),text=stext.value.trim().toLowerCase();renderProperties(current.filter(p=>(!w||p.wilaya===w)&&(!t||p.property_type===t)&&(!period||p.rental_period===period)&&(!price||Number(p.price)<=price)&&(!text||`${p.title} ${p.city||''} ${p.wilaya||''} ${p.address||''}`.toLowerCase().includes(text))))}
function fillFilters(){sw.innerHTML='<option value="">كل الولايات</option>'+W.map(x=>`<option>${x}</option>`).join('');st.innerHTML='<option value="">كل الأنواع</option>'+T.map(x=>`<option>${x}</option>`).join('')}
function openAddProperty(){if(!user)return openLogin('يجب تسجيل الدخول قبل إضافة عقارك.');openModal(`<h2>🏠 إضافة عقار</h2><div class="form-group"><label>عنوان الإعلان *</label><input id="pt"></div><div class="grid2"><div class="form-group"><label>الولاية *</label><select id="pw"><option value="">اختر</option>${W.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>المدينة / البلدية *</label><input id="pc"></div><div class="form-group"><label>نوع العقار *</label><select id="ptype"><option value="">اختر</option>${T.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>عدد الغرف</label><input id="prooms" type="number" min="1" value="1"></div><div class="form-group"><label>نوع الكراء *</label><select id="pper"><option value="monthly">شهري</option><option value="daily">يومي</option><option value="yearly">سنوي</option></select></div><div class="form-group"><label>السعر DA *</label><input id="pprice" type="number" min="1"></div></div><div class="form-group"><label>العنوان</label><input id="paddr"></div><div class="form-group"><label>رقم الهاتف *</label><input id="pphone" type="tel" value="${esc(user.user_metadata?.phone||'')}"></div><div class="form-group"><label>الوصف</label><textarea id="pdesc"></textarea></div><div class="form-group"><label>الصور *</label><input id="pfiles" type="file" accept="image/jpeg,image/png,image/webp" multiple></div><div class="modal-actions"><button onclick="publishProperty()">🚀 إرسال للمراجعة</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
async function publishProperty(){const title=pt.value.trim(),wilaya=pw.value,city=pc.value.trim(),type=ptype.value,rooms=Number(prooms.value)||1,period=pper.value,price=Number(pprice.value),address=paddr.value.trim(),phone=pphone.value.trim(),description=pdesc.value.trim(),files=Array.from(pfiles.files||[]);if(!title||!wilaya||!city||!type||!price||!phone)return toast('أكمل المعلومات الأساسية');if(!files.length)return toast('أضف صورة واحدة على الأقل');if(files.length>10||files.some(f=>f.size>5*1024*1024||!/^image\/(jpeg|png|webp)$/.test(f.type)))return toast('الصور: حتى 10 صور، وكل صورة أقل من 5MB');const{data:p,error}=await sb.from('properties').insert({owner_id:user.id,title,description,wilaya,city,address,property_type:type,rooms,price,rental_period:period,phone,status:'pending'}).select().single();if(error)return toast(error.message);for(let i=0;i<files.length;i++){const f=files[i],path=`${user.id}/${p.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,up=await sb.storage.from('property-images').upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type});if(up.error){toast('تعذر رفع إحدى الصور');continue}await sb.from('property_images').insert({property_id:p.id,image_path:path,is_main:i===0,sort_order:i})}closeModal();toast('تم إرسال العقار للمراجعة ✅');loadProperties()}
function showDetails(id){const p=current.find(x=>x.id===id);if(!p)return;const imgs=(p.property_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),m=imgs.find(x=>x.is_main)||imgs[0];openModal(`<h2>${esc(p.title)}</h2>${m?`<div class="gallery"><img class="gallery-main" src="${imageURL(m.image_path)}"><div class="gallery-side">${imgs.filter(x=>x.id!==m.id).slice(0,4).map(x=>`<img src="${imageURL(x.image_path)}">`).join('')}</div></div>`:''}<div class="info"><p>📍 ${esc(p.city||'')}، ${esc(p.wilaya||'')}</p><p>🏠 ${esc(p.property_type||'')} · ${p.rooms||1} غرف · ${p.furnished?'مفروشة':'غير مفروشة'}</p><p>💰 <strong>${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${esc(P[p.rental_period]||'شهري')}</strong></p><p>📝 ${esc(p.description||'لا يوجد وصف')}</p></div><div class="modal-actions"><button onclick="requestVisit('${p.id}')">📅 طلب زيارة</button><button class="secondary" onclick="callOwner('${esc(p.phone||'')}')">📞 الاتصال</button><button class="danger" onclick="reportProperty('${p.id}')">🚨 تبليغ</button></div>`)}
function requestVisit(id){if(!user)return openLogin('سجل الدخول أولًا لإرسال طلب زيارة.');openModal(`<h2>📅 طلب زيارة</h2><div class="form-group"><label>التاريخ</label><input id="vd" type="date"></div><textarea id="vm" placeholder="رسالة للمالك"></textarea><button onclick="sendVisit('${id}')">إرسال الطلب</button>`)}async function sendVisit(id){if(!vd.value)return toast('اختر تاريخًا');const{error}=await sb.from('visit_requests').insert({property_id:id,user_id:user.id,requested_date:vd.value,message:vm.value.trim(),status:'pending'});if(error)return toast(error.message);closeModal();toast('تم إرسال طلب الزيارة ✅')}
async function favorite(id){if(!user)return openLogin('سجل الدخول لإضافة المفضلة.');const{data}=await sb.from('favorites').select('id').eq('user_id',user.id).eq('property_id',id).maybeSingle();if(data)await sb.from('favorites').delete().eq('id',data.id);else await sb.from('favorites').insert({user_id:user.id,property_id:id});toast(data?'تم حذف العقار من المفضلة':'تمت إضافة العقار للمفضلة ❤️')}
function reportProperty(id){if(!user)return openLogin('سجل الدخول أولًا لإرسال بلاغ.');openModal(`<h2>🚨 التبليغ عن مشكلة</h2><p class="muted">اختر السبب واكتب التفاصيل. سيتم تسجيل البلاغ ومراجعته من الإدارة.</p><div class="form-group"><label>السبب</label><select id="rr"><option value="suspected_scam">احتيال / نشاط مشبوه</option><option value="fake">إعلان وهمي</option><option value="inappropriate">محتوى غير مناسب</option><option value="duplicate">إعلان مكرر</option><option value="other">أخرى</option></select></div><textarea id="rd" placeholder="التفاصيل"></textarea><button onclick="sendReport('${id}')">إرسال البلاغ</button>`)}async function sendReport(id){const{data,error}=await sb.from('reports').insert({property_id:id,reporter_id:user.id,reason:rr.value,details:rd.value.trim(),message:rd.value.trim(),status:'pending'}).select('id').single();if(error)return toast(error.message);openModal(`<div class="success"><div class="success-icon">✅</div><h2>تم استلام البلاغ</h2><p>شكرًا لك. تم تسجيل البلاغ بنجاح.</p><p class="muted">رقم البلاغ: <strong>${esc(data.id)}</strong></p><button onclick="closeModal()">حسنًا</button></div>`)}
function callOwner(phone){if(phone)location.href='tel:'+phone;else toast('رقم الهاتف غير متوفر')}
async function myProperties(){if(!user)return openLogin();const{data,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return toast(error.message);openModal(`<h2>🏠 عقاراتي</h2>${(data||[]).map(p=>`<div class="admin-row"><strong>${esc(p.title)}</strong><p>${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${esc(P[p.rental_period]||'')}</p><span class="status ${esc(p.status)}">${esc(statusLabel(p.status))}</span></div>`).join('')||'<div class="empty">لا توجد عقارات</div>')}
function showPrivacy(back=false){openModal(`<h2>🔐 الخصوصية وشروط الاستخدام</h2><p class="muted">تُستخدم بيانات الحساب والإعلانات وطلبات الزيارة لتشغيل KriDari. يجب تقديم معلومات صحيحة وعدم نشر الاحتيال أو المحتوى غير القانوني أو المسيء.</p><p class="muted">KriDari منصة تقنية للعرض والربط وليست طرفًا في عقد الكراء ولا تضمن هوية المستخدم أو صحة الإعلان. المستخدم مسؤول عن التحقق قبل الدفع أو التعاقد.</p><p class="muted">يمكن التبليغ عن المحتوى المشبوه، وتراجع الإدارة البلاغات وتتخذ الإجراء المناسب. قد تطلب الإدارة إثباتات أو توقف أو تحذف الإعلان عند الحاجة.</p><p class="muted">الموافقة على الشروط مطلوبة لإنشاء الحساب.</p>${back?'<button class="secondary" onclick="openRegister()">↩ العودة إلى التسجيل</button>':''}`)}function showSafety(){openModal(`<h2>🛡️ السلامة والتبليغ</h2><p class="muted">لا تدفع قبل التحقق من العقار والمالك. لا تشارك كلمات المرور أو رموز التأكيد. عند الاشتباه استخدم زر 🚨 تبليغ.</p>`)}
async function openAdmin(){if(!admin)return toast('غير مصرح');const{data:props,error}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').order('created_at',{ascending:false});if(error)return toast(error.message);const{data:reports,error:re}=await sb.rpc('admin_get_reports');if(re)return toast(re.message);openModal(`<h2>🛡️ لوحة التحكم</h2><div class="tabs"><button class="active" onclick="renderAdminProps(${JSON.stringify(props||[]).replace(/</g,'\\u003c')})">🏠 العقارات</button><button onclick="renderAdminReports(${JSON.stringify(reports||[]).replace(/</g,'\\u003c')})">🚨 البلاغات (${(reports||[]).filter(x=>x.status==='pending').length})</button></div><div id="adminBody"></div>`);renderAdminProps(props||[]);window.__adminReports=reports||[]}
function renderAdminProps(props){const b=document.getElementById('adminBody');if(!b)return;b.innerHTML=props.map(p=>`<div class="admin-row"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(p.title)}</strong><span class="status ${esc(p.status)}">${esc(statusLabel(p.status))}</span></div><p class="muted">${esc(p.city||'')}، ${esc(p.wilaya||'')} · ${Number(p.price||0).toLocaleString('fr-DZ')} DA</p><div class="modal-actions"><button onclick="adminApprove('${p.id}')">✅ نشر</button><button class="secondary" onclick="adminHide('${p.id}')">👁️ إخفاء</button><button class="danger" onclick="adminDelete('${p.id}')">🗑️ حذف</button>${['hidden','suspended'].includes(p.status)?`<button class="ok" onclick="adminRestore('${p.id}')">♻️ استرجاع</button>`:''}</div></div>`).join('')||'<div class="empty">لا توجد عقارات</div>'}
function renderAdminReports(reports){const b=document.getElementById('adminBody');if(!b)return;b.innerHTML=(reports||[]).map(r=>`<div class="admin-row report"><strong>🚨 ${esc(r.property_title||'إعلان')}</strong><p class="small">الحالة: ${esc(r.status)} · ${new Date(r.created_at).toLocaleString('fr-DZ')}</p><p><strong>المدعي:</strong> ${esc(r.reporter_name||'غير معروف')} · ${esc(r.reporter_email||'')} · ${esc(r.reporter_phone||'')}</p><p><strong>المدعى عليه:</strong> ${esc(r.owner_name||'غير معروف')} · ${esc(r.owner_email||'')} · ${esc(r.owner_phone||'')}</p><p class="muted">${esc(r.reason||'')} — ${esc(r.details||r.message||'')}</p><p>تواصل المدعي: ${r.complainant_contacted?'✅':'❌'} · تواصل المدعى عليه: ${r.defendant_contacted?'✅':'❌'} · إثبات مطلوب: ${r.evidence_requested?'✅':'❌'}</p><div class="modal-actions"><button onclick="setContact('${r.report_id}','complainant')">📞 تواصل مع المدعي</button><button onclick="setContact('${r.report_id}','defendant')">📞 تواصل مع المدعى عليه</button><button class="gold" onclick="resolveReport('${r.report_id}','evidence')">📄 طلب إثبات</button><button class="secondary" onclick="resolveReport('${r.report_id}','warning')">⚠️ تنبيه</button><button class="secondary" onclick="resolveReport('${r.report_id}','dismiss')">❌ رفض</button><button class="danger" onclick="resolveReport('${r.report_id}','hide')">⛔ إيقاف</button><button class="danger" onclick="resolveReport('${r.report_id}','delete')">🗑️ حذف الإعلان</button></div></div>`).join('')||'<div class="empty">لا توجد بلاغات</div>'}
async function setContact(id,side){const{error}=await sb.rpc('admin_set_report_contact',{p_report_id:id,p_side:side,p_contacted:true});if(error)return toast(error.message);toast('تم تسجيل التواصل');openAdmin()}
async function resolveReport(id,decision){const note=prompt(decision==='evidence'?'ما الإثبات المطلوب؟':'ملاحظة الإدارة (اختياري):','');if(note===null)return;const{error}=await sb.rpc('admin_resolve_report',{p_report_id:id,p_decision:decision,p_note:note||null});if(error)return toast(error.message);toast('تم حفظ قرار الإدارة');openAdmin();loadProperties()}
async function adminApprove(id){const{error}=await sb.rpc('admin_set_property_status',{p_property_id:id,p_status:'approved',p_reason:'تمت الموافقة من الإدارة'});if(error)return toast(error.message);toast('تم نشر الإعلان ✅');openAdmin();loadProperties()}
async function adminHide(id){const reason=prompt('سبب الإخفاء:','مراجعة إدارية');if(reason===null)return;const{error}=await sb.rpc('admin_hide_property',{p_property_id:id,p_reason:reason});if(error)return toast(error.message);toast('تم إخفاء الإعلان');openAdmin();loadProperties()}
async function adminDelete(id){if(!confirm('هل أنت متأكد من حذف الإعلان؟ سيتم تسجيل العملية في سجل الإدارة.'))return;const reason=prompt('سبب الحذف:','مخالفة أو قرار إداري');if(reason===null)return;const{error}=await sb.rpc('admin_delete_property',{p_property_id:id,p_reason:reason});if(error)return toast(error.message);toast('تم حذف الإعلان إداريًا');openAdmin();loadProperties()}
async function adminRestore(id){const reason=prompt('سبب الاسترجاع:','تمت مراجعة الإعلان');if(reason===null)return;const{error}=await sb.rpc('admin_restore_property',{p_property_id:id,p_reason:reason});if(error)return toast(error.message);toast('تم استرجاع الإعلان');openAdmin();loadProperties()}
fillFilters();getUser();loadProperties();
</script>
</body>
</html>
