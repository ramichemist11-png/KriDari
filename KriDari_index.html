<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>KriDari</title><style>body{margin:0;font-family:Arial;background:#f6f8f7;color:#172033}header{padding:16px 6%;background:#fff;display:flex;justify-content:space-between}.logo{font-size:29px;font-weight:bold;color:#176b5b}.logo span{color:#f29f05}button{border:0;border-radius:9px;padding:11px 16px;background:#176b5b;color:#fff}.hero{background:#176b5b;color:#fff;text-align:center;padding:60px 20px}.hero h1{font-size:40px}.search{max-width:900px;margin:25px auto 0;background:white;padding:10px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}select,input{padding:12px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}.wrap{max-width:1100px;margin:auto;padding:35px 6%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid #ddd;border-radius:14px;overflow:hidden}.photo{height:160px;background:linear-gradient(135deg,#d9e6e2,#efd4a5);padding:12px}.body{padding:16px}.price{font-size:20px;font-weight:bold;color:#176b5b}.muted{color:#68717e;font-size:14px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.box{background:white;padding:24px;border-radius:15px;width:min(500px,100%)}@media(max-width:800px){.cards{grid-template-columns:1fr}.search{grid-template-columns:1fr}.hero h1{font-size:30px}}</style></head><body><header><div class="logo">Kri<span>Dari</span></div><div><button onclick="login()">تسجيل الدخول</button> <button onclick="add()">+ أضف عقارك</button></div></header><section class="hero"><h1>لقّي دارك بسهولة 🏠</h1><p>منصة كراء الشقق والعقارات في الجزائر</p><div class="search"><select id="w"><option value="">كل الولايات</option><option>وهران</option><option>الجزائر</option><option>قسنطينة</option><option>غليزان</option></select><select id="t"><option value="">كل الأنواع</option><option>F1</option><option>F2</option><option>F3</option><option>F4</option><option>Villa</option></select><input id="m" type="number" placeholder="أقصى سعر DA"><button onclick="search()">بحث 🔎</button></div></section><main class="wrap"><h2>العقارات المتاحة</h2><div id="cards" class="cards"></div></main><div id="modal" class="modal"><div class="box"><div id="content"></div></div></div><script>const data=[["شقة F3 عصرية","وهران","السانية","F3",45000,3,"مفروشة"],["شقة F2 وسط المدينة","الجزائر","باب الزوار","F2",38000,2,"غير مفروشة"],["F4 واسعة للعائلات","قسنطينة","الخروب","F4",55000,4,"غير مفروشة"],["F1 مفروشة","وهران","وهران","F1",30000,1,"مفروشة"],["Villa عائلية","غليزان","غليزان","Villa",85000,5,"غير مفروشة"]];function render(a=data){document.getElementById("cards").innerHTML=a.map((p,i)=>`<article class="card"><div class="photo">✓ إعلان</div><div class="body"><div class="price">${p[4].toLocaleString("fr-DZ")} DA / شهر</div><h3>${p[0]}</h3><p class="muted">📍 ${p[2]}، ${p[1]}</p><p class="muted">${p[3]} · ${p[5]} غرف · ${p[6]}</p><button onclick="detail(${i})">التفاصيل</button></div></article>`).join("")}function search(){let w=document.getElementById("w").value,t=document.getElementById("t").value,m=+document.getElementById("m").value;render(data.filter(p=>(!w||p[1]==w)&&(!t||p[3]==t)&&(!m||p[4]<=m)))}function show(x){document.getElementById("content").innerHTML=x;document.getElementById("modal").style.display="flex"}function login(){show("<h2>تسجيل الدخول</h2><input type=email placeholder=البريد><br><br><button onclick=alert('سيتم تفعيل الدخول الحقيقي بعد ربط قاعدة البيانات')>دخول</button>")}function add(){show("<h2>أضف عقارك</h2><input placeholder='عنوان العقار'><br><br><input type=number placeholder='السعر'><br><br><input type=file multiple accept='image/*'><br><br><button onclick=alert('سيتم تفعيل النشر الحقيقي بعد ربط قاعدة البيانات')>نشر العقار</button>")}function detail(i){let p=data[i];show(`<h2>${p[0]}</h2><p>📍 ${p[2]}، ${p[1]}</p><h3>${p[4].toLocaleString("fr-DZ")} DA / شهر</h3><p>${p[3]} · ${p[5]} غرف · ${p[6]}</p><button onclick="alert('سيتم تفعيل طلب الزيارة في النسخة القادمة')">طلب زيارة</button>`)}render()</script></body></html>
