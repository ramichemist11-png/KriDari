name: Repair KriDari app
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          old="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1800&q=85"
          new="https://images.pexels.com/photos/8470800/pexels-photo-8470800.jpeg?auto=compress&cs=tinysrgb&w=1800"
          s=s.replace(old,new)
          old_send="async function sendReport(id){const{data,error}=await sb.from('reports').insert({property_id:id,reporter_id:user.id,reason:$('rr').value,details:$('rd').value.trim(),message:$('rd').value.trim(),status:'pending'}).select('id').single();if(error)return toast(error.message);openModal(`"
          new_send="async function sendReport(id){const{data,error}=await sb.from('reports').insert({property_id:id,reporter_id:user.id,reason:$('rr').value,details:$('rd').value.trim(),message:$('rd').value.trim(),status:'pending'}).select('id').single();if(error)return toast(error.message);try{const{data:p}=await sb.from('properties').select('owner_id,title').eq('id',id).single();if(p?.owner_id)await sb.from('notifications').insert({user_id:p.owner_id,title:'تم تقديم بلاغ بشأن إعلانك',message:'تم تقديم شكوى بشأن إعلانك. يرجى متابعة التنبيهات وتقديم ما يثبت صحة الإعلان عند طلب الإدارة.',type:'report'})}catch(e){console.warn('notification unavailable',e)}openModal(`"
          if old_send not in s:
              raise SystemExit('sendReport pattern not found')
          s=s.replace(old_send,new_send,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || git commit -m 'fix KriDari background and report notifications'
          git push
