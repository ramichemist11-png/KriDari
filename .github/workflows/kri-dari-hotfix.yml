name: KriDari production hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'ramichemist11-png'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Privacy page must not destroy the registration form; preserve a draft and provide a back button.
          old=re.search(r'function openRegister\(\)\{.*?\nasync function register',s,re.S)
          new='''function openRegister(){const d=window.regDraft||{};openModal(`<h2>📝 إنشاء حساب</h2><div class="form-group"><label>الاسم الكامل *</label><input id="rn" autocomplete="name" value="${esc(d.name||'')}"></div><div class="form-group"><label>رقم الهاتف *</label><input id="rp" type="tel" autocomplete="tel" value="${esc(d.phone||'')}"></div><div class="form-group"><label>البريد الإلكتروني *</label><input id="re" type="email" autocomplete="email" value="${esc(d.email||'')}"></div><div class="form-group"><label>كلمة المرور *</label><input id="rpass" type="password" minlength="6" autocomplete="new-password"></div><div class="check"><input id="privacy" type="checkbox" ${d.privacy?'checked':''}><label for="privacy">أوافق على <a href="#" onclick="openPrivacyFromRegister();return false">شروط الاستخدام وسياسة الخصوصية</a>، وأقر بأن KriDari منصة للعرض والربط وليست طرفًا في عقد الكراء، وأنني مسؤول عن صحة ما أنشره، وسأبلغ عن أي نشاط أو محتوى مشبوه.</label></div><div class="modal-actions"><button onclick="register()">إنشاء الحساب</button><button class="secondary" onclick="openLogin()">لدي حساب</button></div>`)}
function openPrivacyFromRegister(){window.regDraft={name:document.getElementById('rn')?.value||'',phone:document.getElementById('rp')?.value||'',email:document.getElementById('re')?.value||'',privacy:!!document.getElementById('privacy')?.checked};showPrivacy(true)}
function showPrivacy(back=false){openModal(`<h2>🔐 الخصوصية وشروط الاستخدام</h2><p class="muted">يستخدم KriDari بيانات الحساب والإعلانات وطلبات الزيارة لتشغيل المنصة. يلتزم المستخدم بتقديم معلومات صحيحة وعدم نشر محتوى احتيالي أو غير قانوني أو مسيء.</p><p class="muted">KriDari منصة تقنية للعرض والربط بين المستخدمين وليست طرفًا في عقد الكراء ولا تضمن هوية أي مستخدم أو صحة كل إعلان. يجب التحقق قبل الدفع أو التعاقد.</p><p class="muted">يمكن التبليغ عن أي محتوى أو سلوك مشبوه، وتقوم الإدارة بمراجعته واتخاذ الإجراء المناسب وفق القوانين والسياسات المعمول بها.</p><p class="muted">الموافقة على هذه الشروط مطلوبة لإنشاء حساب.</p>${back?'<button class="secondary" onclick="openRegister()">↩ العودة إلى التسجيل</button>':''}`)}
async function register'''
          if not old: raise SystemExit('openRegister block not found')
          s=s[:old.start()]+new+s[old.end()-len('async function register'):]

          # Safer auth UX: never imply that signup is complete without a confirmed session.
          s=s.replace("if(data.session){closeModal();toast('تم إنشاء الحساب بنجاح 🎉')}else{openConfirmation(email)}", "if(data.session){closeModal();toast('تم إنشاء الحساب بنجاح 🎉')}else{openConfirmation(email)}")

          # Replace admin report UI with a real moderation workflow backed by secure RPCs.
          a=re.search(r'async function openAdmin\(\)\{.*?\nasync function moderate',s,re.S)
          admin_new='''async function openAdmin(){if(!admin)return toast('غير مصرح');const{data:props,error:pe}=await sb.from('properties').select('*,property_images(id,image_path,is_main,sort_order)').order('created_at',{ascending:false});if(pe)return toast(pe.message);const{data:reports,error:re}=await sb.rpc('admin_get_reports');if(re)return toast(re.message);openModal(`<h2>🛡️ لوحة التحكم</h2><h3>📋 الإعلانات</h3>${props?.length?props.map(p=>`<div class="admin-row"><strong>${esc(p.title)}</strong><p class="muted">${esc(p.city||'')}، ${esc(p.wilaya||'')} · ${Number(p.price||0).toLocaleString('fr-DZ')} DA / ${P[p.rental_period]||'شهري'}</p><span class="status ${eStatus(p.status)}">${statusLabel(p.status)}</span><div class="actions">${p.status!=='approved'?`<button onclick="moderate('${p.id}','approved')">✅ قبول</button>`:''}${p.status!=='rejected'?`<button class="danger" onclick="moderate('${p.id}','rejected')">❌ رفض/إيقاف</button>`:''}</div></div>`).join(''):'<p class="muted">لا توجد إعلانات.</p>'}<hr><h3>🚨 البلاغات والشكاوى</h3>${reports?.length?reports.map(r=>`<div class="admin-row report"><strong>${esc(r.reason)}</strong><p class="muted">${esc(r.message||r.details||'لا تفاصيل')}</p><p><span class="status ${r.status==='pending'?'pending':r.status==='dismissed'?'rejected':'approved'}">${esc(r.status||'pending')}</span> ${r.moderation_action?`<span class="chip">${esc(r.moderation_action)}</span>`:''}</p><div class="info"><strong>👤 صاحب الشكوى</strong><p>${esc(r.reporter_name||'غير معروف')} · ${esc(r.reporter_phone||'')} · ${esc(r.reporter_email||'')}</p><div class="actions"><button class="secondary" onclick="contactPerson('mailto:${esc(r.reporter_email||'')}')">✉️ مراسلة</button><button class="secondary" onclick="contactPerson('tel:${esc(r.reporter_phone||'')}')">📞 اتصال</button><button class="ok" onclick="setContact('${r.report_id}','complainant',${!r.complainant_contacted})">${r.complainant_contacted?'✓ تم التواصل':'تأكيد التواصل'}</button></div><strong>🏠 المدعى عليه / صاحب الإعلان</strong><p>${esc(r.owner_name||'غير معروف')} · ${esc(r.owner_phone||'')} · ${esc(r.owner_email||'')}</p><div class="actions"><button class="secondary" onclick="contactPerson('mailto:${esc(r.owner_email||'')}')">✉️ مراسلة</button><button class="secondary" onclick="contactPerson('tel:${esc(r.owner_phone||'')}')">📞 اتصال</button><button class="ok" onclick="setContact('${r.report_id}','defendant',${!r.defendant_contacted})">${r.defendant_contacted?'✓ تم التواصل':'تأكيد التواصل'}</button></div></div><div class="actions"><button onclick="resolveReport('${r.report_id}','evidence')">📎 طلب إثبات/دفاع</button><button class="ok" onclick="resolveReport('${r.report_id}','warning')">⚠️ تنبيه</button><button class="secondary" onclick="resolveReport('${r.report_id}','dismiss')">✓ رفض الشكوى</button><button class="danger" onclick="resolveReport('${r.report_id}','hide')">🗑️ إيقاف الإعلان</button></div></div>`).join(''):'<p class="muted">لا توجد بلاغات.</p>'}`)}
function contactPerson(url){if(url&&url!=='mailto:'&&url!=='tel:')location.href=url;else toast('بيانات الاتصال غير متوفرة')}
async function setContact(id,side,value){const{error}=await sb.rpc('admin_set_report_contact',{p_report_id:id,p_side:side,p_contacted:value});if(error)return toast(error.message);openAdmin()}
async function resolveReport(id,decision){const labels={evidence:'طلب إثبات/دفاع',warning:'تنبيه',dismiss:'رفض الشكوى',hide:'إيقاف الإعلان'};const note=prompt(`قرار: ${labels[decision]}\\nملاحظة الإدارة (اختياري):`,'');if(note===null)return;const{error}=await sb.rpc('admin_resolve_report',{p_report_id:id,p_decision:decision,p_note:note||null});if(error)return toast(error.message);toast(decision==='hide'?'تم إيقاف الإعلان واتخاذ الإجراء.':decision==='dismiss'?'تم رفض الشكوى.':'تم تسجيل القرار بنجاح.');openAdmin();loadProperties()}
async function moderate'''
          if not a: raise SystemExit('openAdmin block not found')
          s=s[:a.start()]+admin_new+s[a.end()-len('async function moderate'):]

          # Replace reviewReport if present; new UI uses resolveReport.
          s=re.sub(r'\nasync function reviewReport\(id\)\{.*?\nfunction showPrivacy', '\nfunction showPrivacy', s, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate HTML/JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '</html>' in s and 'admin_get_reports' in s and 'openPrivacyFromRegister' in s and 'resolveReport' in s
          print('hotfix validation passed')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'ramichemist11-png'
          git config user.email 'rami.chemist11@gmail.com'
          git add index.html .github/workflows/kri-dari-hotfix.yml
          git commit -m 'fix: complete moderation workflow and privacy navigation' || exit 0
          git rm .github/workflows/kri-dari-hotfix.yml
          git commit -m 'chore: remove one-time hotfix workflow'
          git push origin main