<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f38"><title>KriDari | كراء العقارات في الجزائر</title><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>
:root{--g:#123f38;--g2:#176b5b;--gold:#c99a3d;--bg:#f5f7f5;--line:#dfe7e3;--danger:#b42318;--ok:#147a57}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#18211f}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:var(--g2);color:#fff;font-weight:800}button.secondary{background:#edf3f0;color:var(--g)}button.gold{background:var(--gold)}button.danger{background:#fff0ee;color:var(--danger)}header{position:sticky;top:0;z-index:50;background:#fffffff7;border-bottom:1px solid var(--line);padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:30px;font-weight:900;color:var(--g);text-decoration:none}.logo span{color:var(--gold)}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hero{min-height:540px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:50px 5%;background:linear-gradient(115deg,#092e28dd,#176b5bc9),url('https://images.pexels.com/photos/8470800/pexels-photo-8470800.jpeg?auto=compress&cs=tinysrgb&w=1800') center/cover}.hero h1{font-size:44px;margin:0 0 12px}.hero p{font-size:19px;margin:0 0 28px}.search{width:min(1100px,100%);display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.3fr auto;gap:8px;background:#fffffff5;padding:14px;border-radius:20px;box-shadow:0 20px 55px #0004}.search select,.search input{min-width:0}.search button{min-width:110px}main{max-width:1180px;margin:auto;padding:38px 5%}.title-row{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 35px #123f3815}.pic{height:210px;background:#dce9e5}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:17px}.price{font-size:21px;font-weight:900;color:var(--g)}.muted{color:#69736f;line-height:1.7}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}.empty{background:#fff;border:1px solid var(--line);padding:40px;text-align:center;border-radius:15px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:1000;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{position:relative;background:#fff;width:min(900px,100%);max-height:94vh;overflow:auto;border-radius:20px;padding:25px}.close{position:absolute;left:14px;top:13px;width:42px;height:42px;padding:0;border-radius:50%;background:#f0f2f1;color:#333;font-size:24px}.box h2{color:var(--g);margin:0 45px 20px 0}.field{margin:0 0 13px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d5ded9;border-radius:10px;background:#fff}.field textarea{min-height:110px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;gap:8px;margin-top:15px}.modal-actions>*{flex:1}.notice{background:#eef7f4;border:1px solid #c8e3da;padding:13px;border-radius:12px;margin:10px 0;line-height:1.7}.warning{background:#fff8e8;border:1px solid #ecd49b;padding:13px;border-radius:12px;margin:10px 0;line-height:1.7}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:3000;background:#172033;color:#fff;padding:13px 20px;border-radius:11px;max-width:92%;text-align:center}.toast.show{display:block}.status{display:inline-block;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:800}.approved{background:#e6f6ef;color:#176b5b}.pending{background:#fff5d8;color:#8a6200}.rejected{background:#fff0ef;color:#b42318}.footer{background:#14211f;color:#dfe8e5;text-align:center;padding:30px;margin-top:30px}@media(max-width:1050px){.search{grid-template-columns:1fr 1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{flex-direction:column;align-items:stretch}.nav{justify-content:center}.nav button{flex:1}.hero{min-height:560px}.hero h1{font-size:31px}.search,.grid,.cards{grid-template-columns:1fr}.modal-actions{flex-direction:column}}
</style></head><body>
<header><a class="logo" href="#" id="home">Kri<span>Dari</span></a><div id="nav" class="nav"></div></header>
<section class="hero"><div><h1>🏠 لقّي دارك بسهولة</h1><p>منصة منظمة لكراء الشقق والعقارات في الجزائر</p><div class="search"><select id="wilaya"><option value="">كل الولايات</option></select><select id="type"><option value="">كل الأنواع</option></select><select id="rent"><option value="">كل أنواع الكراء</option><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select><input id="max" type="number" placeholder="أقصى سعر DA"><input id="q" placeholder="المدينة أو العنوان"><button id="search">🔎 بحث</button></div></div></section>
<main><div class="title-row"><h2>العقارات المتاحة</h2><span id="count" class="muted"></span></div><div id="cards" class="cards"></div></main>
<footer class="footer">KriDari — منصة كراء العقارات في الجزائر<br><button class="secondary" id="privacy" style="margin-top:12px">الخصوصية والشروط</button><button class="secondary" id="safety" style="margin-top:12px">السلامة والتبليغ</button></footer>
<div class="modal" id="modal"><div class="box"><button class="close" id="close">×</button><div id="content"></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const URL='https://rvhqwpynhlgcscscybse.supabase.co',KEY='sb_publishable_HTJaBpq4c4JSyk5ybSOyNg_QS8tx3WE';
const sb=window.supabase?.createClient(URL,KEY);let user=null,admin=false,properties=[];
const W=['الجزائر','وهران','قسنطينة','غليزان','عنابة','سطيف','مستغانم','تلمسان','الشلف','البليدة','بجاية','تيزي وزو','سيدي بلعباس','باتنة','بسكرة','تيارت','الجلفة','المدية','ورقلة','بومرداس','تبسة','الوادي','أدرار','الأغواط','سكيكدة','جيجل','ميلة','معسكر','سعيدة','عين تموشنت','الطارف','خنشلة','سوق أهراس','تيسمسيلت','برج بوعريريج','قالمة','برج باجي مختار','بشار','تمنراست','إليزي','تندوف','البيض','النعامة','غرداية','المغير','المنيعة','أولاد جلال'];
const T=['F1','F2','F3','F4','F5','Villa','Studio','Duplex','Local commercial','Terrain'];
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),3500)}function open(h){$('content').innerHTML=h;$('modal').classList.add('show');document.body.style.overflow='hidden'}function close(){ $('modal').classList.remove('show');document.body.style.overflow=''}
function fillFilters(){W.forEach(x=>$('wilaya').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));T.forEach(x=>$('type').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`))}
function nav(){const n=$('nav');if(user){const name=esc(user.user_metadata?.full_name||user.email?.split('@')[0]||'مستخدم');n.innerHTML=`<span class="muted">مرحبًا <strong>${name}</strong></span><button id="add">+ أضف عقارك</button><button class="secondary" id="mine">عقاراتي</button>${admin?'<button class="gold" id="admin">🛡️ لوحة التحكم</button>':''}<button class="secondary" id="logout">خروج</button>`}else n.innerHTML='<button id="add">+ أضف عقارك</button><button class="secondary" id="login">تسجيل الدخول</button><button class="secondary" id="register">إنشاء حساب</button>';bindNav()}
function bindNav(){ $('login')?.addEventListener('click',loginModal);$('register')?.addEventListener('click',registerModal);$('add')?.addEventListener('click',addProperty);$('mine')?.addEventListener('click',mine);$('admin')?.addEventListener('click',adminPanel);$('logout')?.addEventListener('click',async()=>{await sb?.auth.signOut();user=null;admin=false;nav();load()}) }
function loginModal(){open(`<h2>🔐 تسجيل الدخول</h2><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password"></div><div class="modal-actions"><button id="doLogin">دخول</button><button class="secondary" id="toReg">إنشاء حساب</button></div><button class="secondary" style="margin-top:10px;width:100%" id="resend">📩 إعادة إرسال تأكيد البريد</button>`);$('doLogin').onclick=doLogin;$('toReg').onclick=registerModal;$('resend').onclick=resend}
async function doLogin(){const email=$('email').value.trim(),password=$('pass').value;if(!email||!password)return toast('أدخل البريد وكلمة المرور');const r=await sb.auth.signInWithPassword({email,password});if(r.error){toast(r.error.message);return}if(!r.data.user.email_confirmed_at){await sb.auth.signOut();return confirmation(email)}user=r.data.user;admin=user.email?.toLowerCase()==='rami.chemist11@gmail.com';close();nav();load();toast('تم تسجيل الدخول بنجاح ✅')}
function registerModal(){open(`<h2>📝 إنشاء حساب</h2><div class="grid"><div class="field"><label>الاسم الكامل *</label><input id="name"></div><div class="field"><label>الهاتف *</label><input id="phone" type="tel" placeholder="0550xxxxxx"></div></div><div class="field"><label>البريد الإلكتروني *</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور *</label><input id="pass" type="password" minlength="6"></div><label><input id="agree" type="checkbox"> أوافق على الخصوصية والشروط</label><div class="modal-actions"><button id="doReg">إنشاء الحساب</button><button class="secondary" id="toLogin">تسجيل الدخول</button></div>`);$('doReg').onclick=doRegister;$('toLogin').onclick=loginModal}
async function doRegister(){const name=$('name').value.trim(),phone=$('phone').value.trim(),email=$('email').value.trim(),password=$('pass').value;if(!name||!phone||!email||!password)return toast('يرجى ملء جميع المعلومات');if(password.length<6)return toast('كلمة المرور 6 أحرف على الأقل');if(!$('agree').checked)return toast('يجب الموافقة على الخصوصية');const r=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/',data:{full_name:name,phone}}});if(r.error)return toast(r.error.message);sessionStorage.setItem('pending_phone',phone);if(r.data.user&&!r.data.session)return confirmation(email);toast('تم إنشاء الحساب');close()}
function confirmation(email){open(`<div style="text-align:center"><div style="font-size:55px">📩</div><h2>تأكيد البريد الإلكتروني</h2><p class="muted">أرسلنا رابط التأكيد إلى <strong>${esc(email)}</strong>. لا يمكن الدخول قبل تأكيد البريد.</p><button id="resend2">إعادة إرسال البريد</button></div>`);$('resend2').onclick=resend}
async function resend(){const email=$('email')?.value?.trim()||prompt('أدخل بريدك الإلكتروني');if(!email)return;const r=await sb.auth.resend({type:'signup',email});toast(r.error?r.error.message:'تم إرسال رسالة التأكيد 📩')}
function addProperty(){if(!user)return loginModal();open(`<h2>🏠 إضافة عقار</h2><div class="grid"><div class="field"><label>العنوان *</label><input id="ptitle"></div><div class="field"><label>الولاية *</label><select id="pw"><option value="">اختر الولاية</option>${W.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>النوع *</label><select id="ptype"><option value="">اختر النوع</option>${T.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>نوع الكراء *</label><select id="prent"><option value="monthly">شهري</option><option value="daily">يومي</option><option value="yearly">سنوي</option></select></div><div class="field"><label>السعر DA *</label><input id="pprice" type="number"></div><div class="field"><label>الهاتف *</label><input id="pphone" value="${esc(user.user_metadata?.phone||'')}"></div></div><div class="field"><label>الوصف</label><textarea id="pdesc"></textarea></div><div class="field"><label>روابط الصور (اختياري، رابط في كل سطر)</label><textarea id="pimgs"></textarea></div><div class="notice">سيتم إرسال العقار للمراجعة. بعد القبول يظهر تلقائيًا كـ «تم قبول ونشر المنشور».</div><button id="publish" style="width:100%">نشر العقار</button>`);$('publish').onclick=publish}
async function publish(){const row={title:$('ptitle').value.trim(),wilaya:$('pw').value,type:$('ptype').value,rental_type:$('prent').value,price:Number($('pprice').value),phone:$('pphone').value.trim(),description:$('pdesc').value.trim(),images:$('pimgs').value.split('\n').map(x=>x.trim()).filter(Boolean),owner_id:user.id,status:'pending'};if(!row.title||!row.wilaya||!row.type||!row.price||!row.phone)return toast('أكمل المعلومات المطلوبة');const r=await sb.from('properties').insert(row).select().single();if(r.error){toast('تعذر حفظ العقار في قاعدة البيانات: '+r.error.message);return}close();toast('تم إرسال العقار للمراجعة ✅');load()}
async function load(){let q=sb.from('properties').select('*').eq('status','approved').order('created_at',{ascending:false});const w=$('wilaya').value,t=$('type').value,r=$('rent').value,m=$('max').value,txt=$('q').value.trim();if(w)q=q.eq('wilaya',w);if(t)q=q.eq('type',t);if(r)q=q.eq('rental_type',r);if(m)q=q.lte('price',Number(m));if(txt)q=q.or(`title.ilike.%${txt}%,city.ilike.%${txt}%,address.ilike.%${txt}%`);const res=await q;if(res.error){$('cards').innerHTML='<div class="empty">تعذر تحميل العقارات حاليًا.</div>';return}properties=res.data||[];render(properties)}
function render(list){$('count').textContent=`${list.length} عقار`;if(!list.length){$('cards').innerHTML='<div class="empty">لا توجد عقارات مطابقة حاليًا.</div>';return}$('cards').innerHTML=list.map(p=>{const img=Array.isArray(p.images)?p.images[0]:'';return `<article class="card"><div class="pic">${img?`<img src="${esc(img)}" alt="">`:''}</div><div class="body"><div class="price">DA ${Number(p.price||0).toLocaleString('fr-DZ')}</div><div>${esc(p.rental_type||'')} · ${esc(p.wilaya||p.city||'')}</div><h3>${esc(p.title||'عقار')}</h3><p class="muted">${esc(p.description||'')}</p><div class="actions"><button data-contact="${esc(p.phone||'')}">اتصال بصاحب العقار 📞</button><button class="secondary" data-wa="${esc(p.phone||'')}">WhatsApp 💬</button><button class="danger" data-report="${esc(p.id)}">إبلاغ 🚨</button></div></div></article>`}).join('');document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>{const p=b.dataset.contact;if(p)location.href='tel:'+p;else toast('رقم الهاتف غير متوفر')});document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{const p=(b.dataset.wa||'').replace(/\D/g,'').replace(/^0/,'213');if(p)location.href='https://wa.me/'+p;else toast('رقم WhatsApp غير متوفر')});document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>report(b.dataset.report))}
async function mine(){if(!user)return loginModal();const r=await sb.from('properties').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(r.error)return toast(r.error.message);open(`<h2>🏠 عقاراتي</h2>${r.data?.length?r.data.map(p=>`<div class="notice"><strong>${esc(p.title)}</strong><br><span class="status ${p.status}">${esc(p.status==='approved'?'تم قبول ونشر المنشور تلقائيًا':p.status==='pending'?'قيد المراجعة':p.status)}</span><br>${esc(p.wilaya||'')} · DA ${Number(p.price||0).toLocaleString('fr-DZ')}</div>`).join(''):'<div class="empty">لا توجد عقارات بعد.</div>'}`)}
async function report(id){if(!user)return loginModal();open(`<h2>🚨 الإبلاغ عن عقار</h2><div class="field"><label>سبب الإبلاغ</label><select id="reason"><option>العقار غير موجود</option><option>محتوى مخالف</option><option>احتيال</option><option>معلومات غير صحيحة</option><option>أخرى</option></select></div><div class="field"><label>التفاصيل</label><textarea id="details"></textarea></div><button id="sendReport" style="width:100%">إرسال الشكوى</button>`);$('sendReport').onclick=async()=>{const r=await sb.from('reports').insert({property_id:id,reporter_id:user.id,reason:$('reason').value,details:$('details').value,status:'pending'});if(r.error)return toast(r.error.message);close();toast('تم إرسال الشكوى بنجاح. سيتم إشعارك عند تحديثها.');}}
async function adminPanel(){if(!admin)return toast('غير مصرح');const [p,r]=await Promise.all([sb.from('properties').select('*').order('created_at',{ascending:false}),sb.from('reports').select('*').order('created_at',{ascending:false})]);open(`<h2>🛡️ لوحة التحكم</h2><div class="notice"><strong>العقارات: ${p.data?.length||0}</strong> — <strong>البلاغات: ${r.data?.length||0}</strong></div><h3>العقارات</h3>${(p.data||[]).map(x=>`<div class="notice"><strong>${esc(x.title)}</strong><br>${esc(x.wilaya||'')} · DA ${Number(x.price||0).toLocaleString('fr-DZ')}<div class="modal-actions"><button data-approve="${x.id}">قبول ونشر</button><button class="secondary" data-hide="${x.id}">إخفاء</button><button class="danger" data-delete="${x.id}">حذف</button></div></div>`).join('')||'<p>لا توجد</p>'}<h3>البلاغات</h3>${(r.data||[]).map(x=>`<div class="notice"><strong>${esc(x.reason||'بلاغ')}</strong><br>${esc(x.details||'')}<div class="modal-actions"><button data-report-action="${x.id}">قبول/معالجة</button><button class="danger" data-report-reject="${x.id}">رفض</button></div></div>`).join('')||'<p>لا توجد</p>'}`);bindAdmin()}
function bindAdmin(){document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{const r=await sb.from('properties').update({status:'approved'}).eq('id',b.dataset.approve);toast(r.error?r.error.message:'تم قبول ونشر المنشور تلقائيًا ✅');adminPanel()});document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{const r=await sb.from('properties').update({status:'hidden'}).eq('id',b.dataset.hide);toast(r.error?r.error.message:'تم إخفاء المنشور');adminPanel()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const r=await sb.from('properties').delete().eq('id',b.dataset.delete);toast(r.error?r.error.message:'تم حذف المنشور');adminPanel()});document.querySelectorAll('[data-report-action]').forEach(b=>b.onclick=async()=>{const r=await sb.from('reports').update({status:'reviewed'}).eq('id',b.dataset.reportAction);toast(r.error?r.error.message:'تمت معالجة الشكوى — تم طلب الإثبات عند الحاجة');adminPanel()});document.querySelectorAll('[data-report-reject]').forEach(b=>b.onclick=async()=>{const r=await sb.from('reports').update({status:'rejected'}).eq('id',b.dataset.reportReject);toast(r.error?r.error.message:'تم رفض الشكوى');adminPanel()})}
$('close').onclick=close;$('home').onclick=e=>{e.preventDefault();scrollTo({top:0,behavior:'smooth'})};$('search').onclick=load;$('privacy').onclick=()=>open('<h2>🔒 الخصوصية والشروط</h2><p class="muted">نحترم بيانات المستخدمين ونستخدم المعلومات اللازمة لتشغيل KriDari. لا تنشر معلومات حساسة داخل وصف العقار.</p>');$('safety').onclick=()=>open('<h2>🛡️ السلامة والتبليغ</h2><p class="muted">استعمل الإبلاغ عند وجود احتيال أو معلومات غير صحيحة. عند طلب الإثبات تظهر حالة انتظار التأكيد ويتم إشعار الأطراف عند تحديث الشكوى.</p>');
fillFilters();(async()=>{if(!sb){toast('تعذر تحميل خدمة الحسابات');nav();return}const s=await sb.auth.getSession();user=s.data.session?.user||null;admin=user?.email?.toLowerCase()==='rami.chemist11@gmail.com';nav();load()})();
</script></body></html>
